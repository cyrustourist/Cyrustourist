name: Build offline places database

on:
  workflow_dispatch:
  schedule:
    # first day of every 3rd month, 04:00 UTC
    - cron: "0 4 1 */3 *"

permissions:
  contents: write

jobs:
  poi:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Download Iran extract (OpenStreetMap / Geofabrik)
        run: |
          wget -q -O iran.osm.pbf https://download.geofabrik.de/asia/iran-latest.osm.pbf
          ls -lh iran.osm.pbf

      - name: Filter places
        run: |
          osmium tags-filter iran.osm.pbf \
            nwr/tourism nwr/historic \
            nwr/leisure=park,nature_reserve \
            nwr/amenity=hospital,clinic,doctors,pharmacy,spa \
            nwr/natural=waterfall,hot_spring \
            nwr/healthcare \
            -o filtered.osm.pbf --overwrite

      - name: Export to GeoJSON sequence
        run: |
          osmium export filtered.osm.pbf -f geojsonseq \
            --attributes=type,id \
            -o features.geojsonseq --overwrite
          ls -lh features.geojsonseq

      - name: Build assets/poi/iran_poi.bin
        run: |
          python3 tools/build_poi_db.py features.geojsonseq assets/poi/iran_poi.bin
          ls -lh assets/poi/iran_poi.bin
          size=$(stat -c %s assets/poi/iran_poi.bin)
          if [ "$size" -lt 100000 ]; then
            echo "Database too small ($size bytes) - something went wrong"; exit 1
          fi

      - name: Commit database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/poi/iran_poi.bin
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh offline places database [skip ci]"
            git push
          fi
