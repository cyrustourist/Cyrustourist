name: Build CyrusTourist 5.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 3. Flutter version
      # ==========================================================

      - name: Flutter version
        run: |
          flutter --version
          dart --version


      # ==========================================================
      # 4. Verify project
      # ==========================================================

      - name: Verify project
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/images/splash.jpg
          test -f assets/images/home.jpg
          test -f assets/images/logo-new.jpg

          echo "Project files: OK"


      # ==========================================================
      # 5. Verify version
      # ==========================================================

      - name: Verify version
        run: |
          set -e

          grep -n "^version:" pubspec.yaml

          grep -q "^version: 5.7.1+5710" pubspec.yaml

          echo "Version 5.7.1: OK"


      # ==========================================================
      # 6. Get dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 7. Analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze


      # ==========================================================
      # 8. Clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 9. Get dependencies after clean
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 10. Build simple RELEASE APK
      # ==========================================================

      - name: Build release APK
        run: |
          set -e

          flutter build apk --release


      # ==========================================================
      # 11. Verify APK
      # ==========================================================

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=========================================="
          echo "CYRUSTOURIST 5.7.1 APK"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # ==========================================================
      # 12. Upload APK
      # ==========================================================

      - name: Upload CyrusTourist 5.7.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CyrusTourist-5.7.1
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
