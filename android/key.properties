# این فایل را دقیقاً همین‌جا نگه دار: android/key.properties
# قبلاً build.gradle.kts طوری تنظیم شده که خودش این فایل را
# می‌خواند — فقط ۴ مقدار زیر را با اطلاعات واقعی خودت پر کن.
# این فایل از قبل در .gitignore هست، پس در گیت آپلود نمی‌شود
# و نباید جایی (حتی در چت) به اشتراک گذاشته شود.

# رمز عبور خودِ فایل کیستور
storePassword=

# رمز عبور کلید (اگر با رمز فایل فرق دارد؛ در بیشتر موارد همان است)
keyPassword=

# نام مستعار کلید هنگام ساخت کیستور (alias)
keyAlias=

# مسیر فایل کیستور. ساده‌ترین حالت: خودِ فایل .jks را داخل
# پوشهٔ android/app بگذار و فقط اسمش را اینجا بنویس، مثلاً:
# storeFile=release-key.jks
storeFile=
