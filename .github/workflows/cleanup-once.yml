name: Cleanup unused files (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cleanup.sh
        run: bash cleanup.sh

      - name: Remove helper files
        run: |
          git rm -q --ignore-unmatch cleanup.sh .github/workflows/cleanup-once.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove unused files [skip ci]"
          git push
