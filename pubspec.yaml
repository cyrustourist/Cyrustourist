name: cyrustourist_app3
description: CyrusTourist base app - splash, home and tourist map.
publish_to: "none"

version: 6.1.60+6467

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.2

  # انتخاب عکس پروفایل (با فشرده‌سازی هنگام انتخاب)
  image_picker: ^1.1.2
  image: ^4.2.0
  webview_flutter: ^4.13.0

  # آیکون‌های SVG سبک برای دکمه‌های پیام‌رسان
  flutter_svg: ^2.0.10+1

  # اشتراک‌گذاری و QR (کلید ۶ و ۸)
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

  # باز شدن مستقیم لینک‌های عمومی داخل برنامه (Deep Link)
  app_links: ^6.3.3

  # ورود/تأیید جی‌میل با حساب گوگل
  google_sign_in: ^6.2.1

  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # جستجو با تصویر (رایگان و روی گوشی): مختصات داخل عکس + تشخیص محتوای عکس
  exif: ^3.3.0

  # جستجوی صوتی (نقشه و جستجوی هوشمند) — ۱۰ زبان برنامه
  speech_to_text: ^7.0.0

  # ساعت جهانی دقیق (آفلاین، رایگان، بدون کلید API)
  timezone: ^0.9.4

  # تماس صوتی (WebRTC) بین دو گوشی
  flutter_webrtc: ^0.12.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash.jpg
    - assets/images/logo-new.jpg
    - assets/images/showcase-hub.jpg
    - assets/images/ads/slot1_default_1.jpg
    - assets/images/ads/slot1_default_2.jpg
    - assets/images/ads/slot2_default_1.jpg
    - assets/images/ads/slot2_default_2.jpg
    - assets/fallback/cities.json
    - assets/fallback/accommodations.json
    - assets/fallback/attractions.json
    - assets/fallback/guides.json
    - assets/fallback/health_tourism.json
    - assets/fallback/notifications.json
    - assets/fallback/settings.json
    - assets/translations/
    - assets/tiles/
