<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسم و فامیل · ۴ گوشی</title>
<style>
:root{--a:#7fd0ff;--b:#b9e4ff;--c:#ffc6e4;--card:#fffdf8;--ink:#23304a;--mut:#6b7a96;--line:#d6e4f5;--chip:#e9f3ff;--pk:#ff4f9a;--gr:#27c25f;--gd:#ffc928;--rd:#ff4d5a;--bl:#2f8cff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a:#0b1a33;--b:#12284a;--c:#2a1b46;--card:#18294a;--ink:#f1f4ff;--mut:#9fb0d0;--line:#2b4572;--chip:#1f3760;color-scheme:dark}}
:root[data-theme="dark"]{--a:#0b1a33;--b:#12284a;--c:#2a1b46;--card:#18294a;--ink:#f1f4ff;--mut:#9fb0d0;--line:#2b4572;--chip:#1f3760;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;line-height:1.7;background:linear-gradient(180deg,var(--a),var(--b) 55%,var(--c)) fixed}
main{max-width:1000px;margin:0 auto;padding:12px 12px 30px}
h1{font-size:22px;margin:4px 0;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.mut{color:var(--mut);text-align:center;font-size:13px;margin:4px 0}
.card{background:var(--card);border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 8px 0 rgba(0,0,0,.08),0 16px 26px -8px rgba(20,40,90,.35);border:1px solid var(--line)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:11px;font:inherit;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(#ff7ab8,var(--pk));box-shadow:0 5px 0 #c42b73,0 10px 14px rgba(0,0,0,.2);cursor:pointer;margin:10px 0}
.btn.g{background:linear-gradient(#5be08a,var(--gr));box-shadow:0 5px 0 #168a40,0 10px 14px rgba(0,0,0,.2)}
.btn.gh{background:var(--chip);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.s{font-size:13px;padding:7px;margin:4px 0}
.btn:active{transform:translateY(3px);box-shadow:none}
.top{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.lt{width:84px;height:84px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:#4a3200;background:radial-gradient(circle at 30% 25%,#fff3a0,var(--gd) 70%);box-shadow:0 8px 0 #b98a00,0 14px 16px rgba(0,0,0,.3);transform:perspective(300px) rotateX(12deg)}
.tm{font-size:46px;font-weight:900;min-width:90px;text-align:center}.warn{color:var(--rd);animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.12)}}
.bar{height:12px;border-radius:9px;background:var(--chip);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--pk))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ph{background:var(--card);border-radius:26px;border:3px solid var(--line);padding:10px;box-shadow:0 8px 0 rgba(0,0,0,.1),0 14px 22px -8px rgba(20,40,90,.4)}
.ph.dn{border-color:var(--gr)}
.ph h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:14px}
.f{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}.f span{min-width:70px;color:var(--mut)}
input{width:100%;font:inherit;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.nm{font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
td.c{cursor:pointer}td.c.x{color:var(--rd);text-decoration:line-through;opacity:.7}td.c.z{color:var(--mut)}
td small{display:block;font-weight:900;color:var(--gr)}
.big{font-size:26px;font-weight:900;text-align:center;margin:10px 0}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px;margin-top:10px}.lb{height:54px;border:0;border-radius:16px;font:inherit;font-size:26px;font-weight:900;color:#4a3200;cursor:pointer;background:radial-gradient(circle at 30% 25%,#fff3a0,var(--gd) 70%);box-shadow:0 5px 0 #b98a00,0 9px 10px rgba(0,0,0,.25)}.lb:active{transform:translateY(3px);box-shadow:none}.lb:disabled{background:#c9d2e2;box-shadow:0 2px 0 #9aa6bd;color:#fff;cursor:default}
.pill{display:inline-block;border-radius:20px;padding:0 10px;font-size:12px;font-weight:800;background:var(--chip)}
.ts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tc{border-radius:20px;padding:2px 12px;font-size:13px;font-weight:800;background:var(--chip);border:2px solid transparent;opacity:.75}
.tc.on{background:var(--gd);color:#4a3200;border-color:#b98a00;opacity:1;transform:scale(1.08)}
.tc.nx{border-color:var(--pk);opacity:1}
.cf{text-align:center}.cf .lt{margin:12px auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h3{margin:2px 0 8px;font-size:15px}
.xl{overflow-x:auto}.xl table{min-width:360px}.rw{cursor:pointer}.rw:active{background:var(--chip)}
.dt{background:var(--chip);padding:6px 2px}.dt table{font-size:12px}
.p20{color:#b98a00!important}.p10{color:var(--gr)!important}.p5{color:#e08a00!important}.p0{color:var(--mut)!important}
td small.p20{font-size:11px}
.rkc{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}.rkc:last-child{border:0}
.rkc .md{font-size:26px;min-width:38px;text-align:center}.rkc b{flex:1}.rkc .sc{font-size:20px;font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tab{font:inherit;cursor:pointer;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:800;background:var(--chip);color:var(--ink);border:2px solid transparent}
.tab.on{background:var(--gd);color:#4a3200;border-color:#b98a00}
.lg2{font-size:11.5px;color:var(--mut);text-align:center;margin:6px 0}
#endbar{margin-top:18px}
input:disabled{opacity:.6}
#tu{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,77,90,.93);color:#fff;text-align:center;animation:fl .35s infinite alternate}
#tu b{font-size:64px;line-height:1.3;text-shadow:0 4px 0 rgba(0,0,0,.25)}#tu span{font-size:18px;font-weight:800}
@keyframes fl{to{background:rgba(190,20,40,.95)}}
#snd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:50;border:0;border-radius:50%;width:38px;height:38px;font-size:18px;background:var(--chip);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
</style>
</head>
<body><main id="app"></main>
<script>
const sp=s=>s.split('،');
const CAT=[['👤','نام'],['👪','نام خانوادگی'],['🏙','شهر'],['🍲','غذا'],['🏛','مکان گردشگری'],['🐾','حیوان'],['🎨','رنگ'],['🪑','اشیا'],['🚗','خودرو']];
const DB=[sp('علی،مریم،سارا،رضا،نیما،حسین،پریسا،کیان،مهسا،داریوش،ترانه،شیما،کامران،نگار،سینا،بهار،آرش،گلناز،دانیال،فرزانه،تینا،محمد،زهرا،هادی،الهام،بهنام،پویا،رها،سحر،امیر'),
sp('احمدی،رضایی،کریمی،حسینی،محمدی،جعفری،نوری،صادقی،پناهی،شریفی،کاظمی،بهرامی،سلیمی،دانشور،رحیمی،ترابی،مرادی،گلشن،فرهادی،نیک‌پور،هاشمی،بابایی،طاهری،پارسا،سعیدی،خسروی'),
sp('اصفهان،شیراز،تبریز،مشهد،یزد،کاشان،رشت،اهواز،ارومیه،قم،کرمان،بوشهر،همدان،ساری،زنجان،اراک،بندرعباس،ایلام،سمنان،گرگان،بجنورد،خرم‌آباد،دزفول،نیشابور،سنندج،بیرجند'),
sp('آش،برنج،پلو،کباب،قورمه‌سبزی،فسنجان،حلیم،سمنو،دوغ،نان،کوکو،ماست،شیربرنج،فالوده،بستنی،گز،سوهان،ته‌چین،کشک،شله‌زرد،دلمه،عدس‌پلو،باقلوا،زرشک‌پلو،خورشت،رشته‌پلو،سیب‌زمینی،کلم‌پلو'),
sp('ارگ بم،برج میلاد،پاسارگاد،تخت جمشید،چغازنبیل،دماوند،سی‌وسه‌پل،نقش جهان،کاخ گلستان،باغ ارم،قشم،کیش،ماسوله،بازار وکیل،تاق بستان،دریاچه ارومیه،کویر لوت،غار علیصدر،آبشار بیشه،گنبد قابوس،هرمز،بیستون،شوش،باغ فین،مسجد نصیرالملک'),
sp('اسب،پلنگ،گربه،سگ،روباه،خرس،گرگ،شیر،فیل،زرافه،کلاغ،طاووس،عقاب،دلفین،لاک‌پشت،میمون،گوزن،بز،خرگوش،قناری،مار،ماهی،تمساح،کبوتر،شتر،آهو،یوزپلنگ'),
sp('آبی،ارغوانی،بنفش،پرتقالی،نارنجی،سبز،سرخ،سفید،سیاه،زرد،صورتی،قرمز،قهوه‌ای،طلایی،نقره‌ای،کرم،خاکستری،فیروزه‌ای،لیمویی،زرشکی،شیری،گلی،مشکی،نیلی،سرمه‌ای،یشمی'),
sp('میز،صندلی،کتاب،قلم،کلید،ساعت،چراغ،آینه،فرش،قاشق،چنگال،بشقاب،کیف،کفش،تلفن،دفتر،مداد،چتر،ظرف،لیوان،سطل،تخت،پنجره،در،گلدان،شانه،نردبان،توپ،کلاه،رادیو'),
sp('پراید،پژو،سمند،دنا،تیبا،ساینا،رانا،کوییک،شاهین،تارا،آریسان،سیتروئن،بنز،تویوتا،هیوندای،کیا،مزدا،نیسان،رنو،فورد،جیلی،چانگان،سورن،ماکسیما')];
const AB=sp('ا،ب،پ،ت،ث،ج،چ،ح،خ،د،ذ،ر،ز،ژ،س،ش،ص،ض،ط،ظ،ع،غ،ف،ق،ک،گ،ل،م،ن،و،ه،ی');
const nm=s=>String(s||'').replace(/[آأإ]/g,'ا').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s]/g,'').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),$=id=>document.getElementById(id),app=$('app'),R=a=>a[Math.random()*a.length|0];
let P=['کوروش','سارا','نیما','مهسا'].map((n,i)=>({n,a:Array(6).fill(''),d:0,t:0,r:0})),G={rd:0,N:4,L:'',end:0,iv:0,rej:new Set(),ph:'lobby',used:[],stopped:0,time:60,hist:[],v:0,open:-1,sm:''};
let AC;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,at=0,ty='square',v=.2){const a=ac();if(!a||G.mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function vib(p){try{navigator.vibrate&&!G.mute&&navigator.vibrate(p)}catch(e){}}
const sfx={tick:()=>tone(1000,.06,0,'sine',.15),ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.12,'triangle',.25)),alarm:()=>{for(let i=0;i<10;i++)tone(i%2?740:988,.28,i*.3,'sawtooth',.3);tone(1318,.9,3.0,'triangle',.3)},win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,i*.16,'triangle',.28)),warn:()=>[880,660,880,660].forEach((f,i)=>tone(f,.16,i*.18,'sawtooth',.28)),tick2:()=>tone(1500,.07,0,'square',.25)};
const MED=['🥇','🥈','🥉','4️⃣'];
const SM0='اولین نفری که (حداقل ۷ مورد) را پر کند «تمام شد» می‌زند؛ بقیه ۱۰ ثانیه وقت دارند ⏱';
function ranks(){const o=P.map((p,i)=>({i,t:p.t})).sort((a,b)=>b.t-a.t||a.i-b.i);o.forEach((x,k)=>{x.rk=k&&o[k-1].t===x.t?o[k-1].rk:k+1});return o}
const md=r=>MED[r-1]||fa(r);
function endBar(){return '<div id="endbar"><button class="btn gh" onclick="endAsk()">🏁 پایان بازی</button></div>'}
function endAsk(){$('endbar').innerHTML='<div class="card cf" style="text-align:center"><p class="big" style="font-size:18px">بازی همین‌جا تمام شود؟</p><p class="mut">دورِ نیمه‌کاره حساب نمی‌شود؛ دورهای قبلی در جدول می‌مانند.</p><div class="row2"><button class="btn" onclick="endGame()">بله، پایان</button><button class="btn gh" onclick="endBack()">ادامه بازی</button></div></div>'}
function endBack(){$('endbar').innerHTML='<button class="btn gh" onclick="endAsk()">🏁 پایان بازی</button>'}
function endGame(){clearInterval(G.iv);if(!G.hist.length){app.innerHTML='<div class="card" style="text-align:center"><h1>🏁 بازی پایان یافت</h1><p class="mut">هنوز هیچ دوری کامل نشده بود.</p></div><button class="btn g" onclick="lobby()">بازگشت به ابتدا</button>';return}resView(true)}
function strip(){return `<div class="ts">${P.map((p,i)=>`<span class="tc ${i===G.ch?'on':(i===(G.ch+1)%P.length?'nx':'')}">${i===G.ch?'🎯 ':(i===(G.ch+1)%P.length?'⏭ ':'')}${fa(i+1)}. ${esc(p.n)}</span>`).join('')}</div>`}
function lobby(){G.ph='lobby';clearInterval(G.iv);app.innerHTML=`<h1>✍️ اسم و فامیل · ۴ گوشی</h1><p class="mut">پیش‌نمایش روی یک صفحه: هر گوشی فقط صفحهٔ خودش را می‌بیند. در بازی واقعی هر گوشی جداست و با Nearby به میزبان وصل می‌شود.</p>
<div class="card"><div class="grid">${P.map((p,i)=>`<div class="ph dn"><h4><span>${i?'📱 گوشی '+fa(i+1):'👑 میزبان'}</span><span class="pill">✔ متصل</span></h4><input class="nm" value="${esc(p.n)}" maxlength="14" oninput="P[${i}].n=this.value||'بازیکن ${fa(i+1)}'"></div>`).join('')}</div>
<p class="mut">زمان هر دور: ${[30,60,90].map(t=>`<button class="pill" style="border:0;cursor:pointer;${G.time===t?'background:var(--gd)':''}" onclick="G.time=${t};lobby()">${fa(t)} ث</button>`).join(' ')} · ۵ دور · نوبتی حرف انتخاب می‌شود</p>
<p class="lg2">امتیاز هر خانه: ۲۰ = فقط شما پر کرده‌اید و بقیه نتوانستند · ۱۰ = پاسخ درست و یکتا · ۵ = پاسخ تکراری · ۰ = خالی یا نامعتبر</p></div>
<button class="btn g" onclick="newGame()">آغاز بازی ▶</button>`}
function newGame(){ac();G.won=0;P.forEach(p=>{p.t=0;p.r=0});G.rd=0;G.used=[];G.hist=[];G.open=-1;nextRound()}
function nextRound(){clearInterval(G.iv);G.rd++;G.ch=(G.rd-1)%P.length;G.v=0;pickScreen()}
function pickScreen(){G.ph='pick';
 app.innerHTML=`<div class="card"><h1>🎯 نوبت ${esc(P[G.ch].n)} است</h1><p class="mut">ترتیب چرخشی: دور ${fa(G.rd)} از ${fa(G.N+1)} · نفر بعدی: ${esc(P[(G.ch+1)%P.length].n)}</p>${strip()}<p class="mut">📱 گوشی ${esc(P[G.ch].n)}: حرف شروع را انتخاب کن (حرف‌های قبلی خاموش‌اند). روی گوشی بقیه فقط «منتظر انتخاب حرف…» دیده می‌شود.</p><div class="lg">${AB.map(l=>`<button class="lb" ${G.used.includes(l)?'disabled':''} onclick="pre('${l}')">${l}</button>`).join('')}</div></div><button class="btn gh" onclick="pre()">🎲 حرف تصادفی</button>${endBar()}`}
function pre(l){ac();if(!l){const f=AB.filter(x=>!G.used.includes(x));l=R(f.length?f:AB)}G.pk=l;G.ph='confirm';
 app.innerHTML=`<div class="card cf" style="text-align:center"><h1>🎯 نوبت ${esc(P[G.ch].n)} است</h1>${strip()}<p class="mut">دور ${fa(G.rd)} از ${fa(G.N+1)} · حرف انتخاب‌شده:</p><div class="lt">${l}</div><p class="big">حرف «${l}» تأیید شود؟</p><div class="row2"><button class="btn g" onclick="go(G.pk)">✔ تأیید و آغاز</button><button class="btn gh" onclick="pickScreen()">↩ بازگشت و ویرایش</button></div></div>${endBar()}`}
function go(l){ac();G.used.push(l);G.L=l;G.rej=new Set();G.stopped=0;G.sm=SM0;P.forEach(p=>{p.a=Array(CAT.length).fill('');p.d=0;p.r=0});G.end=Date.now()+G.time*1000;G.tot=G.time;G.lt=99;G.v=0;play();clearInterval(G.iv);G.iv=setInterval(tick,250)}
function play(){G.ph='play';const i=G.v,p=P[i];
 app.innerHTML=`<div class="card top"><span class="pill">دور ${fa(G.rd)} از ${fa(G.N+1)} · حرف را ${esc(P[G.ch].n)} انتخاب کرد</span><div class="lt">${G.L}</div><div class="tm" id="tm">${fa(Math.max(0,Math.ceil((G.end-Date.now())/1000)))}</div></div><div class="bar"><i id="br" style="width:100%"></i></div><p class="mut" id="sm">${esc(G.sm)}</p>
<div class="tabs">${P.map((q,k)=>`<button class="tab ${k===i?'on':''}" onclick="G.v=${k};play()">📱 ${esc(q.n)} ${q.d?'✋':'✍'}</button>`).join('')}</div>
<p class="lg2">در بازی واقعی هر گوشی فقط صفحهٔ خودش را می‌بیند؛ این‌جا با زبانه‌ها بین گوشی‌ها جابه‌جا می‌شوید و پاسخ بقیه پنهان است.</p>
<div class="ph ${p.d?'dn':''}" id="ph${i}" style="max-width:520px;margin:10px auto"><h4><span>📱 صفحهٔ ${esc(p.n)}</span><span class="pill" id="st${i}">${p.d?'✋ تمام':'✍ می‌نویسد'}</span></h4>${CAT.map((c,j)=>`<div class="f"><span>${c[0]} ${c[1]}</span><input id="i${i}_${j}" value="${esc(p.a[j])}" ${p.d?'disabled':''} placeholder="با «${G.L}»" oninput="P[${i}].a[${j}]=this.value;chk(${i})"></div>`).join('')}<button class="btn g s" id="fb${i}" onclick="fin(${i})" disabled>✋ تمام شد</button><button class="btn gh s" onclick="bot(${i})">🤖 پر کردن نمونه (فقط پیش‌نمایش)</button><button class="btn gh s" onclick="botAll()">🤖 پر کردن همهٔ گوشی‌ها (فقط پیش‌نمایش)</button></div>${endBar()}`;chk(i)}
function chk(i){const ok=P[i].a.filter(x=>nm(x)).length>=CAT.length-2;const b=$('fb'+i);if(b)b.disabled=!ok||P[i].d}
function fillBot(i){CAT.forEach((c,j)=>{const w=DB[j].filter(x=>nm(x)[0]===nm(G.L));P[i].a[j]=w.length?R(w):''})}
function bot(i){fillBot(i);play()}
function botAll(){P.forEach((p,i)=>{if(!p.d)fillBot(i)});play()}
function fin(i){if(P[i].d)return;P[i].d=1;sfx.ok();if(!G.stopped){sfx.warn();G.stopped=1;G.end=Math.min(G.end,Date.now()+10000);G.tot=Math.max(1,Math.ceil((G.end-Date.now())/1000));G.sm='🛑 '+P[i].n+' تمام کرد! ۱۰ ثانیه برای بقیه'}play()}
function tick(){const ms=G.end-Date.now(),l=Math.max(0,Math.ceil(ms/1000)),t=$('tm');if(!t)return;t.textContent=fa(l);t.className='tm'+(l<=10?' warn':'');$('br').style.width=Math.max(0,ms/(G.tot*10))+'%';if(l<=15&&l>0&&l!==G.lt){if(l===15&&G.tot>25&&!G.stopped)sfx.warn();else if(l<=5)sfx.tick2();else if(l<=10)sfx.tick()}G.lt=l;if(l<=0){clearInterval(G.iv);timeUp()}}
function timeUp(){sfx.alarm();vib([500,200,500,200,800]);const d=document.createElement('div');d.id='tu';d.innerHTML='<b>⏰ وقت تمام شد!</b><span>قلم‌ها زمین؛ پاسخ‌ها برای همه نمایش داده می‌شود…</span>';document.body.appendChild(d);setTimeout(()=>{d.remove();review()},2800)}
// ---- امتیازدهی: تنها پاسخ معتبر ۲۰ · یکتا ۱۰ · تکراری ۵ · نامعتبر ۰
function valid(j,i){const x=nm(P[i].a[j]);return x&&x[0]===nm(G.L)&&!G.rej.has(j+'.'+i)?x:''}
function calc(){return CAT.map((c,j)=>{const v=P.map((p,i)=>valid(j,i)),n=v.filter(Boolean).length;return v.map(x=>!x?0:n===1?20:(v.filter(y=>y===x).length===1?10:5))})}
function review(){G.ph='rev';const pts=calc(),tot=P.map((_,i)=>pts.reduce((s,r)=>s+r[i],0));
 app.innerHTML=`<div class="card"><h1>📝 پاسخ‌های همه · حرف «${G.L}»</h1><p class="mut">وقت تمام شد؛ حالا صفحهٔ هر چهار نفر برای همه دیده می‌شود. روی پاسخ مشکوک بزنید تا رد/تأیید شود (در بازی واقعی: رأی اکثریت ۳ از ۴).</p>
<div style="overflow-x:auto"><table><tr><th></th>${P.map(p=>`<th>${esc(p.n)}</th>`).join('')}</tr>${CAT.map((c,j)=>`<tr><th>${c[0]} ${c[1]}</th>${P.map((p,i)=>{const x=nm(p.a[j]),bad=!x||x[0]!==nm(G.L),rj=G.rej.has(j+'.'+i);return`<td class="c ${rj||bad?(bad?'z':'x'):''}" ${bad?'':`onclick="tg(${j},${i})"`}>${p.a[j]?esc(p.a[j]):'—'}<small class="p${pts[j][i]}">${bad||rj?'':'+'+fa(pts[j][i])}</small></td>`}).join('')}</tr>`).join('')}<tr><th>جمع دور</th>${tot.map(t=>`<th>${fa(t)}</th>`).join('')}</tr></table></div>
<p class="lg2">۲۰ = تنها پاسخ معتبر · ۱۰ = یکتا · ۵ = تکراری · ۰ = خالی/نامعتبر</p></div><button class="btn g" onclick="res()">تأیید امتیازها ✔</button>${endBar()}`}
function tg(j,i){const k=j+'.'+i;G.rej.has(k)?G.rej.delete(k):G.rej.add(k);review()}
function res(){const pts=calc();const cells=CAT.map((c,j)=>P.map((p,i)=>({v:p.a[j]||'',p:pts[j][i]})));P.forEach((p,i)=>{p.r=pts.reduce((s,r)=>s+r[i],0);p.t+=p.r});G.hist.push({rd:G.rd,L:G.L,r:P.map(p=>p.r),cells});G.open=G.hist.length-1;sfx.ok();resView(G.rd>=G.N+1)}
function tgo(r){G.open=G.open===r?-1:r;resView(G.last)}
function detail(h,o){return `<table><tr><th></th>${o.map(x=>`<th>${esc(P[x.i].n)}</th>`).join('')}</tr>${CAT.map((c,j)=>`<tr><th>${c[0]} ${c[1]}</th>${o.map(x=>{const q=h.cells[j][x.i];return`<td>${q.v?esc(q.v):'—'}<small class="p${q.p}">${q.p?'+'+fa(q.p):'۰'}</small></td>`}).join('')}</tr>`).join('')}</table>`}
function sheet(o){return `<div class="xl"><table><tr><th>دور</th><th>حرف</th>${o.map(x=>`<th>${md(x.rk)} ${esc(P[x.i].n)}</th>`).join('')}</tr>${G.hist.map((h,r)=>`<tr class="rw" onclick="tgo(${r})"><td>${fa(r+1)} ${G.open===r?'▾':'▸'}</td><td><b>${h.L}</b></td>${o.map(x=>`<td>${fa(h.r[x.i])}</td>`).join('')}</tr>${G.open===r?`<tr><td class="dt" colspan="${2+o.length}">${detail(h,o)}</td></tr>`:''}`).join('')}<tr><th colspan="2">جمع کل</th>${o.map(x=>`<th>${fa(x.t)}</th>`).join('')}</tr><tr><th colspan="2">رتبه</th>${o.map(x=>`<th>${md(x.rk)} ${fa(x.rk)}</th>`).join('')}</tr></table></div><p class="lg2">ستون‌ها بر پایهٔ امتیاز کل از رتبه ۱ تا ۴ چیده می‌شوند · روی هر دور بزنید تا ریز خانه‌ها دیده شود</p>`}
function awards(){const c=P.map(()=>({u:0,v:0}));G.hist.forEach(h=>h.cells.forEach(row=>row.forEach((q,i)=>{if(q.p===20)c[i].u++;if(q.p>0)c[i].v++})));const best=k=>{const m=Math.max(...c.map(x=>x[k]));return m>0?c.map((x,i)=>x[k]===m?esc(P[i].n):'').filter(Boolean).join(' و ')+' ('+fa(m)+')':'—'};return `<div class="card"><h3>🎖 جوایز</h3><p>⚡ بیشترین خانهٔ ۲۰ امتیازی: <b>${best('u')}</b></p><p>🎯 بیشترین پاسخ معتبر: <b>${best('v')}</b></p></div>`}
function board(o){return o.map(x=>`<div class="rkc"><span class="md">${md(x.rk)}</span><b>رتبه ${fa(x.rk)} · ${esc(P[x.i].n)}</b><span class="sc">${fa(x.t)}</span></div>`).join('')}
function resView(last){G.ph='res';G.last=last;const o=ranks();if(last&&!G.won){G.won=1;sfx.win();vib([300,100,300,100,600])}if(!last)G.won=0;
 app.innerHTML=`<h1>${last?'🏆 پایان بازی':'📊 امتیاز پس از دور '+fa(G.hist.length)}</h1>${last?`<div class="card"><div class="big">🏆 برنده: ${o.filter(x=>x.rk===1).map(x=>esc(P[x.i].n)).join(' و ')}</div></div>`:''}
<div class="card"><h3>📋 جدول امتیازها (مانند اکسل)</h3>${sheet(o)}</div><div class="card"><h3>🏅 رتبه‌بندی ${last?'نهایی':'تا این لحظه'}</h3>${board(o)}</div>${last?awards():''}${last?'<button class="btn g" onclick="newGame()">بازی دوباره ↻</button><button class="btn gh" onclick="lobby()">بازگشت</button>':'<button class="btn" onclick="nextRound()">دور بعد ◀</button>'+endBar()}`}
const sb=document.createElement('button');sb.id='snd';sb.textContent='🔊';sb.onclick=()=>{G.mute=!G.mute;sb.textContent=G.mute?'🔇':'🔊'};document.body.appendChild(sb);
lobby();
</script>
</body>
</html>
