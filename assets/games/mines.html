<script>
'use strict';
const $=id=>document.getElementById(id);
const TX={
fa:{sub:'مین‌یاب سایروس توریست',new:'بازی جدید',rec:'رکوردها',solo:'انفرادی',ai:'با ربات',two:'دو نفره',dig:'حفر',flag:'پرچم',small:'کوچک',mid:'متوسط',large:'بزرگ',easy:'آسان',med:'متوسط',hard:'سخت',you:'شما',bot:'ربات',p:'بازیکن {0}',time:'زمان',score:'امتیاز',best:'بهترین زمان',win:'🏆 پاک‌سازی شد!',lose:'💥 مین!',botwin:'🤖 ربات زودتر پاک کرد!',botboom:'💥 ربات منفجر شد!',youwin:'🏆 شما برنده شدید!',turn:'نوبت {0}',pwin:'🏆 {0} برنده شد!',pboom:'💥 {0} مین را باز کرد',draw:'🤝 مساوی!',close:'بستن',set:'تنظیمات',snd:'صدا',vib:'لرزش',ailv:'قدرت ربات',weak:'ضعیف',norm:'معمولی',strong:'قوی',lang:'زبان',games:'بازی',wins:'برد',fast:'سریع‌ترین',waitHost:'⏳ منتظر میزبان…',lost:'⚠️ ارتباط با میزبان قطع شده است. گوشی‌ها را نزدیک‌تر کنید…',exit:'خروج',conn:'در حال اتصال به میزبان…',out:'💥 شما بیرون افتادید؛ منتظر بقیه…',cleared:'🏁 پاک کردید!',rank:'رتبه‌بندی',dead:'منفجر شد',done:'پاک کرد',left:'مین‌ها',race:'رقابت: اولین نفری که صفحه را پاک کند برنده است',only:'فقط شما',vsfr:'دو نفره',vsai:'با ربات',vsnet:'گوشی نزدیک',tool:'ابزار'},
en:{sub:'Cyrus Tourist Minesweeper',new:'New Game',rec:'Records',solo:'Solo',ai:'Vs AI',two:'Two Players',dig:'Dig',flag:'Flag',small:'Small',mid:'Medium',large:'Large',easy:'Easy',med:'Medium',hard:'Hard',you:'You',bot:'AI',p:'Player {0}',time:'Time',score:'Score',best:'Best time',win:'🏆 Cleared!',lose:'💥 Boom!',botwin:'🤖 The AI cleared it first!',botboom:'💥 The AI hit a mine!',youwin:'🏆 You win!',turn:"{0}'s turn",pwin:'🏆 {0} wins!',pboom:'💥 {0} hit a mine',draw:'🤝 Draw!',close:'Close',set:'Settings',snd:'Sound',vib:'Vibration',ailv:'AI strength',weak:'Weak',norm:'Normal',strong:'Strong',lang:'Language',games:'Games',wins:'Wins',fast:'Fastest',waitHost:'⏳ Waiting for the host…',lost:'⚠️ Lost connection to the host. Move the phones closer…',exit:'Exit',conn:'Connecting to the host…',out:'💥 You are out; waiting for the others…',cleared:'🏁 You cleared it!',rank:'Ranking',dead:'Exploded',done:'Cleared',left:'Mines',race:'Race: first to clear the board wins',only:'Only you',vsfr:'Two players',vsai:'Vs AI',vsnet:'Nearby',tool:'Tool'}};
const SZ=[[8,8],[10,12],[12,16]],DN=[.12,.16,.205],CAP=600;
let L='fa',M='solo',sz=1,lv=0,ai=1,tool='dig',snd=1,vb=1,gid=0,X=null,K=null,T={turn:0,sc:[0,0],win:-1},res=null,mc=0,setOpen=0,recOpen=0,names=[],t0=0,endMs=0,started=0,sBoom=null;
const NET={on:0,me:0,host:1,last:0,q:-1,ph:'',seed:0,startAt:0,win:-1,pl:[],gone:[],hb:0,rseed:null,sent:0,order:[]};
try{const c=JSON.parse(localStorage.getItem('mscfg')||'{}');if(c.snd===0)snd=0;if(c.vb===0)vb=0;if(c.ai!=null)ai=c.ai}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('mscfg',JSON.stringify({snd,vb,ai}))}catch(e){}};
const t=(k,...a)=>(TX[L][k]||k).replace(/\{(\d)\}/g,(_,i)=>a[i]);
const N=x=>L==='fa'?String(x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]):String(x);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function send(m){try{NetCh.postMessage(JSON.stringify(m))}catch(e){}}
// ---------- صدا / لرزش
let AC;function tone(f,d,at=0,ty='triangle',v=.18){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+at;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
function vib(p){try{vb&&navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function fx(k){if(k==='open'){tone(620,.07);vib(8)}else if(k==='flag'){tone(420,.09,0,'square',.1);vib(20)}else if(k==='boom'){tone(110,.5,0,'sawtooth',.35);tone(70,.7,.05,'square',.3);vib([300,100,300])}else if(k==='win'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,i*.13,'triangle',.26));vib([200,80,200,80,400])}else if(k==='cd'){tone(880,.12,0,'sine',.2)}}
// ---------- منطق صفحه (مشترک برای همهٔ حالت‌ها)
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function nbs(i,c,r){const x=i%c,y=(i/c)|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<c&&b<r)o.push(b*c+a)}return o}
const mineCount=(s,l)=>{const[c,r]=SZ[s];return Math.round(c*r*DN[l])};
function mkBoard(s,l){const[c,r]=SZ[s],n=c*r,m=mineCount(s,l);return{c,r,n,m,mine:new Uint8Array(n),num:new Uint8Array(n),open:new Uint8Array(n),flag:new Uint8Array(n),opened:0,flags:0,state:'play',gen:0,safe:n-m,boom:-1,seed:0}}
function genMines(B,seed,safe){B.seed=seed;const rnd=rng(seed),ex=new Set([safe]);if(safe>=0)for(const j of nbs(safe,B.c,B.r))ex.add(j);const pool=[];for(let i=0;i<B.n;i++)if(!ex.has(i))pool.push(i);
 for(let i=pool.length-1;i>0;i--){const j=(rnd()*(i+1))|0;const q=pool[i];pool[i]=pool[j];pool[j]=q}
 for(let k=0;k<B.m;k++)B.mine[pool[k]]=1;
 for(let i=0;i<B.n;i++){if(B.mine[i])continue;let k=0;for(const j of nbs(i,B.c,B.r))k+=B.mine[j];B.num[i]=k}B.gen=1}
function reveal(B,i){if(B.open[i]||B.flag[i]||B.state!=='play')return 0;if(B.mine[i]){B.boom=i;B.state='lost';return -1}
 let cnt=1;const st=[i];B.open[i]=1;B.opened++;
 while(st.length){const a=st.pop();if(B.num[a]===0)for(const j of nbs(a,B.c,B.r))if(!B.open[j]&&!B.flag[j]&&!B.mine[j]){B.open[j]=1;B.opened++;cnt++;st.push(j)}}
 if(B.opened===B.safe)B.state='won';return cnt}
function chord(B,i){if(!B.open[i]||!B.num[i])return 0;const ns=nbs(i,B.c,B.r);let f=0;for(const j of ns)f+=B.flag[j];if(f!==B.num[i])return 0;let tot=0;for(const j of ns){if(B.open[j]||B.flag[j])continue;const r=reveal(B,j);if(r<0)return -1;tot+=r}return tot}
function toggleFlag(B,i){if(B.open[i]||B.state!=='play')return;if(B.flag[i]){B.flag[i]=0;B.flags--}else{B.flag[i]=1;B.flags++}}
// ---------- هوش مصنوعی: استنتاج منطقی (قانون تک‌نقطه‌ای و زیرمجموعه) و حدس کم‌خطر
function botStep(Kb,B,level){const{c,r,n}=B,o=Kb.open,mk=Kb.mk,cons=[];
 for(let i=0;i<n;i++){if(!o[i]||!B.num[i])continue;const U=[];let m=0;for(const j of nbs(i,c,r)){if(mk[j])m++;else if(!o[j])U.push(j)}if(U.length)cons.push({U,need:B.num[i]-m})}
 const safe=new Set();let ch=1,it=0;
 while(ch&&it++<6){ch=0;for(const q of cons){const U=q.U.filter(j=>!mk[j]&&!safe.has(j)),m=q.U.length-U.length;let need=q.need;
   // mk تازه‌اضافه‌شده را از need کم می‌کنیم
   let mm=0;for(const j of q.U)if(mk[j])mm++;need=q.need-mm;if(!U.length)continue;
   if(need===0){U.forEach(j=>safe.add(j));ch=1}else if(need===U.length){U.forEach(j=>{mk[j]=1});ch=1}}
  if(!ch&&level>=1){const cs=cons.map(q=>({U:q.U.filter(j=>!mk[j]),need:q.need-q.U.filter(j=>mk[j]).length})).filter(q=>q.U.length&&!q.U.every(j=>safe.has(j)));
   for(let a=0;a<cs.length&&!ch;a++)for(let b=0;b<cs.length&&!ch;b++){if(a===b)continue;const A=cs[a],Bq=cs[b];if(A.U.length>=Bq.U.length)continue;if(!A.U.every(j=>Bq.U.includes(j)))continue;const D=Bq.U.filter(j=>!A.U.includes(j)),dn=Bq.need-A.need;
     if(dn===0){D.forEach(j=>{if(!safe.has(j)){safe.add(j);ch=1}})}else if(dn===D.length){D.forEach(j=>{if(!mk[j]){mk[j]=1;ch=1}})}}}}
 const sf=[...safe].filter(j=>!o[j]&&!mk[j]);if(sf.length)return sf[Math.random()*sf.length|0];
 // حدس: کمترین احتمال
 const un=[];let mm=0;for(let i=0;i<n;i++){if(mk[i])mm++;else if(!o[i])un.push(i)}if(!un.length)return -1;
 if(level===0&&Math.random()<.5)return un[Math.random()*un.length|0];
 const pr=new Map();for(const q of cons){const U=q.U.filter(j=>!mk[j]);if(!U.length)continue;const need=q.need-q.U.filter(j=>mk[j]).length,p=Math.max(0,need)/U.length;for(const j of U)pr.set(j,Math.max(pr.get(j)||0,p))}
 const dens=(B.m-mm)/un.length;let best=1,pk=[];for(const j of un){const p=pr.has(j)?pr.get(j):dens;if(p<best-1e-9){best=p;pk=[j]}else if(Math.abs(p-best)<1e-9)pk.push(j)}
 return pk[Math.random()*pk.length|0]}
// ---------- شروع و پایان
const rand32=()=>(Math.random()*4294967296)>>>0;
function center(B){return((B.r>>1)*B.c)+(B.c>>1)}
function fresh(){gid++;res=null;mc=0;started=0;endMs=0;t0=Date.now();K=null;T={turn:0,sc:[0,0],win:-1,boomBy:-1};sBoom=null;X=mkBoard(sz,lv);
 if(M==='ai'||M==='local'){genMines(X,rand32(),center(X));reveal(X,center(X));started=1;t0=Date.now();if(M==='ai')startBot()}
 render()}
function setMode(m){M=m;fresh()}function setSz(v){sz=v;fresh()}function setLv(v){lv=v;fresh()}
function startBot(){K={open:new Uint8Array(X.n),mk:new Uint8Array(X.n),opened:0,state:'play',boom:-1,safe:X.safe};const c=center(X);
 // ربات همان ناحیهٔ بازِ شروع را دارد
 const st=[c];K.open[c]=1;K.opened++;while(st.length){const a=st.pop();if(X.num[a]===0)for(const j of nbs(a,X.c,X.r))if(!K.open[j]&&!X.mine[j]){K.open[j]=1;K.opened++;st.push(j)}}
 const g=gid,dl=[1500,950,520][ai];(function loop(){setTimeout(()=>{if(g!==gid||!K||K.state!=='play'||res)return;const i=botStep(K,X,ai);if(i>=0){if(X.mine[i]){K.state='lost';K.boom=i;fx('boom');if(X.state==='play'&&!res){render()}}else{const st=[i];K.open[i]=1;K.opened++;while(st.length){const a=st.pop();if(X.num[a]===0)for(const j of nbs(a,X.c,X.r))if(!K.open[j]&&!X.mine[j]){K.open[j]=1;K.opened++;st.push(j)}}if(K.opened===K.safe){K.state='won';if(!res)finish('botwin')}}render();loop()}else{render()}},dl*(.7+Math.random()*.6))})()}
const elapsed=()=>M==='net'?Math.max(0,(endMs||Date.now())-NET.startAt):(started?(endMs||Date.now())-t0:0);
function playable(){if(res||!X||X.state!=='play')return false;if(M==='net')return NET.ph==='play'&&!netDone();if(M==='local')return true;return true}
const netDone=()=>M==='net'&&(X.state==='lost'||X.state==='won');
function score(){return X.opened*10+(X.state==='won'?Math.max(0,(X.safe*4-(elapsed()/1000|0))*2):0)}
function afterMove(r){
 if(M==='net'){if(r<0)fx('boom');else if(r>0)fx('open');if(X.state!=='play')endMs=Date.now();sendPr(X.state!=='play');render();return}
 if(r<0){endMs=Date.now();fx('boom');if(M==='local')T.boomBy=T.turn;finish(M==='local'?'pboom':'lose');return}
 if(r>0)fx('open');
 if(M==='local'){T.sc[T.turn]+=r*10;if(X.state==='won'){endMs=Date.now();finish('lwin');return}T.turn=1-T.turn}
 if(X.state==='won'){endMs=Date.now();finish(M==='ai'?'youwin':'win');return}
 render()}
function dig(i){if(!playable()||X.flag[i]||X.open[i])return;
 if(!X.gen){genMines(X,rand32(),i);started=1;t0=Date.now()}
 if(M==='local')T.last=T.turn;const r=reveal(X,i);if(r<0)T.boomBy=T.turn;afterMove(r)}
function tap(i){if(!playable())return;if(X.open[i]){const r=chord(X,i);if(r!==0)afterMove(r);return}if(tool==='flag'){flagAt(i)}else dig(i)}
function flagAt(i){if(!playable()||X.open[i])return;toggleFlag(X,i);fx('flag');render()}
function finish(kind){res={kind};if(!endMs)endMs=Date.now();const won=['win','youwin','lwin'].includes(kind);if(won)fx('win');
 if(M==='solo'||M==='ai'){recordGame(kind)}render()}
// ---------- رکوردها
function st(){try{return JSON.parse(localStorage.getItem('msrec')||'{}')}catch(e){return{}}}
function recordGame(kind){const s=st(),k=sz+'-'+lv,o=s[k]||(s[k]={g:0,w:0,b:0,sc:0});o.g++;if(kind==='win'||kind==='youwin'){o.w++;const ms=elapsed();if(!o.b||ms<o.b)o.b=ms;res.newBest=o.b===ms}o.sc=Math.max(o.sc,score());try{localStorage.setItem('msrec',JSON.stringify(s))}catch(e){}}
const fmt=ms=>{const s=Math.floor(ms/1000);return N((s/60|0)+':'+String(s%60).padStart(2,'0'))};
const fmtL=ms=>{const s=Math.floor(ms/1000);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
// ---------- نمایش
const MINE='<svg viewBox="0 0 24 24"><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></g><circle cx="12" cy="12" r="6" fill="#0b0b12" stroke="#bcd" stroke-width="1.2"/><circle cx="10" cy="10" r="1.8" fill="#fff"/></svg>';
const FLAG='<svg viewBox="0 0 24 24"><path d="M6 21h12" stroke="#ffc928" stroke-width="2.4" stroke-linecap="round"/><path d="M10 21V4" stroke="#ffc928" stroke-width="2.4" stroke-linecap="round"/><path d="M10 4l9 4-9 4z" fill="#ff3b4d" stroke="#fff" stroke-width="1"/></svg>';
const LOGO='<svg class="logo" viewBox="0 0 64 70"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc2ff"/><stop offset="1" stop-color="#0b3fb5"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#7fe0ff"/><stop offset=".55" stop-color="#2fae5f"/><stop offset="1" stop-color="#0b4fb0"/></radialGradient></defs><path d="M32 3C17 3 6 14 6 28c0 18 26 38 26 38s26-20 26-38C58 14 47 3 32 3z" fill="url(#lg)" stroke="#bfe6ff" stroke-width="2.5"/><circle cx="32" cy="27" r="17" fill="url(#gl)" stroke="#fff" stroke-width="2"/><path d="M32 14l11 9h-3v10H24V23h-3z" fill="#fff"/><rect x="29" y="26" width="6" height="7" fill="#e53935"/><ellipse cx="32" cy="60" rx="20" ry="4" fill="#38c6ff" opacity=".45"/></svg>';
function nameOf(i){return M==='net'?(names[i]||t('p',i+1)):(M==='local'?t('p',i+1):(i?t('bot'):t('you')))}
function cell(i){const o=X.open[i],lost=X.state==='lost'||(M==='net'&&X.state==='lost');
 if(o)return`<div class="c o${X.num[i]?' n'+X.num[i]:''}" data-i="${i}">${X.num[i]||''}</div>`;
 if(lost||(res&&!X.open[i]&&X.gen)){if(X.mine[i]){return X.flag[i]?`<div class="c w" data-i="${i}">${FLAG}</div>`:`<div class="c${i===X.boom?' b':' o'}" data-i="${i}">${MINE}</div>`}if(X.flag[i])return`<div class="c w" data-i="${i}">❌</div>`}
 return`<div class="c" data-i="${i}">${X.flag[i]?FLAG:''}</div>`}
function oppBars(){let rows=[];
 if(M==='ai'&&K)rows.push([t('bot'),K.opened/K.safe,K.state==='lost'?'💥':K.state==='won'?'🏁':'']);
 if(M==='net')NET.pl.forEach((p,i)=>{if(i!==NET.me)rows.push([nameOf(i)+(NET.gone[i]?' ⚠':''),p.pct,p.st===1?'💥':p.st===2?'🏁':''])});
 if(!rows.length)return'';return`<div class="opp">${rows.map(r=>`<div class="or"><span class="n">${esc(r[0])}</span><div class="pb"><i style="width:${Math.round(r[1]*100)}%"></i></div><b>${N(Math.round(r[1]*100))}% ${r[2]}</b></div>`).join('')}</div>`}
function render(){if(!X)return;const net=M==='net',own=!net||NET.host,face=res?(['win','youwin','lwin'].includes(res.kind)?'😎':(res.kind==='botwin'||res.kind==='lose'||res.kind==='pboom'?'😵':'🙂')):(net&&X.state==='lost'?'😵':'🙂');
 const left=Math.max(0,X.m-X.flags);
 let h=`<div class="hd"><button class="gear" onclick="setOpen=1;render()">⚙</button><div class="ttl"><b>MINESWEEPER</b><span>${t('sub')}</span></div>${LOGO}</div>`;
 h+=`<div class="bar"><div class="lcd"><small>${t('time')}</small><span id="tm">${fmtL(elapsed())}</span></div><button class="face" onclick="${own?'fresh2()':'void 0'}">${face}</button><div class="lcd"><small>💣 ${t('left')}</small>${String(left).padStart(3,'0')}</div></div>`;
 h+=`<div class="pb"><i style="width:${Math.round(X.opened/X.safe*100)}%"></i></div>`+oppBars();
 let tn='';if(M==='local'&&!res)tn=t('turn',esc(nameOf(T.turn))+` (${N(T.sc[0])} - ${N(T.sc[1])})`);else if(net&&X.state==='lost'&&NET.ph==='play')tn=t('out');else if(net&&NET.ph==='play'&&X.state==='play')tn=t('race');
 h+=`<div class="turn">${tn}</div>`;
 const W=Math.min(innerWidth,560)-24-16,s=Math.max(22,Math.min(44,Math.floor((W-(X.c-1)*2)/X.c)));
 h+=`<div class="bw"><div id="bd" style="--s:${s}px;grid-template-columns:repeat(${X.c},var(--s))">${Array.from({length:X.n},(_,i)=>cell(i)).join('')}</div></div>`;
 h+=`<div class="row"><button class="btn${tool==='dig'?' sel':''}" onclick="tool='dig';render()">⛏ ${t('dig')}</button><button class="btn${tool==='flag'?' sel':''}" onclick="tool='flag';render()">🚩 ${t('flag')}</button></div>`;
 h+=`<div class="row">${own?`<button class="btn g" onclick="fresh2()">▶ ${t('new')}</button>`:''}<button class="btn" onclick="recOpen=1;render()">🏆 ${t('rec')}</button></div>`;
 if(!net){h+=`<div class="chips">${[0,1,2].map(v=>`<button class="chip${sz===v?' on':''}" onclick="setSz(${v})">${t(['small','mid','large'][v])} ${SZ[v][0]}×${SZ[v][1]}</button>`).join('')}</div><div class="chips">${[0,1,2].map(v=>`<button class="chip lv${v}${lv===v?' on':''}" onclick="setLv(${v})">${t(['easy','med','hard'][v])}</button>`).join('')}</div><div class="row"><button class="btn${M==='solo'?' sel':''}" onclick="setMode('solo')">⛏ ${t('solo')}</button><button class="btn${M==='ai'?' sel':''}" onclick="setMode('ai')">🤖 ${t('ai')}</button><button class="btn o${M==='local'?' sel':''}" onclick="setMode('local')">👥 ${t('two')}</button></div>`}
 h+=`<div class="ft"><b>CYRUS TOURIST</b><span>From Iran to the World</span></div>`;
 if(net&&NET.ph==='cd')h+=`<div class="cd" id="cdn"></div>`;
 if(res&&!mc)h+=resBox();if(net&&NET.ph==='over'&&!mc)h+=netBox();if(setOpen)h+=setBox();if(recOpen)h+=recBox();
 $('app').innerHTML=h;bind();tickT()}
function fresh2(){if(M==='net'){if(NET.host)hostNew();return}fresh()}
function resBox(){const k=res.kind,e={win:['😎',t('win')],youwin:['🏆',t('youwin')],lose:['💥',t('lose')],botwin:['🤖',t('botwin')],pboom:['💥',t('pboom',esc(nameOf(T.boomBy)))],lwin:['🏆','']}[k];let title=e[1],ic=e[0];
 if(k==='lwin'){const a=T.sc[0],b=T.sc[1];title=a===b?t('draw'):t('pwin',esc(nameOf(a>b?0:1)))}
 if(k==='pboom'){title=t('pwin',esc(nameOf(1-T.boomBy)))+'<br><small>'+t('pboom',esc(nameOf(T.boomBy)))+'</small>'}
 const b=st()[sz+'-'+lv],extra=M==='local'?`<p>${esc(nameOf(0))}: ${N(T.sc[0])} · ${esc(nameOf(1))}: ${N(T.sc[1])}</p>`:`<p>⏱ ${fmt(elapsed())} · ⭐ ${N(score())}${res.newBest?' 🎖':''}</p>${b&&b.b?`<p>${t('best')}: ${fmt(b.b)}</p>`:''}`;
 return`<div class="mod"><div class="box"><div class="big">${ic}</div><h2>${title}</h2>${extra}<div class="row"><button class="btn g" onclick="fresh2()">▶ ${t('new')}</button><button class="btn" onclick="mc=1;render()">${t('close')}</button></div></div></div>`}
function netBox(){const o=NET.order,me=NET.me;return`<div class="mod"><div class="box"><div class="big">${NET.order[0]===me?'🏆':'🏁'}</div><h2>${t('rank')}</h2>${o.map((i,k)=>{const p=NET.pl[i];return`<div class="rk"><span class="m">${['🥇','🥈','🥉'][k]||N(k+1)}</span><span class="nm">${esc(nameOf(i))}${i===me?' ('+t('you')+')':''}</span><small>${p.st===2?'🏁 '+fmt(p.ms):p.st===1?'💥 ':''}${N(Math.round(p.pct*100))}%</small></div>`}).join('')}${NET.host?`<div class="row"><button class="btn g" onclick="hostNew()">▶ ${t('new')}</button><button class="btn" onclick="send({x:'exit'})">${t('exit')}</button></div>`:`<p>${t('waitHost')}</p><button class="btn" style="width:100%" onclick="send({x:'exit'})">${t('exit')}</button>`}</div></div>`}
function setBox(){return`<div class="mod" onclick="if(event.target===this){setOpen=0;render()}"><div class="box"><h2>⚙ ${t('set')}</h2>
<div class="sr"><span>🔊 ${t('snd')}</span><button class="chip${snd?' on':''}" style="max-width:90px" onclick="snd=snd?0:1;saveCfg();render()">${snd?'ON':'OFF'}</button></div>
<div class="sr"><span>📳 ${t('vib')}</span><button class="chip${vb?' on':''}" style="max-width:90px" onclick="vb=vb?0:1;saveCfg();render()">${vb?'ON':'OFF'}</button></div>
<div class="sr"><span>🤖 ${t('ailv')}</span></div><div class="chips" style="margin:0">${['weak','norm','strong'].map((k,i)=>`<button class="chip${ai===i?' on':''}" onclick="ai=${i};saveCfg();render()">${t(k)}</button>`).join('')}</div>
<div class="sr"><span>🌐 ${t('lang')}</span></div><div class="chips" style="margin:0"><button class="chip${L==='fa'?' on':''}" onclick="setL('fa')">فارسی</button><button class="chip${L==='en'?' on':''}" onclick="setL('en')">English</button></div>
<button class="btn" style="width:100%;margin-top:14px" onclick="setOpen=0;render()">${t('close')}</button></div></div>`}
function setL(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';render()}
function recBox(){const s=st();let rows='';for(let a=0;a<3;a++)for(let b=0;b<3;b++){const o=s[a+'-'+b];if(o)rows+=`<div class="st"><span>${t(['small','mid','large'][a])} · ${t(['easy','med','hard'][b])}</span><span>${t('games')} ${N(o.g)} · ${t('wins')} ${N(o.w)} · ${o.b?'⏱ '+fmt(o.b):'—'}</span></div>`}
 return`<div class="mod" onclick="if(event.target===this){recOpen=0;render()}"><div class="box"><h2>🏆 ${t('rec')}</h2>${rows||'<p>—</p>'}<button class="btn" style="width:100%;margin-top:14px" onclick="recOpen=0;render()">${t('close')}</button></div></div>`}
function tickT(){const e=$('tm');if(e)e.textContent=fmtL(elapsed());const c=$('cdn');if(c&&M==='net'){const s=Math.ceil((NET.startAt-Date.now())/1000);const v=s>0?N(s):'GO!';if(c.textContent!==v){c.textContent=v;if(s>0)fx('cd')}}}
setInterval(()=>{tickT();if(M==='net'&&NET.ph==='cd'&&Date.now()>=NET.startAt&&!NET.host){NET.ph='play';render()}},250);
// ---------- ورودی لمسی: ضربهٔ کوتاه = ابزار انتخاب‌شده، لمس طولانی = پرچم
let lp=0,lt=0,li=-1;
function bind(){const b=$('bd');if(!b)return;
 b.addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(!c)return;li=+c.dataset.i;lp=0;clearTimeout(lt);lt=setTimeout(()=>{lp=1;if(!X.open[li])flagAt(li)},380)});
 const up=e=>{clearTimeout(lt);const c=e.target.closest('.c');if(!lp&&li>=0&&c&&+c.dataset.i===li)tap(li);li=-1};
 b.addEventListener('pointerup',up);b.addEventListener('pointercancel',()=>{clearTimeout(lt);li=-1});b.addEventListener('contextmenu',e=>e.preventDefault())}
// ================= رقابت شبکه‌ای: همهٔ گوشی‌ها با یک seed همان صفحه را می‌سازند =================
function myProg(){return{open:X.opened,pct:X.opened/X.safe,st:X.state==='won'?2:X.state==='lost'?1:0,ms:elapsed()}}
let lastPr=0;function sendPr(force){if(M!=='net'||!X)return;const n=Date.now();if(!force&&n-lastPr<250)return;lastPr=n;const p=myProg();if(NET.host)hostPr(NET.me,p);else send({to:'host',p:{t:'pr',q:NET.q,...p}})}
function startRound(seed,s,l){gid++;res=null;mc=0;sz=s;lv=l;X=mkBoard(s,l);genMines(X,seed,center(X));reveal(X,center(X));started=1;endMs=0;NET.rseed=seed;lastPr=0}
function snap(){return{t:'S',q:NET.q,ph:NET.ph,seed:NET.seed,sz,lv,el:Date.now()-NET.startAt,names,pl:NET.pl,gone:NET.gone,order:NET.order}}
function bc(){if(NET.on&&NET.host)send({to:'*',p:snap()})}
function hostNew(){NET.q++;NET.seed=rand32();NET.ph='cd';NET.startAt=Date.now()+3500;NET.order=[];NET.pl=names.map(()=>({open:0,pct:0,st:0,ms:0}));startRound(NET.seed,sz,lv);sendMine();render();bc()}
function sendMine(){const p=myProg();NET.pl[NET.me]={open:p.open,pct:p.pct,st:p.st,ms:p.ms}}
function hostPr(i,p){if(!NET.host||NET.ph!=='play'||!NET.pl[i])return;const o=NET.pl[i];if(o.st!==0)return;o.open=p.open|0;o.pct=Math.max(o.pct,Math.min(1,+p.pct||0));o.st=p.st===2?2:p.st===1?1:0;o.ms=Math.max(0,+p.ms||0);if(o.st===2)o.pct=1;
 if(o.st===2||NET.pl.every((q,k)=>q.st!==0||NET.gone[k]))endRound();else{if(li<0)render();bc()}}
function endRound(){if(NET.ph!=='play')return;NET.ph='over';NET.q++;const idx=NET.pl.map((_,i)=>i);idx.sort((a,b)=>{const A=NET.pl[a],B=NET.pl[b];if((A.st===2)!==(B.st===2))return A.st===2?-1:1;if(A.st===2)return A.ms-B.ms;return B.pct-A.pct||A.ms-B.ms||a-b});NET.order=idx;endMs=endMs||Date.now();const w=idx[0]===NET.me;if(w&&NET.pl[idx[0]].st===2)fx('win');render();bc()}
function applySnap(s){NET.last=Date.now();hideLost();NET.startAt=Date.now()-s.el;if(s.q<NET.q)return;
 names=s.names;NET.gone=s.gone||[];NET.pl=s.pl;NET.order=s.order||[];
 if(s.q===NET.q&&s.ph===NET.ph){if(li<0)render();return}
 const newRound=s.seed!==NET.rseed||!X;NET.q=s.q;NET.seed=s.seed;
 if(newRound){NET.ph=s.ph;startRound(s.seed,s.sz,s.lv);NET.pl=s.pl;if(s.ph==='play')NET.ph='play'}
 NET.ph=s.ph;if(s.ph==='over'){endMs=endMs||Date.now();if(NET.order[0]===NET.me&&NET.pl[NET.me].st===2)fx('win')}render()}
function showLost(){if($('lost'))return;const d=document.createElement('div');d.id='lost';d.innerHTML=t('lost')+'<br><button onclick="send({x:\'exit\'})">'+t('exit')+'</button>';document.body.appendChild(d)}
function hideLost(){const d=$('lost');if(d)d.remove()}
function netInit(o){M='net';NET.on=1;NET.me=o.me|0;NET.host=o.host?1:0;sz=o.size|0;lv=o.level|0;names=o.names;NET.gone=names.map(()=>0);NET.pl=names.map(()=>({open:0,pct:0,st:0,ms:0}));
 if(NET.host){hostNew();NET.hb=setInterval(bc,2000);setInterval(()=>{if(NET.ph==='cd'&&Date.now()>=NET.startAt){NET.ph='play';NET.q++;render();bc()}else if(NET.ph==='play'){if(Date.now()-NET.startAt>CAP*1000)endRound()}},400)}
 else{$('app').innerHTML='<div class="wait">'+t('conn')+'</div>';send({to:'host',p:{t:'hello'}});NET.hb=setInterval(()=>{const q=Date.now()-NET.last;if(q>15000)showLost();else if(q>4000)send({to:'host',p:{t:'hello'}})},2000)}}
window.msInit=function(o){setL(o.lang==='en'?'en':'fa');if(o.mode==='net'){netInit(o);return}M=o.mode==='ai'?'ai':o.mode==='local'?'local':'solo';sz=1;lv=0;fresh()};
window.onNet=function(idx,str){if(!NET.on)return;let m;try{m=JSON.parse(str)}catch(e){return}if(!m)return;
 if(NET.host){if(!(idx>0&&idx<names.length))return;if(m.t==='hello')bc();else if(m.t==='pr')hostPr(idx,m)}else if(idx===0&&m.t==='S')applySnap(m)};
window.onGone=function(i,f){if(!NET.on||!NET.host||!(i>0&&i<names.length))return;f=f?1:0;if(NET.gone[i]===f)return;NET.gone[i]=f;if(f&&NET.ph==='play'&&NET.pl.every((q,k)=>q.st!==0||NET.gone[k]))endRound();else{render();bc()}};
// کلیک‌های سرگردانِ نمایش (اندازهٔ صفحه)
addEventListener('resize',()=>{if(X)render()});
setInterval(()=>{if(M==='net'&&NET.ph==='play'&&X&&X.state==='play')sendPr(false)},1000);
if(!window.__msManual){setL('fa');fresh()}
</script>
