name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Flutter version
        run: flutter --version


      - name: Generate Android project
        run: flutter create --platforms=android .


      - name: Remove default test
        run: rm -f test/widget_test.dart


      - name: Configure Android ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for file in files:
              if file.exists():

                  text = file.read_text()

                  text = re.sub(
                      r'applicationId\s*[=]?\s*["\'][^"\']+["\']',
                      'applicationId "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'namespace\s*[=]?\s*["\'][^"\']+["\']',
                      'namespace "cyrustourist.ir.app"',
                      text
                  )

                  file.write_text(text)

          PY


      - name: Add Location permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          if "ACCESS_FINE_LOCATION" not in text:

              add = (
                  '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
                  '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
              )

              text = text.replace(
                  "<application",
                  add + "\n<application",
                  1
              )

          manifest.write_text(text)

          PY


      - name: Check logo file
        run: |
          if [ -f "logo-new.jpg" ]; then
            echo "Logo found"
          else
            echo "Logo not found - continue"
          fi


      - name: Get packages
        run: flutter pub get


      - name: Analyze
        run: flutter analyze || true


      - name: Build APK
        run: flutter build apk --release


      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
          build/app/outputs/flutter-apk/Cyrustourist.ir.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: Cyrustourist.ir

          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk

          if-no-files-found: error
