name: Create Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-android:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Show Flutter version
        run: flutter --version


      - name: Create Android project
        run: |
          if [ -d "android" ]; then
            echo "ERROR: android directory already exists."
            exit 1
          fi

          flutter create \
            --platforms=android \
            --org cyrustourist.ir \
            --project-name cyrustourist \
            .


      - name: Verify Android project
        run: |
          echo "===== ANDROID DIRECTORY ====="
          find android -maxdepth 3 -type f | sort

          echo ""
          echo "===== BUILD FILE ====="

          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            echo "Android build file not found."
            exit 1
          fi


      - name: Configure package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for file in files:

              if not file.exists():
                  continue

              found = True
              text = file.read_text()

              if file.suffix == ".kts":

                  text = re.sub(
                      r'namespace\s*=\s*"[^"]*"',
                      'namespace = "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'applicationId\s*=\s*"[^"]*"',
                      'applicationId = "cyrustourist.ir.app"',
                      text
                  )

              else:

                  text = re.sub(
                      r'namespace\s+"[^"]*"',
                      'namespace "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'applicationId\s+"[^"]*"',
                      'applicationId "cyrustourist.ir.app"',
                      text
                  )

              file.write_text(text)

          if not found:
              raise SystemExit(
                  "Android Gradle file not found."
              )

          PY


      - name: Configure location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          ]

          for permission in permissions:

              if permission not in text:

                  text = text.replace(
                      "<application",
                      permission + "\n    <application",
                      1
                  )

          manifest.write_text(text)

          PY


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      - name: Add Android project
        run: |
          git add android/


      - name: Check staged Android files
        run: |
          echo "===== STAGED FILES ====="
          git diff --cached --name-status

          echo ""
          echo "===== STAGED COUNT ====="
          git diff --cached --name-only | wc -l


      - name: Commit Android project
        run: |
          git commit \
            -m "Add standard Android project"


      - name: Push Android project
        run: |
          git push origin HEAD:main
