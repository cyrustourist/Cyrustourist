name: Build CyrusTourist APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(grep '^version:' pubspec.yaml | sed 's/version: *//')"

          NAME="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"

          MAJOR="$(echo "$NAME" | cut -d. -f1)"
          MINOR="$(echo "$NAME" | cut -d. -f2)"
          PATCH="$(echo "$NAME" | cut -d. -f3)"

          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD + 1))

          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH+$NEW_BUILD"

          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          echo "Old version: $CURRENT"
          echo "New version: $NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit \
              -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"

            git push
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        shell: bash
        env:
          CYRUS_KEYSTORE_BASE64: ${{ secrets.CYRUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/cyrus-signing"

          printf '%s' "$CYRUS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

          test -s "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

          echo "Keystore decoded successfully."

      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verification successful."

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed APK
        shell: bash
        env:
          CYRUS_KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          CYRUS_STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
          CYRUS_KEY_PASSWORD: ${{ secrets.CYRUS_KEY_PASSWORD }}
          CYRUS_KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --android-skip-build-dependency-validation

          test -s build/app/outputs/flutter-apk/app-release.apk

          echo "SIGNED APK BUILD SUCCESSFUL."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            build/app/outputs/flutter-apk/app-release.apk

          echo "APK signature verification successful."

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir.apk

          test -s build/app/outputs/flutter-apk/Cyrustourist.ir.apk

          echo "APK prepared successfully."

      - name: Create GitHub Release with APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v${{ steps.bump.outputs.new_version }}"
          APK="build/app/outputs/flutter-apk/Cyrustourist.ir.apk"

          echo "Creating GitHub Release..."
          echo "Repository: ${{ github.repository }}"
          echo "Tag: $TAG"
          echo "APK: $APK"

          gh release create "$TAG" \
            "$APK" \
            --repo "${{ github.repository }}" \
            --title "Cyrus Tourist $TAG" \
            --notes "Automated build from commit ${{ github.sha }}"

          echo "Release created successfully."

          echo "Getting real Release information from GitHub API..."

          RELEASE_JSON="$(
            gh api \
              "/repos/${{ github.repository }}/releases/tags/${TAG}"
          )"

          RELEASE_URL="$(
            echo "$RELEASE_JSON" \
              | jq -r '.html_url'
          )"

          APK_URL="$(
            echo "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(.name == "Cyrustourist.ir.apk")
                | .browser_download_url
              '
          )"

          APK_STATE="$(
            echo "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(.name == "Cyrustourist.ir.apk")
                | .state
              '
          )"

          APK_SIZE="$(
            echo "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(.name == "Cyrustourist.ir.apk")
                | .size
              '
          )"

          echo ""
          echo "======================================"
          echo "REAL GITHUB RELEASE INFORMATION"
          echo "======================================"
          echo "Release URL:"
          echo "$RELEASE_URL"
          echo ""
          echo "APK Download URL:"
          echo "$APK_URL"
          echo ""
          echo "APK State:"
          echo "$APK_STATE"
          echo ""
          echo "APK Size:"
          echo "$APK_SIZE bytes"
          echo "======================================"

          test -n "$RELEASE_URL"
          test "$RELEASE_URL" != "null"

          test -n "$APK_URL"
          test "$APK_URL" != "null"

          test "$APK_STATE" = "uploaded"

          test "$APK_SIZE" -gt 0

          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Test APK download URL
        shell: bash
        env:
          APK_URL: ${{ steps.release.outputs.apk_url }}
        run: |
          set -euo pipefail

          echo "Testing APK download URL..."

          HTTP_CODE="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$APK_URL"
          )"

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: APK download URL did not return HTTP 200."
            exit 1
          fi

          echo "APK download URL is working."

      - name: Verify Release and APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          echo "Checking GitHub Release..."

          gh release view "$TAG" \
            --repo "${{ github.repository }}"

          echo ""
          echo "Checking APK asset..."

          gh api \
            "/repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '
              .assets[]
              | select(.name == "Cyrustourist.ir.apk")
              | {
                  name: .name,
                  size: .size,
                  state: .state,
                  browser_download_url: .browser_download_url
                }
            '

          echo ""
          echo "Release and APK verification successful."

      - name: Add APK download links to Summary
        if: success()
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_SIZE: ${{ steps.release.outputs.apk_size }}
        run: |
          set -euo pipefail

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📱 Cyrus Tourist APK آماده است

          ## ✅ Build موفق بود

          **نسخه:** ${VERSION}

          **نام فایل:**
          \`Cyrustourist.ir.apk\`

          **حجم APK:** ${APK_SIZE} bytes

          ---

          ## 📥 دانلود APK

          ### ⭐ دانلود مستقیم

          👉 **[⬇️ دانلود مستقیم Cyrustourist.ir.apk](${APK_URL})**

          ### 📦 صفحه Release

          👉 **[📦 مشاهده Release نسخه ${VERSION}](${RELEASE_URL})**

          > لینک دانلود بالا مستقیماً از فیلد \`browser_download_url\` خود GitHub گرفته شده است.

          ---

          ## 🔎 بررسی نهایی

          - ✅ APK ساخته شد
          - ✅ APK با Keystore سایروس امضا شد
          - ✅ امضای APK تأیید شد
          - ✅ Release ساخته شد
          - ✅ فایل \`Cyrustourist.ir.apk\` آپلود شد
          - ✅ Asset در GitHub پیدا شد
          - ✅ وضعیت Asset برابر \`uploaded\` است
          - ✅ حجم فایل تأیید شد
          - ✅ لینک واقعی دانلود از GitHub API دریافت شد
          - ✅ لینک دانلود با HTTP 200 تست شد

          **نسخه آماده تست: ${VERSION}**
          EOF

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cyrus-signing"

          echo "Temporary keystore removed."
