name: Build CyrusTourist APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-apk:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.47.1'
      channel: stable
      cache: true

  - name: Flutter version
    run: flutter --version

  - name: Decode release keystore
    shell: bash
    env:
      CYRUS_KEYSTORE_BASE64: ${{ secrets.CYRUS_KEYSTORE_BASE64 }}
    run: |
      set -euo pipefail

      if [ -z "$CYRUS_KEYSTORE_BASE64" ]; then
        echo "ERROR: CYRUS_KEYSTORE_BASE64 is missing."
        exit 1
      fi

      mkdir -p "$RUNNER_TEMP/cyrus-signing"

      printf '%s' "$CYRUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

      test -s "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

      echo "Keystore decoded successfully."

  - name: Check signing secrets
    shell: bash
    env:
      STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.CYRUS_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
    run: |
      set -euo pipefail

      echo "STORE_PASSWORD length: ${#STORE_PASSWORD}"
      echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
      echo "KEY_ALIAS: $KEY_ALIAS"

  - name: Verify keystore
    shell: bash
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
      STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
    run: |
      set -euo pipefail

      keytool -list \
        -keystore "$KEYSTORE_PATH" \
        -storepass "$STORE_PASSWORD" \
        -alias "$KEY_ALIAS"

      echo "Keystore verification successful."

  - name: Flutter pub get
    run: flutter pub get

  - name: Build signed APK
    shell: bash
    env:
      CYRUS_KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
      CYRUS_STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
      CYRUS_KEY_PASSWORD: ${{ secrets.CYRUS_KEY_PASSWORD }}
      CYRUS_KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
    run: |
      set -euo pipefail

      flutter build apk \
        --release \
        --target-platform android-arm64 \
        --android-skip-build-dependency-validation

      test -s build/app/outputs/flutter-apk/app-release.apk

      echo "SIGNED APK BUILD SUCCESSFUL."

  - name: Verify APK signature
    shell: bash
    run: |
      set -euo pipefail

      APK="build/app/outputs/flutter-apk/app-release.apk"

      apksigner verify --verbose "$APK"

      echo "APK signature verification successful."

  - name: Prepare APK
    run: |
      cp build/app/outputs/flutter-apk/app-release.apk \
         build/app/outputs/flutter-apk/Cyrustourist.ir.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Cyrustourist.ir
      path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk
      if-no-files-found: error

  - name: Delete temporary keystore
    if: always()
    shell: bash
    run: |
      rm -rf "$RUNNER_TEMP/cyrus-signing"
```
