name: Build CyrusTourist APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK arm64
        run: flutter build apk --release --split-per-abi

      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
          build/app/outputs/flutter-apk/Cyrustourist.ir.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist.ir
          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk
