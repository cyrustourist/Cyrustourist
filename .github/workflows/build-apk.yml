name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Flutter
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version


      # ==========================================================
      # 3. Android project
      # ==========================================================

      - name: Check Android project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory is missing."
            exit 1
          fi

          echo "Android project found."


      # ==========================================================
      # 4. Package configuration
      # ==========================================================

      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for file in candidates:

              if not file.exists():
                  continue

              found = True
              text = file.read_text()

              if file.suffix == ".kts":

                  text = re.sub(
                      r'namespace\s*=\s*"[^"]*"',
                      'namespace = "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'applicationId\s*=\s*"[^"]*"',
                      'applicationId = "cyrustourist.ir.app"',
                      text
                  )

              else:

                  text = re.sub(
                      r'namespace\s+"[^"]*"',
                      'namespace "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'applicationId\s+"[^"]*"',
                      'applicationId "cyrustourist.ir.app"',
                      text
                  )

              file.write_text(text)

          if not found:
              raise SystemExit(
                  "ERROR: Android Gradle file was not found."
              )

          print("Package ID:")
          print("cyrustourist.ir.app")

          PY


      # ==========================================================
      # 5. Location permissions
      # ==========================================================

      - name: Configure Location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          fine = (
              '<uses-permission '
              'android:name="android.permission.ACCESS_FINE_LOCATION"/>'
          )

          coarse = (
              '<uses-permission '
              'android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          )

          if fine not in text:
              text = text.replace(
                  "<application",
                  fine + "\n    <application",
                  1
              )

          if coarse not in text:
              text = text.replace(
                  "<application",
                  coarse + "\n    <application",
                  1
              )

          manifest.write_text(text)

          print("Location permissions configured.")

          PY


      # ==========================================================
      # 6. Check assets
      # ==========================================================

      - name: Check assets
        run: |
          echo "===== assets/images ====="

          find assets/images \
            -maxdepth 1 \
            -type f \
            -print \
            -exec ls -lh {} \; \
            | sort

          echo ""
          echo "===== Root files ====="

          ls -lh logo-new.jpg 2>/dev/null || true


      # ==========================================================
      # 7. Dependencies
      # ==========================================================

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 8. Analyze
      # ==========================================================

      - name: Analyze project
        run: flutter analyze || true


      # ==========================================================
      # 9. Show Android configuration
      # ==========================================================

      - name: Show Android configuration
        run: |
          echo "===== Android files ====="
          find android/app/src/main -maxdepth 3 -type f | sort

          echo ""
          echo "===== Package ====="

          grep -R \
            "cyrustourist.ir.app" \
            android/app \
            || true


      # ==========================================================
      # 10. Build ARM64 ONLY
      #
      # Moto G54 5G uses ARM64.
      #
      # IMPORTANT:
      # This is NOT Universal APK.
      # This removes unnecessary CPU architectures.
      # ==========================================================

      - name: Build ARM64 Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64


      # ==========================================================
      # 11. Verify APK
      # ==========================================================

      - name: Verify APK
        run: |

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CyrusTourist ARM64 APK"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "APK size in bytes:"

          stat -c "%s" "$APK"

          echo ""
          echo "APK architecture check:"

          unzip -l "$APK" | grep "lib/" | head -30 || true


      # ==========================================================
      # 12. Rename
      # ==========================================================

      - name: Rename APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir-arm64.apk


      # ==========================================================
      # 13. Upload
      # ==========================================================

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist-ir-ARM64
          path: build/app/outputs/flutter-apk/Cyrustourist.ir-arm64.apk
          if-no-files-found: error
