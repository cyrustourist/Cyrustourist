<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسم و فامیل · ۴ گوشی</title>
<style>
:root{--a:#7fd0ff;--b:#b9e4ff;--c:#ffc6e4;--card:#fffdf8;--ink:#23304a;--mut:#6b7a96;--line:#d6e4f5;--chip:#e9f3ff;--pk:#ff4f9a;--gr:#27c25f;--gd:#ffc928;--rd:#ff4d5a;--bl:#2f8cff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a:#0b1a33;--b:#12284a;--c:#2a1b46;--card:#18294a;--ink:#f1f4ff;--mut:#9fb0d0;--line:#2b4572;--chip:#1f3760;color-scheme:dark}}
:root[data-theme="dark"]{--a:#0b1a33;--b:#12284a;--c:#2a1b46;--card:#18294a;--ink:#f1f4ff;--mut:#9fb0d0;--line:#2b4572;--chip:#1f3760;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;line-height:1.7;background:linear-gradient(180deg,var(--a),var(--b) 55%,var(--c)) fixed}
main{max-width:1000px;margin:0 auto;padding:12px 12px 30px}
h1{font-size:22px;margin:4px 0;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.mut{color:var(--mut);text-align:center;font-size:13px;margin:4px 0}
.card{background:var(--card);border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 8px 0 rgba(0,0,0,.08),0 16px 26px -8px rgba(20,40,90,.35);border:1px solid var(--line)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:11px;font:inherit;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(#ff7ab8,var(--pk));box-shadow:0 5px 0 #c42b73,0 10px 14px rgba(0,0,0,.2);cursor:pointer;margin:10px 0}
.btn.g{background:linear-gradient(#5be08a,var(--gr));box-shadow:0 5px 0 #168a40,0 10px 14px rgba(0,0,0,.2)}
.btn.gh{background:var(--chip);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.s{font-size:13px;padding:7px;margin:4px 0}
.btn:active{transform:translateY(3px);box-shadow:none}
.top{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.lt{width:84px;height:84px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:#4a3200;background:radial-gradient(circle at 30% 25%,#fff3a0,var(--gd) 70%);box-shadow:0 8px 0 #b98a00,0 14px 16px rgba(0,0,0,.3);transform:perspective(300px) rotateX(12deg)}
.tm{font-size:46px;font-weight:900;min-width:90px;text-align:center}.warn{color:var(--rd);animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.12)}}
.bar{height:12px;border-radius:9px;background:var(--chip);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--pk))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ph{background:var(--card);border-radius:26px;border:3px solid var(--line);padding:10px;box-shadow:0 8px 0 rgba(0,0,0,.1),0 14px 22px -8px rgba(20,40,90,.4)}
.ph.dn{border-color:var(--gr)}
.ph h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:14px}
.f{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}.f span{min-width:70px;color:var(--mut)}
input{width:100%;font:inherit;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.nm{font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
td.c{cursor:pointer}td.c.x{color:var(--rd);text-decoration:line-through;opacity:.7}td.c.z{color:var(--mut)}
td small{display:block;font-weight:900;color:var(--gr)}
.big{font-size:26px;font-weight:900;text-align:center;margin:10px 0}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px;margin-top:10px}.lb{height:54px;border:0;border-radius:16px;font:inherit;font-size:26px;font-weight:900;color:#4a3200;cursor:pointer;background:radial-gradient(circle at 30% 25%,#fff3a0,var(--gd) 70%);box-shadow:0 5px 0 #b98a00,0 9px 10px rgba(0,0,0,.25)}.lb:active{transform:translateY(3px);box-shadow:none}.lb:disabled{background:#c9d2e2;box-shadow:0 2px 0 #9aa6bd;color:#fff;cursor:default}
.pill{display:inline-block;border-radius:20px;padding:0 10px;font-size:12px;font-weight:800;background:var(--chip)}
.ts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tc{border-radius:20px;padding:2px 12px;font-size:13px;font-weight:800;background:var(--chip);border:2px solid transparent;opacity:.75}
.tc.on{background:var(--gd);color:#4a3200;border-color:#b98a00;opacity:1;transform:scale(1.08)}
.tc.nx{border-color:var(--pk);opacity:1}
.cf{text-align:center}.cf .lt{margin:12px auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h3{margin:2px 0 8px;font-size:15px}
.xl{overflow-x:auto}.xl table{min-width:360px}.rw{cursor:pointer}.rw:active{background:var(--chip)}
.dt{background:var(--chip);padding:6px 2px}.dt table{font-size:12px}
.p20{color:#b98a00!important}.p10{color:var(--gr)!important}.p5{color:#e08a00!important}.p0{color:var(--mut)!important}
td small.p20{font-size:11px}
.rkc{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}.rkc:last-child{border:0}
.rkc .md{font-size:26px;min-width:38px;text-align:center}.rkc b{flex:1}.rkc .sc{font-size:20px;font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tab{font:inherit;cursor:pointer;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:800;background:var(--chip);color:var(--ink);border:2px solid transparent}
.tab.on{background:var(--gd);color:#4a3200;border-color:#b98a00}
.lg2{font-size:11.5px;color:var(--mut);text-align:center;margin:6px 0}
#endbar{margin-top:18px}
input:disabled{opacity:.6}
#tu{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,77,90,.93);color:#fff;text-align:center;animation:fl .35s infinite alternate}
#tu b{font-size:64px;line-height:1.3;text-shadow:0 4px 0 rgba(0,0,0,.25)}#tu span{font-size:18px;font-weight:800}
@keyframes fl{to{background:rgba(190,20,40,.95)}}
#snd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:50;border:0;border-radius:50%;width:38px;height:38px;font-size:18px;background:var(--chip);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
#lost{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:98;background:var(--rd);color:#fff;border-radius:16px;padding:10px 14px;text-align:center;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#lost button{margin-top:6px;border:0;border-radius:12px;padding:6px 16px;font:inherit;font-weight:800;background:#fff;color:var(--rd);cursor:pointer}
td small.vt{color:var(--rd);font-size:11px}
.sp{font-size:44px;text-align:center;margin:8px 0}
</style>
</head>
<body><main id="app"></main>
<script>
const sp=s=>s.split('،');
const CAT=[['👤','نام'],['👪','نام خانوادگی'],['🏙','شهر'],['🍲','غذا'],['🏛','مکان گردشگری'],['🐾','حیوان'],['🎨','رنگ'],['🪑','اشیا'],['🚗','خودرو']];
const DB=[sp('علی،مریم،سارا،رضا،نیما،حسین،پریسا،کیان،مهسا،داریوش،ترانه،شیما،کامران،نگار،سینا،بهار،آرش،گلناز،دانیال،فرزانه،تینا،محمد،زهرا،هادی،الهام،بهنام،پویا،رها،سحر،امیر'),
sp('احمدی،رضایی،کریمی،حسینی،محمدی،جعفری،نوری،صادقی،پناهی،شریفی،کاظمی،بهرامی،سلیمی،دانشور،رحیمی،ترابی،مرادی،گلشن،فرهادی،نیک‌پور،هاشمی،بابایی،طاهری،پارسا،سعیدی،خسروی'),
sp('اصفهان،شیراز،تبریز،مشهد،یزد،کاشان،رشت،اهواز،ارومیه،قم،کرمان،بوشهر،همدان،ساری،زنجان،اراک،بندرعباس،ایلام،سمنان،گرگان،بجنورد،خرم‌آباد،دزفول،نیشابور،سنندج،بیرجند'),
sp('آش،برنج،پلو،کباب،قورمه‌سبزی،فسنجان،حلیم،سمنو،دوغ،نان،کوکو،ماست،شیربرنج،فالوده،بستنی،گز،سوهان،ته‌چین،کشک،شله‌زرد،دلمه،عدس‌پلو،باقلوا،زرشک‌پلو،خورشت،رشته‌پلو،سیب‌زمینی،کلم‌پلو'),
sp('ارگ بم،برج میلاد،پاسارگاد،تخت جمشید،چغازنبیل،دماوند،سی‌وسه‌پل،نقش جهان،کاخ گلستان،باغ ارم،قشم،کیش،ماسوله،بازار وکیل،تاق بستان،دریاچه ارومیه،کویر لوت،غار علیصدر،آبشار بیشه،گنبد قابوس،هرمز،بیستون،شوش،باغ فین،مسجد نصیرالملک'),
sp('اسب،پلنگ،گربه،سگ،روباه،خرس،گرگ،شیر،فیل،زرافه،کلاغ،طاووس،عقاب،دلفین،لاک‌پشت،میمون،گوزن،بز،خرگوش،قناری،مار،ماهی،تمساح،کبوتر،شتر،آهو،یوزپلنگ'),
sp('آبی،ارغوانی،بنفش،پرتقالی،نارنجی،سبز،سرخ،سفید،سیاه،زرد،صورتی،قرمز،قهوه‌ای،طلایی،نقره‌ای،کرم،خاکستری،فیروزه‌ای،لیمویی،زرشکی،شیری،گلی،مشکی،نیلی،سرمه‌ای،یشمی'),
sp('میز،صندلی،کتاب،قلم،کلید،ساعت،چراغ،آینه،فرش،قاشق،چنگال،بشقاب،کیف،کفش،تلفن،دفتر،مداد،چتر،ظرف،لیوان،سطل،تخت،پنجره،در،گلدان،شانه،نردبان،توپ،کلاه،رادیو'),
sp('پراید،پژو،سمند،دنا،تیبا،ساینا،رانا،کوییک،شاهین،تارا،آریسان،سیتروئن،بنز،تویوتا،هیوندای،کیا،مزدا،نیسان،رنو،فورد،جیلی،چانگان،سورن،ماکسیما')];
const AB=sp('ا،ب،پ،ت،ث،ج،چ،ح،خ،د،ذ،ر،ز،ژ،س،ش،ص،ض،ط،ظ،ع،غ،ف،ق،ک،گ،ل،م،ن،و،ه،ی');
const nm=s=>String(s||'').replace(/[آأإ]/g,'ا').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[‌\s]/g,'').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),$=id=>document.getElementById(id),app=$('app'),R=a=>a[Math.random()*a.length|0];
// ---- حالت شبکه (گوشی‌های نزدیک): NET.on=1 → هر گوشی فقط صفحهٔ خودش را می‌بیند؛ میزبان (NET.host) داور است.
const NET={on:0,me:0,host:1,last:0,lost:0,hb:0};
const isH=()=>!NET.on||NET.host;
let P=['کوروش','سارا','نیما','مهسا'].map((n,i)=>({n,a:Array(6).fill(''),d:0,t:0,r:0,gone:0})),G={rd:0,R:5,L:'',end:0,iv:0,rej:new Set(),ph:'lobby',used:[],stopped:0,time:60,hist:[],v:0,open:-1,sm:'',pq:0,vq:0,votes:{},cf:0,last:0};
function send(m){try{NetCh.postMessage(JSON.stringify(m))}catch(e){}}
let AC;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,at=0,ty='square',v=.2){const a=ac();if(!a||G.mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function vib(p){try{navigator.vibrate&&!G.mute&&navigator.vibrate(p)}catch(e){}}
const sfx={tick:()=>tone(1000,.06,0,'sine',.15),ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.12,'triangle',.25)),alarm:()=>{for(let i=0;i<10;i++)tone(i%2?740:988,.28,i*.3,'sawtooth',.3);tone(1318,.9,3.0,'triangle',.3)},win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,i*.16,'triangle',.28)),warn:()=>[880,660,880,660].forEach((f,i)=>tone(f,.16,i*.18,'sawtooth',.28)),tick2:()=>tone(1500,.07,0,'square',.25)};
const MED=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
const SM0='اولین نفری که (حداقل ۷ مورد) را پر کند «تمام شد» می‌زند؛ بقیه ۱۰ ثانیه وقت دارند ⏱';
const randLetter=()=>{const f=AB.filter(x=>!G.used.includes(x));return R(f.length?f:AB)};
function ranks(){const o=P.map((p,i)=>({i,t:p.t})).sort((a,b)=>b.t-a.t||a.i-b.i);o.forEach((x,k)=>{x.rk=k&&o[k-1].t===x.t?o[k-1].rk:k+1});return o}
const md=r=>MED[r-1]||fa(r);
function waitCard(t,sub){return '<div class="card cf" style="text-align:center"><div class="sp">⏳</div><p class="big" style="font-size:18px">'+t+'</p>'+(sub?'<p class="mut">'+sub+'</p>':'')+'</div>'}
function back(){if(NET.on)send({x:'exit'});else lobby()}
function endBar(){return NET.on&&!NET.host?'':'<div id="endbar"><button class="btn gh" onclick="endAsk()">🏁 پایان بازی</button></div>'}
function endAsk(){$('endbar').innerHTML='<div class="card cf" style="text-align:center"><p class="big" style="font-size:18px">بازی همین‌جا تمام شود؟</p><p class="mut">دورِ نیمه‌کاره حساب نمی‌شود؛ دورهای قبلی در جدول می‌مانند.</p><div class="row2"><button class="btn" onclick="endGame()">بله، پایان</button><button class="btn gh" onclick="endBack()">ادامه بازی</button></div></div>'}
function endBack(){$('endbar').innerHTML='<button class="btn gh" onclick="endAsk()">🏁 پایان بازی</button>'}
function endGame(){if(!isH())return;clearInterval(G.iv);clearTimeout(G.pt);if(!G.hist.length){G.ph='end0';G.pq++;end0();bc();return}G.ph='res';G.last=1;G.pq++;resView(true);bc()}
function end0(){app.innerHTML='<div class="card" style="text-align:center"><h1>🏁 بازی پایان یافت</h1><p class="mut">هنوز هیچ دوری کامل نشده بود.</p></div><button class="btn g" onclick="back()">بازگشت</button>'}
function strip(){return `<div class="ts">${P.map((p,i)=>`<span class="tc ${i===G.ch?'on':(i===(G.ch+1)%P.length?'nx':'')}">${i===G.ch?'🎯 ':(i===(G.ch+1)%P.length?'⏭ ':'')}${fa(i+1)}. ${esc(p.n)}</span>`).join('')}</div>`}
function stat(){return `<div class="ts" id="ps">${P.map(q=>`<span class="tc ${q.d?'on':''}">${q.d?'✋':'✍'} ${esc(q.n)}${q.gone?' ⚠':''}</span>`).join('')}</div>`}
function lobby(){G.ph='lobby';clearInterval(G.iv);app.innerHTML=`<h1>✍️ اسم و فامیل · ۴ گوشی</h1><p class="mut">پیش‌نمایش روی یک صفحه: هر گوشی فقط صفحهٔ خودش را می‌بیند. در بازی واقعی هر گوشی جداست و با Nearby به میزبان وصل می‌شود.</p>
<div class="card"><div class="grid">${P.map((p,i)=>`<div class="ph dn"><h4><span>${i?'📱 گوشی '+fa(i+1):'👑 میزبان'}</span><span class="pill">✔ متصل</span></h4><input class="nm" value="${esc(p.n)}" maxlength="14" oninput="P[${i}].n=this.value||'بازیکن ${fa(i+1)}'"></div>`).join('')}</div>
<p class="mut">زمان هر دور: ${[30,60,90].map(t=>`<button class="pill" style="border:0;cursor:pointer;${G.time===t?'background:var(--gd)':''}" onclick="G.time=${t};lobby()">${fa(t)} ث</button>`).join(' ')} · ${fa(G.R)} دور · نوبتی حرف انتخاب می‌شود</p>
<p class="lg2">امتیاز هر خانه: ۲۰ = فقط شما پر کرده‌اید و بقیه نتوانستند · ۱۰ = پاسخ درست و یکتا · ۵ = پاسخ تکراری · ۰ = خالی یا نامعتبر</p></div>
<button class="btn g" onclick="newGame()">آغاز بازی ▶</button>`}
function newGame(){ac();G.won=0;P.forEach(p=>{p.t=0;p.r=0;p.d=0});G.rd=0;G.used=[];G.hist=[];G.open=-1;G.last=0;nextRound()}
function nextRound(){clearInterval(G.iv);G.rd++;G.ch=(G.rd-1)%P.length;G.v=0;G.ph='pick';G.cf=0;G.pq++;pickScreen();armPick();bc()}
// اگر نوبت‌دارِ انتخاب حرف دیر کند یا گوشی‌اش قطع شود، میزبان حرف تصادفی انتخاب می‌کند
function armPick(){clearTimeout(G.pt);if(!NET.on||!NET.host)return;G.pt=setTimeout(()=>{if(G.ph==='pick')startRound(randLetter())},P[G.ch].gone?2500:40000)}
function pickScreen(){G.cf=0;const mine=!NET.on||NET.me===G.ch;
 const hd=`<div class="card"><h1>🎯 نوبت ${esc(P[G.ch].n)} است</h1><p class="mut">ترتیب چرخشی: دور ${fa(G.rd)} از ${fa(G.R)} · نفر بعدی: ${esc(P[(G.ch+1)%P.length].n)}</p>${strip()}`;
 if(!mine){app.innerHTML=hd+`<p class="big">⏳ منتظر انتخاب حرف توسط ${esc(P[G.ch].n)}…</p></div>${endBar()}`;return}
 app.innerHTML=hd+`<p class="mut">${NET.on?'📱 نوبت توست! حرف شروع را انتخاب کن (حرف‌های قبلی خاموش‌اند؛ اگر تا ۴۰ ثانیه انتخاب نکنی تصادفی انتخاب می‌شود).':'📱 گوشی '+esc(P[G.ch].n)+': حرف شروع را انتخاب کن (حرف‌های قبلی خاموش‌اند). روی گوشی بقیه فقط «منتظر انتخاب حرف…» دیده می‌شود.'}</p><div class="lg">${AB.map(l=>`<button class="lb" ${G.used.includes(l)?'disabled':''} onclick="pre('${l}')">${l}</button>`).join('')}</div></div><button class="btn gh" onclick="pre()">🎲 حرف تصادفی</button>${endBar()}`}
function pre(l){ac();if(!l)l=randLetter();G.pk=l;G.cf=1;
 app.innerHTML=`<div class="card cf" style="text-align:center"><h1>🎯 نوبت ${esc(P[G.ch].n)} است</h1>${strip()}<p class="mut">دور ${fa(G.rd)} از ${fa(G.R)} · حرف انتخاب‌شده:</p><div class="lt">${l}</div><p class="big">حرف «${l}» تأیید شود؟</p><div class="row2"><button class="btn g" onclick="go(G.pk)">✔ تأیید و آغاز</button><button class="btn gh" onclick="pickScreen()">↩ بازگشت و ویرایش</button></div></div>${endBar()}`}
function go(l){ac();if(NET.on&&!NET.host){send({to:'host',p:{t:'pick',l}});app.innerHTML=waitCard('حرف «'+l+'» ارسال شد','منتظر شروع دور…');return}startRound(l)}
function startRound(l){ac();clearTimeout(G.pt);G.used.push(l);G.L=l;G.rej=new Set();G.votes={};G.stopped=0;G.sm=SM0;P.forEach(p=>{p.a=Array(CAT.length).fill('');p.d=0;p.r=0});G.end=Date.now()+G.time*1000;G.tot=G.time;G.lt=99;G.v=NET.on?NET.me:0;G.ph='play';G.pq++;play();clearInterval(G.iv);G.iv=setInterval(tick,250);bc()}
function play(){G.ph='play';const i=NET.on?NET.me:G.v,p=P[i];
 app.innerHTML=`<div class="card top"><span class="pill">دور ${fa(G.rd)} از ${fa(G.R)} · حرف را ${esc(P[G.ch].n)} انتخاب کرد</span><div class="lt">${G.L}</div><div class="tm" id="tm">${fa(Math.max(0,Math.ceil((G.end-Date.now())/1000)))}</div></div><div class="bar"><i id="br" style="width:100%"></i></div><p class="mut" id="sm">${esc(G.sm)}</p>
${NET.on?stat():`<div class="tabs">${P.map((q,k)=>`<button class="tab ${k===i?'on':''}" onclick="G.v=${k};play()">📱 ${esc(q.n)} ${q.d?'✋':'✍'}</button>`).join('')}</div>
<p class="lg2">در بازی واقعی هر گوشی فقط صفحهٔ خودش را می‌بیند؛ این‌جا با زبانه‌ها بین گوشی‌ها جابه‌جا می‌شوید و پاسخ بقیه پنهان است.</p>`}
<div class="ph ${p.d?'dn':''}" id="ph${i}" style="max-width:520px;margin:10px auto"><h4><span>📱 صفحهٔ ${esc(p.n)}</span><span class="pill" id="st${i}">${p.d?'✋ تمام':'✍ می‌نویسد'}</span></h4>${CAT.map((c,j)=>`<div class="f"><span>${c[0]} ${c[1]}</span><input id="i${i}_${j}" value="${esc(p.a[j])}" ${p.d?'disabled':''} placeholder="با «${G.L}»" oninput="P[${i}].a[${j}]=this.value;chk(${i});sa()"></div>`).join('')}<button class="btn g s" id="fb${i}" onclick="fin(${i})" disabled>✋ تمام شد</button>${NET.on?'':`<button class="btn gh s" onclick="bot(${i})">🤖 پر کردن نمونه (فقط پیش‌نمایش)</button><button class="btn gh s" onclick="botAll()">🤖 پر کردن همهٔ گوشی‌ها (فقط پیش‌نمایش)</button>`}</div>${endBar()}`;chk(i)}
// بروزرسانی بدون بازسازی صفحه (تا نوشتنِ بازیکن نپرد): وضعیت بقیه، پیام و زمان
function patchPlay(){if(G.ph!=='play')return;const e=$('ps');if(e)e.outerHTML=stat();const s=$('sm');if(s)s.textContent=G.sm}
let _sa=0;function sa(){if(!NET.on||NET.host)return;clearTimeout(_sa);_sa=setTimeout(subAns,450)}
function subAns(){if(NET.on&&!NET.host&&(G.ph==='play'||G.ph==='tu'))send({to:'host',p:{t:'ans',a:P[NET.me].a}})}
function chk(i){const ok=P[i].a.filter(x=>nm(x)).length>=CAT.length-2;const b=$('fb'+i);if(b)b.disabled=!ok||P[i].d}
function fillBot(i){CAT.forEach((c,j)=>{const w=DB[j].filter(x=>nm(x)[0]===nm(G.L));P[i].a[j]=w.length?R(w):''})}
function bot(i){fillBot(i);play()}
function botAll(){P.forEach((p,i)=>{if(!p.d)fillBot(i)});play()}
function markDone(i){P[i].d=1;if(!G.stopped){sfx.warn();G.stopped=1;G.end=Math.min(G.end,Date.now()+10000);G.tot=Math.max(1,Math.ceil((G.end-Date.now())/1000));G.sm='🛑 '+P[i].n+' تمام کرد! ۱۰ ثانیه برای بقیه'}checkAll()}
// همه تمام کردند (یا قطع شدند) → دور فوراً بسته می‌شود
function checkAll(){if(NET.on&&P.every(p=>p.d||p.gone))G.end=Math.min(G.end,Date.now()+400)}
function fin(i){if(P[i].d)return;if(NET.on&&!NET.host){P[i].d=1;sfx.ok();send({to:'host',p:{t:'fin',a:P[i].a}});play();return}
 sfx.ok();markDone(i);(!NET.on||i===NET.me)?play():patchPlay();bc()}
function tick(){const ms=G.end-Date.now(),l=Math.max(0,Math.ceil(ms/1000)),t=$('tm');if(!t)return;t.textContent=fa(l);t.className='tm'+(l<=10?' warn':'');$('br').style.width=Math.max(0,ms/(G.tot*10))+'%';if(l<=15&&l>0&&l!==G.lt){if(l===15&&G.tot>25&&!G.stopped)sfx.warn();else if(l<=5)sfx.tick2();else if(l<=10)sfx.tick()}G.lt=l;if(l<=0){clearInterval(G.iv);if(isH())timeUp();else subAns()}}
function overlay(){sfx.alarm();vib([500,200,500,200,800]);const d=document.createElement('div');d.id='tu';d.innerHTML='<b>⏰ وقت تمام شد!</b><span>قلم‌ها زمین؛ پاسخ‌ها برای همه نمایش داده می‌شود…</span>';document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
// در حالت شبکه ۳ ثانیه صبر می‌کنیم تا پاسخ نهایی همهٔ گوشی‌ها برسد
function timeUp(){if(G.ph!=='play')return;G.ph='tu';G.pq++;bc();overlay();setTimeout(()=>{if(G.ph==='tu')startReview()},NET.on?3000:2800)}
function startReview(){G.ph='rev';G.votes={};G.rej=new Set();G.pq++;review();bc()}
// ---- امتیازدهی: تنها پاسخ معتبر ۲۰ · یکتا ۱۰ · تکراری ۵ · نامعتبر ۰
function valid(j,i){const x=nm(P[i].a[j]);return x&&x[0]===nm(G.L)&&!G.rej.has(j+'.'+i)?x:''}
function calc(){return CAT.map((c,j)=>{const v=P.map((p,i)=>valid(j,i)),n=v.filter(Boolean).length;return v.map(x=>!x?0:n===1?20:(v.filter(y=>y===x).length===1?10:5))})}
function recRej(){G.rej=new Set();if(!NET.on)return;const need=P.length-1;for(const k in G.votes)if(G.votes[k].length*2>need)G.rej.add(k)}
function review(){G.ph='rev';const pts=calc(),tot=P.map((_,i)=>pts.reduce((s,r)=>s+r[i],0));
 const msg=NET.on?'وقت تمام شد؛ پاسخ همهٔ بازیکنان دیده می‌شود. روی پاسخ مشکوکِ دیگران بزنید تا رأی «رد» بدهید؛ با رأی اکثریت رد می‌شود (دوباره بزنید تا رأی پس گرفته شود).':'وقت تمام شد؛ حالا صفحهٔ همهٔ بازیکنان برای همه دیده می‌شود. روی پاسخ مشکوک بزنید تا رد/تأیید شود (در بازی واقعی: رأی اکثریت).';
 app.innerHTML=`<div class="card"><h1>📝 پاسخ‌های همه · حرف «${G.L}»</h1><p class="mut">${msg}</p>
<div style="overflow-x:auto"><table><tr><th></th>${P.map(p=>`<th>${esc(p.n)}</th>`).join('')}</tr>${CAT.map((c,j)=>`<tr><th>${c[0]} ${c[1]}</th>${P.map((p,i)=>{const x=nm(p.a[j]),bad=!x||x[0]!==nm(G.L),k=j+'.'+i,rj=G.rej.has(k),vs=G.votes[k]||[],own=NET.on&&i===NET.me;return`<td class="c ${rj||bad?(bad?'z':'x'):''}" ${bad||own?'':`onclick="tg(${j},${i})"`}>${p.a[j]?esc(p.a[j]):'—'}<small class="p${pts[j][i]}">${bad||rj?'':'+'+fa(pts[j][i])}</small>${vs.length?`<small class="vt">🚫${fa(vs.length)}${NET.on&&vs.includes(NET.me)?' (تو)':''}</small>`:''}</td>`}).join('')}</tr>`).join('')}<tr><th>جمع دور</th>${tot.map(t=>`<th>${fa(t)}</th>`).join('')}</tr></table></div>
<p class="lg2">۲۰ = تنها پاسخ معتبر · ۱۰ = یکتا · ۵ = تکراری · ۰ = خالی/نامعتبر</p></div>${isH()?'<button class="btn g" onclick="res()">تأیید امتیازها ✔</button>':'<p class="mut">⏳ منتظر تأیید امتیازها توسط میزبان…</p>'}${endBar()}`}
function tg(j,i){const k=j+'.'+i;if(!NET.on){G.rej.has(k)?G.rej.delete(k):G.rej.add(k);review();return}if(i===NET.me)return;if(NET.host)vote(NET.me,k);else send({to:'host',p:{t:'vote',k}})}
function vote(w,k){const q=String(k).split('.').map(Number),j=q[0],i=q[1];if(G.ph!=='rev'||!(j>=0&&j<CAT.length)||!P[i]||i===w)return;const a=G.votes[k]||(G.votes[k]=[]),x=a.indexOf(w);x<0?a.push(w):a.splice(x,1);if(!a.length)delete G.votes[k];G.vq++;recRej();review();bc()}
function res(){if(!isH()||G.ph!=='rev')return;const pts=calc();const cells=CAT.map((c,j)=>P.map((p,i)=>({v:p.a[j]||'',p:pts[j][i]})));P.forEach((p,i)=>{p.r=pts.reduce((s,r)=>s+r[i],0);p.t+=p.r});G.hist.push({rd:G.rd,L:G.L,r:P.map(p=>p.r),cells});G.open=G.hist.length-1;sfx.ok();G.last=G.rd>=G.R?1:0;G.ph='res';G.pq++;resView(G.last);bc()}
function tgo(r){G.open=G.open===r?-1:r;resView(G.last)}
function detail(h,o){return `<table><tr><th></th>${o.map(x=>`<th>${esc(P[x.i].n)}</th>`).join('')}</tr>${CAT.map((c,j)=>`<tr><th>${c[0]} ${c[1]}</th>${o.map(x=>{const q=h.cells[j][x.i];return`<td>${q.v?esc(q.v):'—'}<small class="p${q.p}">${q.p?'+'+fa(q.p):'۰'}</small></td>`}).join('')}</tr>`).join('')}</table>`}
function sheet(o){return `<div class="xl"><table><tr><th>دور</th><th>حرف</th>${o.map(x=>`<th>${md(x.rk)} ${esc(P[x.i].n)}</th>`).join('')}</tr>${G.hist.map((h,r)=>`<tr class="rw" onclick="tgo(${r})"><td>${fa(r+1)} ${G.open===r?'▾':'▸'}</td><td><b>${h.L}</b></td>${o.map(x=>`<td>${fa(h.r[x.i])}</td>`).join('')}</tr>${G.open===r?`<tr><td class="dt" colspan="${2+o.length}">${detail(h,o)}</td></tr>`:''}`).join('')}<tr><th colspan="2">جمع کل</th>${o.map(x=>`<th>${fa(x.t)}</th>`).join('')}</tr><tr><th colspan="2">رتبه</th>${o.map(x=>`<th>${md(x.rk)} ${fa(x.rk)}</th>`).join('')}</tr></table></div><p class="lg2">ستون‌ها بر پایهٔ امتیاز کل از رتبه ۱ تا ${fa(P.length)} چیده می‌شوند · روی هر دور بزنید تا ریز خانه‌ها دیده شود</p>`}
function awards(){const c=P.map(()=>({u:0,v:0}));G.hist.forEach(h=>h.cells.forEach(row=>row.forEach((q,i)=>{if(q.p===20)c[i].u++;if(q.p>0)c[i].v++})));const best=k=>{const m=Math.max(...c.map(x=>x[k]));return m>0?c.map((x,i)=>x[k]===m?esc(P[i].n):'').filter(Boolean).join(' و ')+' ('+fa(m)+')':'—'};return `<div class="card"><h3>🎖 جوایز</h3><p>⚡ بیشترین خانهٔ ۲۰ امتیازی: <b>${best('u')}</b></p><p>🎯 بیشترین پاسخ معتبر: <b>${best('v')}</b></p></div>`}
function board(o){return o.map(x=>`<div class="rkc"><span class="md">${md(x.rk)}</span><b>رتبه ${fa(x.rk)} · ${esc(P[x.i].n)}</b><span class="sc">${fa(x.t)}</span></div>`).join('')}
function resView(last){G.ph='res';G.last=last;const o=ranks();if(last&&!G.won){G.won=1;sfx.win();vib([300,100,300,100,600])}if(!last)G.won=0;
 const foot=last?(isH()?'<button class="btn g" onclick="newGame()">بازی دوباره ↻</button><button class="btn gh" onclick="back()">بازگشت</button>':'<p class="mut">⏳ منتظر میزبان برای بازی دوباره…</p><button class="btn gh" onclick="back()">خروج</button>'):(isH()?'<button class="btn" onclick="nextRound()">دور بعد ◀</button>'+endBar():'<p class="mut">⏳ منتظر شروع دور بعد توسط میزبان…</p>');
 app.innerHTML=`<h1>${last?'🏆 پایان بازی':'📊 امتیاز پس از دور '+fa(G.hist.length)}</h1>${last?`<div class="card"><div class="big">🏆 برنده: ${o.filter(x=>x.rk===1).map(x=>esc(P[x.i].n)).join(' و ')}</div></div>`:''}
<div class="card"><h3>📋 جدول امتیازها (مانند اکسل)</h3>${sheet(o)}</div><div class="card"><h3>🏅 رتبه‌بندی ${last?'نهایی':'تا این لحظه'}</h3>${board(o)}</div>${last?awards():''}${foot}`}
// ================= شبکه: میزبان داور است و وضعیت را برای همه می‌فرستد =================
function snap(){const rv=G.ph==='rev'||G.ph==='res';return{t:'S',pq:G.pq,vq:G.vq,ph:G.ph,rd:G.rd,R:G.R,ch:G.ch,L:G.L,used:G.used,rem:Math.max(0,G.end-Date.now()),tot:G.tot,stopped:G.stopped,sm:G.sm,time:G.time,last:G.last,
 names:P.map(p=>p.n),done:P.map(p=>p.d?1:0),gone:P.map(p=>p.gone?1:0),tt:P.map(p=>p.t),a:rv?P.map(p=>p.a):null,votes:G.ph==='rev'?G.votes:null,hist:G.ph==='res'?G.hist:null}}
function bc(){if(NET.on&&NET.host)send({to:'*',p:snap()})}
function setA(i,a){if(Array.isArray(a))P[i].a=CAT.map((c,j)=>String(a[j]==null?'':a[j]).slice(0,40))}
function hostMsg(i,m){if(!(i>0&&i<P.length)||!m)return;const p=P[i];
 switch(m.t){
 case'hello':bc();break;
 case'pick':if(G.ph==='pick'&&i===G.ch&&typeof m.l==='string'&&(m.l===''||(AB.includes(m.l)&&!G.used.includes(m.l))))startRound(m.l||randLetter());break;
 case'ans':if((G.ph==='play'||G.ph==='tu')&&!p.d)setA(i,m.a);break;
 case'fin':if(G.ph==='play'&&!p.d){setA(i,m.a);if(p.a.filter(x=>nm(x)).length>=CAT.length-2){markDone(i);patchPlay();bc()}}break;
 case'vote':vote(i,m.k);break}}
function applySnap(s){NET.last=Date.now();hideLost();
 s.names.forEach((n,i)=>{if(P[i])P[i].n=n});
 G.R=s.R;G.rd=s.rd;G.ch=s.ch;G.L=s.L;G.used=s.used||[];G.stopped=s.stopped;G.sm=s.sm;G.time=s.time;G.tot=s.tot;G.end=Date.now()+s.rem;G.last=s.last;
 P.forEach((p,i)=>{p.gone=s.gone[i];p.t=s.tt[i];p.d=i===NET.me?(p.d||s.done[i]):s.done[i]});
 if(s.a)P.forEach((p,i)=>{p.a=s.a[i]});
 if(s.hist)G.hist=s.hist;
 G.votes=s.votes||{};recRej();
 const np=s.pq!==G.pq,nv=s.vq!==G.vq;G.pq=s.pq;G.vq=s.vq;G.ph=s.ph;
 if(!np&&!nv){if(G.ph==='play')patchPlay();return}
 if(G.ph!=='res')G.won=0;
 if(G.ph==='pick'){clearInterval(G.iv);pickScreen()}
 else if(G.ph==='play'){if(np){P[NET.me].a=Array(CAT.length).fill('');P[NET.me].d=0;G.v=NET.me;G.lt=99}play();clearInterval(G.iv);G.iv=setInterval(tick,250)}
 else if(G.ph==='tu'){clearInterval(G.iv);subAns();overlay()}
 else if(G.ph==='rev')review();
 else if(G.ph==='res')resView(G.last);
 else if(G.ph==='end0')end0()}
function showLost(){if($('lost'))return;NET.lost=1;const d=document.createElement('div');d.id='lost';d.innerHTML='⚠️ ارتباط با میزبان قطع شده است. گوشی‌ها را نزدیک‌تر کنید…<br><button onclick="back()">خروج</button>';document.body.appendChild(d)}
function hideLost(){NET.lost=0;const d=$('lost');if(d)d.remove()}
// ---- ورودی‌ها از برنامه (Dart)
window.netInit=function(o){if(NET.on)return;NET.on=1;NET.me=o.me|0;NET.host=o.host?1:0;G.time=o.time||60;
 P=o.names.map(n=>({n,a:Array(CAT.length).fill(''),d:0,t:0,r:0,gone:0}));G.R=Math.max(5,P.length);NET.last=Date.now();
 if(NET.host){NET.hb=setInterval(bc,2000);newGame()}
 else{app.innerHTML=waitCard('در حال اتصال به میزبان…','گوشی‌ها را نزدیک هم نگه دارید');send({to:'host',p:{t:'hello'}});
  NET.hb=setInterval(()=>{const q=Date.now()-NET.last;if(q>15000)showLost();else if(q>4000)send({to:'host',p:{t:'hello'}})},2000)}};
window.onNet=function(idx,str){if(!NET.on)return;let m;try{m=JSON.parse(str)}catch(e){return}if(!m)return;if(NET.host)hostMsg(idx,m);else if(idx===0&&m.t==='S')applySnap(m)};
window.onGone=function(i,f){if(!NET.on||!NET.host||!P[i])return;f=f?1:0;if(!!P[i].gone===!!f)return;P[i].gone=f;if(f){if(G.ph==='pick'&&G.ch===i)armPick();if(G.ph==='play')checkAll()}if(G.ph==='play')patchPlay();bc()};
const sb=document.createElement('button');sb.id='snd';sb.textContent='🔊';sb.onclick=()=>{G.mute=!G.mute;sb.textContent=G.mute?'🔇':'🔊'};document.body.appendChild(sb);
lobby();
</script>
