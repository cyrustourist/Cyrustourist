name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Flutter version
        run: flutter --version


      # ==========================================================
      # Create standard Android project only if it does not exist
      # ==========================================================

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org cyrustourist.ir \
              --project-name cyrustourist \
              .
          else
            echo "Android project already exists."
          fi


      # ==========================================================
      # Remove Flutter default test
      # ==========================================================

      - name: Remove default test
        run: rm -f test/widget_test.dart


      # ==========================================================
      # Configure package name
      # ==========================================================

      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for file in files:

              if not file.exists():
                  continue

              text = file.read_text()

              if file.suffix == ".kts":

                  text = re.sub(
                      r'namespace\s*=\s*"[^"]*"',
                      'namespace = "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'applicationId\s*=\s*"[^"]*"',
                      'applicationId = "cyrustourist.ir.app"',
                      text
                  )

              else:

                  text = re.sub(
                      r'namespace\s+"[^"]*"',
                      'namespace "cyrustourist.ir.app"',
                      text
                  )

                  text = re.sub(
                      r'applicationId\s+"[^"]*"',
                      'applicationId "cyrustourist.ir.app"',
                      text
                  )

              file.write_text(text)

          PY


      # ==========================================================
      # Location permissions
      # ==========================================================

      - name: Configure Location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not found."
              )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "<application",
                      permission + "\n    <application",
                      1
                  )

          manifest.write_text(text)

          PY


      # ==========================================================
      # Verify project
      # ==========================================================

      - name: Verify Android project
        run: |
          echo "===== Android directory ====="
          find android -maxdepth 3 -type f | sort | head -200

          echo "===== Manifest ====="
          cat android/app/src/main/AndroidManifest.xml

          echo "===== Package ====="
          grep -R "cyrustourist.ir.app" android/app || true


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Get dependencies
        run: flutter pub get


      # ==========================================================
      # Analyze
      # ==========================================================

      - name: Analyze project
        run: flutter analyze || true


      # ==========================================================
      # Clean build
      # ==========================================================

      - name: Clean Flutter
        run: flutter clean


      - name: Get dependencies again
        run: flutter pub get


      # ==========================================================
      # Build UNIVERSAL APK
      #
      # No --split-per-abi
      # No ABI restriction
      # ==========================================================

      - name: Build Universal APK
        run: |
          flutter build apk --release


      # ==========================================================
      # Verify APK
      # ==========================================================

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "===== APK CREATED ====="
          ls -lh "$APK"


      # ==========================================================
      # Rename
      # ==========================================================

      - name: Rename APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir.apk


      # ==========================================================
      # Upload
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist.ir
          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk
          if-no-files-found: error
