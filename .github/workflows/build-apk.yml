name: Build CyrusTourist APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CHECKING PUBSPEC VERSION"
          echo "======================================"

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          CURRENT="$(
            sed -n 's/^version:[[:space:]]*//p' pubspec.yaml \
            | head -n 1 \
            | tr -d '\r'
          )"

          if [ -z "$CURRENT" ]; then
            echo "ERROR: Could not find version: in pubspec.yaml."
            echo ""
            echo "Current version lines:"
            grep -n "^version:" pubspec.yaml || true
            exit 1
          fi

          echo "Current version: [$CURRENT]"

          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo ""
            echo "ERROR: Invalid Flutter version format."
            echo ""
            echo "Expected format:"
            echo "  MAJOR.MINOR.PATCH+BUILD"
            echo ""
            echo "Example:"
            echo "  5.8.76+5876"
            echo ""
            echo "Found:"
            echo "  $CURRENT"
            exit 1
          fi

          NAME="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"

          if [[ -z "$MAJOR" || -z "$MINOR" || -z "$PATCH" || -z "$BUILD" ]]; then
            echo "ERROR: Failed to parse version components."
            exit 1
          fi

          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}+${NEW_BUILD}"

          echo ""
          echo "Old version:"
          echo "$CURRENT"

          echo ""
          echo "New version:"
          echo "$NEW_VERSION"

          sed -i "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml

          VERIFY="$(
            sed -n 's/^version:[[:space:]]*//p' pubspec.yaml \
            | head -n 1 \
            | tr -d '\r'
          )"

          if [ "$VERIFY" != "$NEW_VERSION" ]; then
            echo "ERROR: Version update verification failed."
            echo "Expected: $NEW_VERSION"
            echo "Found:    $VERIFY"
            exit 1
          fi

          echo ""
          echo "Version update successful."

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit \
              -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"

            git push
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter version
        shell: bash
        run: |
          set -euo pipefail

          flutter --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project assets
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFYING FLUTTER ASSETS"
          echo "======================================"

          REQUIRED_ASSETS=(
            "assets/images/splash.jpg"
            "assets/images/home-hero.jpg"
            "assets/images/logo-new.jpg"
            "assets/images/video_menu_header.png"
          )

          FAILED=0

          for ASSET in "${REQUIRED_ASSETS[@]}"; do
            if [ -f "$ASSET" ]; then
              SIZE="$(stat -c%s "$ASSET")"
              echo "OK: $ASSET ($SIZE bytes)"
            else
              echo "ERROR: Missing asset: $ASSET"
              FAILED=1
            fi
          done

          echo ""
          echo "Checking old deleted home images..."

          OLD_ASSETS=(
            "assets/images/home_fa.jpg"
            "assets/images/home_en.jpg"
            "assets/images/home_ar.jpg"
          )

          for ASSET in "${OLD_ASSETS[@]}"; do
            if [ -f "$ASSET" ]; then
              echo "WARNING: Old asset still exists: $ASSET"
            else
              echo "OK: Old asset not present: $ASSET"
            fi
          done

          echo ""
          echo "Checking pubspec asset declarations..."

          grep -n "assets/images/" pubspec.yaml || true

          echo ""
          echo "======================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more required assets are missing."
            exit 1
          fi

          echo "Asset verification successful."

      - name: Decode release keystore
        shell: bash
        env:
          CYRUS_KEYSTORE_BASE64: ${{ secrets.CYRUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/cyrus-signing"

          printf '%s' "$CYRUS_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

          test -s "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

          echo "Keystore decoded successfully."

      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verification successful."

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning Flutter build cache..."

          flutter clean

          echo "Flutter clean completed."

      - name: Flutter pub get after clean
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      - name: Verify Flutter configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FLUTTER PROJECT CHECK"
          echo "======================================"

          echo ""
          echo "Pubspec version:"
          grep '^version:' pubspec.yaml

          echo ""
          echo "Flutter dependencies:"
          flutter pub deps --style=compact

          echo ""
          echo "======================================"

      - name: Build signed APK
        shell: bash
        env:
          CYRUS_KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          CYRUS_STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
          CYRUS_KEY_PASSWORD: ${{ secrets.CYRUS_KEY_PASSWORD }}
          CYRUS_KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
        run: |
          set -uo pipefail

          LOG_FILE="$RUNNER_TEMP/flutter-build.log"

          echo "======================================"
          echo "STARTING SIGNED APK BUILD"
          echo "======================================"
          echo ""

          echo "Version:"
          grep '^version:' pubspec.yaml

          echo ""
          echo "Target platform: android-arm64"
          echo "Build mode: release"
          echo ""

          set +e

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --android-skip-build-dependency-validation \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "======================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "❌ FLUTTER APK BUILD FAILED"
            echo "Exit code: $BUILD_EXIT"
            echo "======================================"
            echo ""
            echo "========== LAST 200 LINES OF BUILD LOG =========="
            tail -n 200 "$LOG_FILE" || true
            echo "=================================================="
            echo ""

            echo "========== SEARCHING FOR COMMON ERRORS =========="
            grep -Ei \
              "error:|exception|failed|FAILURE|missing|not found|asset|gradle" \
              "$LOG_FILE" \
              | tail -n 100 \
              || true
            echo "================================================="

            {
              echo "## ❌ Flutter APK Build Failed"
              echo ""
              echo "**Exit code:** $BUILD_EXIT"
              echo ""
              echo "### Last 200 lines of build log"
              echo '```text'
              tail -n 200 "$LOG_FILE" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$BUILD_EXIT"
          fi

          echo "✅ FLUTTER APK BUILD SUCCESSFUL."
          echo "======================================"

          test -s build/app/outputs/flutter-apk/app-release.apk

          echo "APK file exists and is not empty."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          test -n "$APKSIGNER"

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            build/app/outputs/flutter-apk/app-release.apk

          echo "APK signature verification successful."

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir.apk

          test -s build/app/outputs/flutter-apk/Cyrustourist.ir.apk

          APK_SIZE="$(stat -c%s build/app/outputs/flutter-apk/Cyrustourist.ir.apk)"

          echo "APK prepared successfully."
          echo "APK size: $APK_SIZE bytes"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist.ir.apk
          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk
          # نگه‌داری کوتاه‌مدت (۵ روز) تا این Artifact خودکار پاک شود و
          # دوباره باعث پر شدن سهمیه‌ی فضای ذخیره‌سازی Actions نشود —
          # همان مشکلی که باعث حذف این step در گذشته شده بود.
          # دانلود دائمی همچنان از طریق GitHub Release (step بعدی) در
          # دسترس می‌ماند.
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release with APK
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v${{ steps.bump.outputs.new_version }}"
          APK="build/app/outputs/flutter-apk/Cyrustourist.ir.apk"

          echo "Creating GitHub Release..."
          echo "Repository: ${{ github.repository }}"
          echo "Tag: $TAG"
          echo "APK: $APK"

          gh release create "$TAG" \
            "$APK" \
            --repo "${{ github.repository }}" \
            --title "Cyrus Tourist $TAG" \
            --notes "Automated build from commit ${{ github.sha }}"

          echo "Release created successfully."

          echo "Getting real Release information from GitHub API..."

          RELEASE_JSON="$(
            gh api \
              "/repos/${{ github.repository }}/releases/tags/${TAG}"
          )"

          RELEASE_URL="$(
            echo "$RELEASE_JSON" \
              | jq -r '.html_url'
          )"

          APK_URL="$(
            echo "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(.name == "Cyrustourist.ir.apk")
                | .browser_download_url
              '
          )"

          APK_STATE="$(
            echo "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(.name == "Cyrustourist.ir.apk")
                | .state
              '
          )"

          APK_SIZE="$(
            echo "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(.name == "Cyrustourist.ir.apk")
                | .size
              '
          )"

          echo ""
          echo "======================================"
          echo "REAL GITHUB RELEASE INFORMATION"
          echo "======================================"

          echo "Release URL:"
          echo "$RELEASE_URL"

          echo ""
          echo "APK Download URL:"
          echo "$APK_URL"

          echo ""
          echo "APK State:"
          echo "$APK_STATE"

          echo ""
          echo "APK Size:"
          echo "$APK_SIZE bytes"

          echo "======================================"

          test -n "$RELEASE_URL"
          test "$RELEASE_URL" != "null"

          test -n "$APK_URL"
          test "$APK_URL" != "null"

          test "$APK_STATE" = "uploaded"

          test "$APK_SIZE" -gt 0

          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Test APK download URL
        id: test_download
        shell: bash
        env:
          APK_URL: ${{ steps.release.outputs.apk_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.bump.outputs.new_version }}
        run: |
          set -uo pipefail

          echo "Testing APK download..."
          echo "Tag: $TAG"
          echo "Asset URL (for reference): $APK_URL"
          echo ""

          # نکته: به‌جای curl خام روی browser_download_url (که برای
          # ریپازیتوری‌های private می‌تواند رفتار غیرقابل‌اعتماد داشته
          # باشد)، از دستور رسمی خودِ GitHub CLI برای دانلود asset
          # استفاده می‌کنیم. این دستور به‌طور خودکار احراز هویت و
          # هدرهای لازم را مدیریت می‌کند و روش پیشنهادی خودِ GitHub است.

          DOWNLOAD_DIR="$RUNNER_TEMP/apk-download-test"
          mkdir -p "$DOWNLOAD_DIR"

          MAX_ATTEMPTS=6
          SLEEP_SECONDS=5
          SUCCESS=0
          LAST_ERROR=""

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: gh release download..."

            rm -f "$DOWNLOAD_DIR/Cyrustourist.ir.apk"

            if OUTPUT="$(
              gh release download "$TAG" \
                --repo "${{ github.repository }}" \
                --pattern "Cyrustourist.ir.apk" \
                --dir "$DOWNLOAD_DIR" \
                --clobber \
                2>&1
            )"; then
              if [ -s "$DOWNLOAD_DIR/Cyrustourist.ir.apk" ]; then
                DOWNLOADED_SIZE="$(stat -c%s "$DOWNLOAD_DIR/Cyrustourist.ir.apk")"
                echo "Download succeeded. File size: $DOWNLOADED_SIZE bytes"
                SUCCESS=1
                break
              else
                LAST_ERROR="gh release download reported success but file is missing or empty."
                echo "$LAST_ERROR"
              fi
            else
              LAST_ERROR="$OUTPUT"
              echo "gh release download failed:"
              echo "$OUTPUT"
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          {
            echo "### 🔎 APK Download Test"
            echo ""
            if [ "$SUCCESS" -eq 1 ]; then
              echo "✅ Download succeeded via \`gh release download\` (file size: ${DOWNLOADED_SIZE} bytes)."
            else
              echo "❌ Download failed after $MAX_ATTEMPTS attempts."
              echo ""
              echo "**Last error:**"
              echo '```text'
              echo "$LAST_ERROR"
              echo '```'
              echo ""
              echo "**Asset URL:** \`$APK_URL\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: Could not download the APK asset after $MAX_ATTEMPTS attempts."
            echo "See the Summary tab of this run for full diagnostic details."
            exit 1
          fi

          echo "APK download test successful."

      - name: Verify Release and APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          echo "Checking GitHub Release..."

          gh release view "$TAG" \
            --repo "${{ github.repository }}"

          echo ""
          echo "Checking APK asset..."

          gh api \
            "/repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '
              .assets[]
              | select(.name == "Cyrustourist.ir.apk")
              | {
                  name: .name,
                  size: .size,
                  state: .state,
                  browser_download_url: .browser_download_url
                }
            '

          echo ""
          echo "Release and APK verification successful."

      - name: Add APK download links to Summary
        if: success()
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_SIZE: ${{ steps.release.outputs.apk_size }}
        run: |
          set -euo pipefail

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📱 Cyrus Tourist APK آماده است

          ## ✅ Build موفق بود

          **نسخه:** ${VERSION}

          **نام فایل:**
          \`Cyrustourist.ir.apk\`

          **حجم APK:** ${APK_SIZE} bytes

          ---

          ## 📥 دانلود APK

          ### ⭐ دانلود مستقیم

          👉 **[⬇️ دانلود مستقیم Cyrustourist.ir.apk](${APK_URL})**

          ### 📦 صفحه Release

          👉 **[📦 مشاهده Release نسخه ${VERSION}](${RELEASE_URL})**

          > لینک دانلود بالا مستقیماً از فیلد \`browser_download_url\` خود GitHub گرفته شده است.

          ---

          ## 🔎 بررسی نهایی

          - ✅ APK ساخته شد
          - ✅ APK با Keystore سایروس امضا شد
          - ✅ امضای APK تأیید شد
          - ✅ Release ساخته شد
          - ✅ فایل \`Cyrustourist.ir.apk\` آپلود شد
          - ✅ Asset در GitHub پیدا شد
          - ✅ وضعیت Asset برابر \`uploaded\` است
          - ✅ حجم فایل تأیید شد
          - ✅ لینک واقعی دانلود از GitHub API دریافت شد
          - ✅ لینک دانلود با HTTP 200 تست شد

          **نسخه آماده تست: ${VERSION}**
          EOF

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cyrus-signing"

          echo "Temporary keystore removed."
