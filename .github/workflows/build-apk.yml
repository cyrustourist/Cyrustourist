name: Build CyrusTourist APK - Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 3. Flutter version
      # ==========================================================

      - name: Flutter version
        run: |
          flutter --version
          echo ""
          dart --version


      # ==========================================================
      # 4. Verify Android project
      # ==========================================================

      - name: Verify Android project
        run: |
          set -e

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project: OK"


      # ==========================================================
      # 5. Verify JPG assets
      # ==========================================================

      - name: Verify JPG assets
        run: |
          set -e

          echo "===== assets/images ====="

          find assets/images \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "===== Required JPG files ====="

          test -f assets/images/splash.jpg
          test -f assets/images/home.jpg

          echo "splash.jpg: OK"
          echo "home.jpg: OK"


      # ==========================================================
      # 6. Verify pubspec
      # ==========================================================

      - name: Verify pubspec
        run: |
          set -e

          echo "===== pubspec assets ====="

          grep -n "assets/images" pubspec.yaml

          echo ""
          echo "===== Project version ====="

          grep -n "^version:" pubspec.yaml


      # ==========================================================
      # 7. Verify Dart image references
      # ==========================================================

      - name: Verify Dart JPG references
        run: |
          set -e

          echo "===== Checking PNG references ====="

          if grep -R -n \
            --include="*.dart" \
            -E "splash\.png|home\.png" \
            lib; then

            echo ""
            echo "ERROR: PNG reference found in lib."
            exit 1

          fi

          echo "No splash.png/home.png references found."

          echo ""
          echo "===== JPG references ====="

          grep -R -n \
            --include="*.dart" \
            -E "splash\.jpg|home\.jpg" \
            lib


      # ==========================================================
      # 8. Get dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 9. Flutter analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze


      # ==========================================================
      # 10. Show Android configuration
      # ==========================================================

      - name: Show Android configuration
        run: |
          echo "===== build.gradle.kts ====="
          cat android/app/build.gradle.kts

          echo ""
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml


      # ==========================================================
      # 11. Create temporary RELEASE keystore
      #
      # This key exists only on the GitHub runner.
      # It is NOT saved to the repository.
      # ==========================================================

      - name: Create temporary release keystore
        shell: bash
        run: |
          set -e

          mkdir -p android/app/temporary-signing

          STORE_PASSWORD="$(openssl rand -hex 16)"
          KEY_PASSWORD="$(openssl rand -hex 16)"

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool \
            -genkeypair \
            -v \
            -keystore android/app/temporary-signing/cyrustourist-test.jks \
            -storetype JKS \
            -alias cyrustourist_test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CyrusTourist Test, OU=CyrusTourist, O=CyrusTourist, L=Test, ST=Test, C=AZ"

          echo ""
          echo "Temporary release keystore created."


      # ==========================================================
      # 12. Configure temporary RELEASE signing
      # ==========================================================

      - name: Configure temporary release signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          signing_block = r'''
              signingConfigs {
                  create("cyrusTouristTest") {
                      storeFile = file("temporary-signing/cyrustourist-test.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = "cyrustourist_test"
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          if 'create("cyrusTouristTest")' not in text:

              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: buildTypes block was not found."
                  )

              text = text.replace(
                  marker,
                  signing_block + marker,
                  1
              )

          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = 'signingConfig = signingConfigs.getByName("cyrusTouristTest")'

          if old in text:
              text = text.replace(old, new, 1)

          elif new not in text:
              raise SystemExit(
                  "ERROR: Release signing configuration could not be configured."
              )

          path.write_text(text)

          print("Temporary RELEASE signing configured.")
          PY


      # ==========================================================
      # 13. Verify signing
      # ==========================================================

      - name: Verify temporary signing
        run: |
          set -e

          grep -n \
            "cyrusTouristTest" \
            android/app/build.gradle.kts

          echo ""
          echo "Temporary signing configuration: OK"


      # ==========================================================
      # 14. Clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 15. Get dependencies again
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 16. Build ARM64 RELEASE APK
      #
      # Motorola G54 5G
      # ==========================================================

      - name: Build ARM64 release APK
        run: |
          set -e

          flutter build apk \
            --release \
            --target-platform android-arm64


      # ==========================================================
      # 17. Locate APK
      # ==========================================================

      - name: Locate APK
        run: |
          set -e

          echo "===== APK files ====="

          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ==========================================================
      # 18. Verify APK
      # ==========================================================

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "CyrusTourist ARM64 RELEASE APK"
          echo "=============================================="

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # ==========================================================
      # 19. Find Android SDK build tools
      # ==========================================================

      - name: Find Android build tools
        shell: bash
        run: |
          set -e

          echo "===== Android SDK ====="

          echo "$ANDROID_HOME"

          echo ""
          echo "===== Build Tools ====="

          ls -la "$ANDROID_HOME/build-tools"


      # ==========================================================
      # 20. Inspect APK with available SDK tools
      # ==========================================================

      - name: Inspect APK with SDK tools
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "Using build tools:"
          echo "$BUILD_TOOLS"

          echo ""
          echo "===== APK SIZE ====="

          ls -lh "$APK"

          echo ""
          echo "===== APK ZIP CONTENTS ====="

          unzip -l "$APK" | head -100

          echo ""
          echo "===== ABI ====="

          unzip -l "$APK" \
            | grep "lib/" \
            | awk -F'lib/' 'NF > 1 {print $2}' \
            | cut -d/ -f1 \
            | sort -u

          echo ""
          echo "===== SIGNATURE ====="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"


      # ==========================================================
      # 21. Extract APK Manifest information
      #
      # Uses Android SDK aapt2 when available.
      # ==========================================================

      - name: Inspect APK manifest
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "===== APK MANIFEST ====="

          if [ -x "$BUILD_TOOLS/aapt2" ]; then

            "$BUILD_TOOLS/aapt2" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"

          elif [ -x "$BUILD_TOOLS/aapt" ]; then

            "$BUILD_TOOLS/aapt" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"

          else

            echo "WARNING: aapt/aapt2 not found."
            echo "APK was already successfully built."

          fi


      # ==========================================================
      # 22. Final diagnostic summary
      # ==========================================================

      - name: Final diagnostic summary
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo ""
          echo "=============================================="
          echo "CYRUSTOURIST APK DIAGNOSTIC SUMMARY"
          echo "=============================================="

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "SIZE:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "ABI:"
          unzip -l "$APK" \
            | grep "lib/" \
            | awk -F'lib/' 'NF > 1 {print $2}' \
            | cut -d/ -f1 \
            | sort -u

          echo ""
          echo "=============================================="
          echo "BUILD COMPLETED"
          echo "=============================================="


      # ==========================================================
      # 23. Rename APK
      # ==========================================================

      - name: Rename APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir-arm64-test.apk


      # ==========================================================
      # 24. Upload APK
      # ==========================================================

      - name: Upload ARM64 diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist-ARM64-Diagnostic
          path: build/app/outputs/flutter-apk/Cyrustourist.ir-arm64-test.apk
          if-no-files-found: error
