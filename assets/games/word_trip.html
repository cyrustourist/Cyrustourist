<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>کلمه‌گردی · Cyrus Tourist</title>
<style>
:root{--gold:#ffc928;--brown:#5a3411;--t1:#8a5524;--t2:#4a2a0c;--tl:#ffd66b}
body[data-tile="1"]{--t1:#9a5cf0;--t2:#5b2fb0;--tl:#fff}
body[data-tile="2"]{--t1:#1fb3a0;--t2:#0b6b61;--tl:#fff}
body[data-tile="3"]{--t1:#f08a3a;--t2:#b04d0c;--tl:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#101826;color:#fff;font-family:Tahoma,"Vazirmatn",system-ui,sans-serif}
#scene{position:fixed;inset:0;z-index:0}
#scene svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.ib{width:42px;height:42px;border:0;border-radius:14px;font-size:21px;background:linear-gradient(#ffb04a,#e87a14);box-shadow:0 3px 0 #9b4d08;color:#fff;cursor:pointer}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #9b4d08}
.pill{background:rgba(20,14,6,.72);border:2px solid rgba(255,201,40,.7);border-radius:16px;padding:6px 14px;font-weight:900;font-size:15px;white-space:nowrap}
.pill b{color:var(--gold)}
#cap{text-align:center;font-size:12.5px;color:#fff;text-shadow:0 1px 4px #000;margin:-2px 0 4px;opacity:.92}
#gridWrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
#grid{display:grid;direction:ltr;gap:4px}
.c{display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:900;color:transparent;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.c.on{color:var(--tl);background:linear-gradient(var(--t1),var(--t2));border-color:rgba(255,255,255,.35);animation:pop .35s ease}
.c.hn{box-shadow:0 0 0 3px #ffe27a}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
#prev{height:44px;display:flex;align-items:center;justify-content:center}
#prev span{min-width:90px;text-align:center;font-size:22px;font-weight:900;padding:4px 18px;border-radius:18px;background:linear-gradient(#e0434b,#a8191f);box-shadow:0 3px 0 #6d0e12;display:none}
#prev span.sh{display:inline-block}
#prev span.bad{animation:shake .4s}
#prev span.good{background:linear-gradient(#35c85f,#1b8a3a);box-shadow:0 3px 0 #0e5a24}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#bot{position:relative;display:flex;align-items:center;justify-content:center;padding:4px 0 14px}
#wheel{position:relative;touch-action:none}
#plate{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#6a7482 0%,#3b424d 55%,#23282f 100%);border:6px solid #b89a58;box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 30px rgba(0,0,0,.5)}
#plate:after{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle,#59616e,#2d333b);border:2px solid rgba(255,255,255,.12)}
#lines{position:absolute;inset:0;pointer-events:none}
.lt{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:900;color:#4a2a0c;background:radial-gradient(circle at 35% 30%,#fff6d6,#f1cf7c);box-shadow:0 3px 0 #9a7424;transition:transform .15s,left .35s,top .35s}
.lt.s{background:radial-gradient(circle at 35% 30%,#ffe27a,#ff9d1f);transform:scale(1.12);color:#fff}
#sh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:17%;height:17%;border:0;border-radius:50%;font-size:22px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;z-index:2}
.sb{position:absolute;bottom:14px;width:58px;height:58px;border:0;border-radius:16px;background:linear-gradient(#ffb04a,#e87a14);box-shadow:0 3px 0 #9b4d08;color:#fff;font:inherit;font-size:12.5px;font-weight:900;line-height:1.25;cursor:pointer}
.sb:active{transform:translateY(2px);box-shadow:0 1px 0 #9b4d08}
#hint{right:2px}
#skip{left:2px}
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);padding:18px}
#modal.on{display:flex}
.box{width:100%;max-width:380px;max-height:86vh;overflow:auto;background:linear-gradient(#2e2112,#1a120a);border:3px solid var(--gold);border-radius:24px;padding:18px;text-align:center}
.box h2{margin:0 0 10px;color:var(--gold);font-size:22px}
.big{font-size:56px}
.btn{width:100%;border:0;border-radius:16px;padding:12px;margin-top:10px;font:inherit;font-size:16px;font-weight:900;color:#1b1300;background:linear-gradient(#ffd54a,#e8a400);box-shadow:0 4px 0 #9a6b00;cursor:pointer}
.btn.gh{background:#2b2217;color:#ffe9b0;border:2px solid #5b4524;box-shadow:none}
.btn.rd{background:linear-gradient(#e0434b,#a8191f);color:#fff;box-shadow:0 4px 0 #6d0e12}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;font-size:14.5px;text-align:right}
.ch{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ch i{font-style:normal;padding:6px 10px;border:2px solid #5b4524;border-radius:12px;font-size:12.5px;cursor:pointer;background:#241a0f}
.ch i.on{border-color:var(--gold);background:#4a3414}
.sw{width:50px;height:28px;border-radius:14px;background:#5b4524;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#35c85f}
.sw.on:after{right:25px}
input[type=range]{width:130px;accent-color:#ffc928}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.85);padding:9px 16px;border-radius:14px;font-weight:800;font-size:14px;display:none;max-width:86%;text-align:center}
.cn{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#f2b100);vertical-align:-4px;margin-inline-start:4px;border:2px solid #b27a00}
</style>
</head>

</div>
<div id="modal"><div class="box" id="box"></div></div>

   return `<circle cx="90" cy="210" r="54" fill="#fff0b8" opacity=".85"/><path d="M0 400 Q90 340 180 390 T360 370 V640 H0Z" fill="#d99a5b"/>${w(190, 110)}${w(240, 150)}${w(120, 80)}<path d="M20 380 Q60 330 100 380Z" fill="#a9712f"/><path d="M0 470 Q120 420 240 470 T360 450 V640 H0Z" fill="#c07f43"/><path d="M0 560 Q150 510 360 560 V640 H0Z" fill="#a8672f"/>`; } },
 { n: 'پلکان‌های ماسوله، گیلان', sky: ['#bfe8ff', '#e6f9ff', '#ffffff'], f: () => {
   let h = ''; for (let r = 0; r < 5; r++) for (let c = 0; c <= r; c++) { const x = 100 + c * 44 - r * 22 + 22, y = 330 + r * 38; h += `<rect x="${x}" y="${y}" width="36" height="30" fill="#e9d2a4"/><path d="M${x - 3} ${y} L${x + 18} ${y - 14} L${x + 39} ${y}Z" fill="#d9672a"/><rect x="${x + 13}" y="${y + 10}" width="9" height="12" fill="#6b4a1f"/>`; }
   return `<path d="M0 300 Q90 200 180 280 T360 250 V640 H0Z" fill="#7cc46f"/><path d="M0 360 Q120 270 240 340 T360 320 V640 H0Z" fill="#4f9f4c"/>${h}<path d="M0 560 Q180 500 360 560 V640 H0Z" fill="#2f7a3a"/><ellipse cx="100" cy="300" rx="90" ry="14" fill="#fff" opacity=".5"/>`; } },
 { n: 'ساحل خلیج فارس', sky: ['#7fd8ff', '#bdeaff', '#fff1c1'], f: () => {
   const lf = (a) => `<path d="M60 250 Q${60 + a} ${215 - Math.abs(a) / 3} ${60 + a * 2} ${255}" stroke="#1e6b3a" stroke-width="7" fill="none" stroke-linecap="round"/>`;
   return `<circle cx="270" cy="210" r="44" fill="#fff3a0"/><rect x="0" y="330" width="360" height="320" fill="url(#sea)"/><g stroke="#fff" stroke-opacity=".6" stroke-width="3" fill="none"><path d="M10 380 q20 -12 40 0 t40 0 t40 0"/><path d="M180 420 q20 -12 40 0 t40 0 t40 0"/><path d="M40 470 q20 -12 40 0 t40 0 t40 0 t40 0"/></g><path d="M215 330 L305 330 L285 352 L235 352Z" fill="#5a3411"/><path d="M262 330 V262 L300 326Z" fill="#fff"/><path d="M0 560 Q180 520 360 570 V640 H0Z" fill="#f1d48a"/><path d="M58 560 Q56 400 64 256" stroke="#5a3a1a" stroke-width="9" fill="none"/>${lf(-50)}${lf(-25)}${lf(30)}${lf(55)}`; } },
 { n: 'برج میلاد و البرز، تهران', sky: ['#8fb8ff', '#cfe0ff', '#f3f7ff'], f: () => {
   let b = ''; for (let i = 0; i < 12; i++) { const h = 40 + (i * 37) % 60; b += `<rect x="${i * 31}" y="${560 - h}" width="26" height="${h + 90}" fill="#3a4a6d"/>`; }
   return `<path d="M-10 420 L70 270 L120 330 L190 230 L260 340 L310 290 L380 420Z" fill="#7d8fb8"/><path d="M70 270 L52 300 L70 292 L84 304Z M190 230 L170 266 L190 256 L208 270Z M310 290 L296 312 L310 306 L324 314Z" fill="#fff"/><path d="M175 640 L180 340 L185 640Z" fill="#59688a"/><ellipse cx="180" cy="322" rx="28" ry="15" fill="#6f7fa3"/><rect x="178" y="250" width="4" height="70" fill="#59688a"/>${b}`; } },
 { n: 'زمستان آذربایجان، تبریز', sky: ['#6b7fb0', '#a7b8e0', '#e8eeff'], f: () => {
   let s = ''; for (let i = 0; i < 60; i++) s += `<circle cx="${(i * 53) % 360}" cy="${(i * 97) % 600}" r="${1 + (i % 3)}" fill="#fff" opacity=".8"/>`;
   return `<path d="M-10 430 L60 290 L120 360 L200 240 L280 350 L330 300 L380 430Z" fill="#cdd7f2"/><path d="M200 240 L170 292 L200 280 L224 298Z M60 290 L40 322 L60 314 L78 326Z" fill="#fff"/><path d="M0 470 Q180 410 360 470 V640 H0Z" fill="#f4f7ff"/><path d="M0 560 Q180 520 360 570 V640 H0Z" fill="#e2e9fb"/>${s}`; } },
 { n: 'شب کویر', sky: ['#0b1030', '#1d2a66', '#3a3f8f'], f: () => stars(90, 3, 420) + `<circle cx="270" cy="140" r="34" fill="#fff6d0"/><circle cx="282" cy="132" r="30" fill="#1d2a66" opacity=".35"/><path d="M0 430 Q100 360 200 420 T360 400 V640 H0Z" fill="#2a2f6b"/><path d="M0 520 Q150 450 360 520 V640 H0Z" fill="#1c2050"/><rect x="140" y="400" width="6" height="40" fill="#0b0d26"/><path d="M110 440 L143 380 L176 440Z" fill="#0b0d26"/>` }
];
function sceneSVG(t) {
  const T = TH[t];
  return `<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.sky[0]}"/><stop offset=".55" stop-color="${T.sky[1]}"/><stop offset="1" stop-color="${T.sky[2]}"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fa7d8"/><stop offset="1" stop-color="#0a5a8f"/></linearGradient><linearGradient id="wv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="360" height="640" fill="url(#sk)"/>${T.f()}<rect width="360" height="640" fill="#000" opacity=".12"/></svg>`;
}

// ------------------------------------------------------------------ ذخیره و تنظیمات
const KEY = 'wordtrip_v1';
let P = { lvl: 0, done: 0, st: {}, set: { snd: 1, vol: 70, vib: 1, bg: -1, tile: 0 } };
try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r) { P = Object.assign(P, r); P.set = Object.assign({ snd: 1, vol: 70, vib: 1, bg: -1, tile: 0 }, r.set || {}); } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

// ------------------------------------------------------------------ پل سکه با برنامه
const pend = {}; let uid = 1, coins = 0;
window.__ecoRes = (id, ok, bal, extra) => { const p = pend[id]; if (p) { delete pend[id]; p({ ok: !!ok, bal: bal, extra: extra }); } };
function eco(a, n) {
  return new Promise(res => {
    if (window.Eco && window.Eco.postMessage) {
      const id = uid++; pend[id] = res;
      window.Eco.postMessage(JSON.stringify({ id: id, a: a, n: n || 0 }));
      setTimeout(() => { if (pend[id]) { delete pend[id]; res({ ok: false, bal: coins }); } }, 5000);
    } else {
      let b = parseInt(localStorage.getItem('wq_coin') || '120', 10);
      let ok = true;
      if (a === 'spend') { if (b >= n) b -= n; else ok = false; } else if (a === 'add') b += n;
      localStorage.setItem('wq_coin', String(b));
      res({ ok: ok, bal: b, extra: n });
    }
  });
}
function setCoins(b) { if (typeof b === 'number') { coins = b; $('coin').textContent = fa(b); } }

// ------------------------------------------------------------------ صدا و لرزش
let AC = null;
function tone(f, d, type, v, when) {
  if (!P.set.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime((v || 0.25) * P.set.vol / 100, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}
const sfx = {
  tap: i => tone(440 * Math.pow(1.122, i), 0.09, 'sine', 0.22),
  ok: () => [523, 659, 784].forEach((f, i) => tone(f, 0.16, 'triangle', 0.3, i * 0.08)),
  bad: () => { tone(180, 0.18, 'square', 0.12); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.3, i * 0.1)),
  hint: () => tone(880, 0.2, 'sine', 0.25)
};
function buzz(ms) {
  if (!P.set.vib) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); else if (window.Eco) window.Eco.postMessage(JSON.stringify({ id: 0, a: 'vib', n: ms })); } catch (e) {}
}
let tt = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => { el.style.display = 'none'; }, 1700); }

// ------------------------------------------------------------------ وضعیت مرحله
let cur = null; // {i, L, rev:Set, cells:Map(key->{ch}), size}
const key = (r, c) => r + ',' + c;
function wordCells(w) { const o = []; for (let i = 0; i < w.w.length; i++) o.push(w.d === 'h' ? [w.r, w.c - i, w.w[i]] : [w.r + i, w.c, w.w[i]]); return o; }

function loadLevel(i) {
  if (i >= LV.length) i = LV.length - 1;
  const L = LV[i];
  const st = P.st[i] || (P.st[i] = { rev: [] });
  const cells = new Map();
  L.w.forEach(w => wordCells(w).forEach(([r, c, ch]) => cells.set(key(r, c), ch)));
  cur = { i: i, L: L, rev: new Set(st.rev), cells: cells, sel: [], order: L.l.map((_, k) => k), over: false };
  P.lvl = i; save();
  shuffleOrder(true);
  setScene(); drawGrid(); drawWheel();
  $('lvp').innerHTML = 'مرحله <b>' + fa(i + 1) + '</b>';
  $('hc').textContent = fa(HINT_COST);
}
function setScene() {
  const t = P.set.bg >= 0 ? P.set.bg : cur.L.t;
  $('scene').innerHTML = sceneSVG(t);
  $('cap').textContent = '📍 ' + TH[t].n;
}
const isDone = w => wordCells(w).every(([r, c]) => cur.rev.has(key(r, c)));
const allDone = () => cur.L.w.every(isDone);

function drawGrid() {
  const g = $('grid'), L = cur.L;
  const wrap = $('gridWrap').getBoundingClientRect();
  const gap = 4, size = Math.max(22, Math.min(46, Math.floor((wrap.width - 6 - gap * (L.wd - 1)) / L.wd), Math.floor((wrap.height - 6 - gap * (L.h - 1)) / L.h)));
  g.style.gridTemplateColumns = 'repeat(' + L.wd + ',' + size + 'px)';
  g.style.gridTemplateRows = 'repeat(' + L.h + ',' + size + 'px)';
  let h = '';
  cur.cells.forEach((ch, k) => {
    const [r, c] = k.split(',').map(Number), on = cur.rev.has(k);
    h += '<div class="c' + (on ? ' on' : '') + '" id="c' + r + '_' + c + '" style="grid-row:' + (r + 1) + ';grid-column:' + (c + 1) + ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.58) + 'px">' + ch + '</div>';
  });
  g.innerHTML = h;
}
function revealCells(list, hinted) {
  list.forEach(([r, c]) => {
    const k = key(r, c);
    if (cur.rev.has(k)) return;
    cur.rev.add(k);
    const el = $('c' + r + '_' + c);
    if (el) { el.classList.add('on'); if (hinted) el.classList.add('hn'); }
  });
  P.st[cur.i].rev = Array.from(cur.rev); save();
}

// ------------------------------------------------------------------ چرخ حروف
let WS = 260;
function shuffleOrder(first) {
  const o = cur.order.slice();
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  cur.order = o;
  if (!first) layoutLetters();
}
function drawWheel() {
  const w = $('wheel'), n = cur.L.l.length;
  const avail = Math.min(window.innerWidth - 90, 330, window.innerHeight * 0.36);
  WS = Math.max(190, avail);
  w.style.width = w.style.height = WS + 'px';
  let h = '';
  for (let i = 0; i < n; i++) h += '<div class="lt" id="lt' + i + '"></div>';
  w.insertAdjacentHTML('beforeend', '');
  Array.from(w.querySelectorAll('.lt')).forEach(e => e.remove());
  w.insertAdjacentHTML('beforeend', h);
  layoutLetters();
}
function layoutLetters() {
  const n = cur.L.l.length, R = WS * (n > 5 ? 0.37 : 0.34), sz = WS * (n > 5 ? 0.19 : 0.22);
  cur.pos = [];
  for (let s = 0; s < n; s++) {
    const idx = cur.order[s], a = (s / n) * Math.PI * 2 - Math.PI / 2;
    const x = WS / 2 + Math.cos(a) * R, y = WS / 2 + Math.sin(a) * R;
    cur.pos[s] = [x, y];
    const el = $('lt' + s);
    el.textContent = cur.L.l[idx];
    el.style.cssText = 'left:' + (x - sz / 2) + 'px;top:' + (y - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px;font-size:' + Math.round(sz * 0.62) + 'px';
    el.className = 'lt';
  }
  cur.hit = sz * 0.55;
  cur.sel = []; drawLines(null); showPrev('');
}
function showPrev(t, cls) {
  const p = $('pv');
  p.textContent = t; p.className = t ? 'sh ' + (cls || '') : '';
}
function curWord() { return cur.sel.map(s => cur.L.l[cur.order[s]]).join(''); }
function drawLines(pt) {
  const svg = $('lines'); svg.setAttribute('viewBox', '0 0 ' + WS + ' ' + WS);
  let pts = cur.sel.map(s => cur.pos[s]);
  if (pt && pts.length) pts = pts.concat([pt]);
  svg.innerHTML = pts.length > 1 ? '<polyline fill="none" stroke="#ffc928" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".9" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>' : '';
}
function paintSel() {
  for (let s = 0; s < cur.L.l.length; s++) $('lt' + s).classList.toggle('s', cur.sel.includes(s));
}
function evPt(e) { const r = $('wheel').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hitTest(p) {
  for (let s = 0; s < cur.pos.length; s++) { const d = Math.hypot(cur.pos[s][0] - p[0], cur.pos[s][1] - p[1]); if (d < cur.hit) return s; }
  return -1;
}
let down = false;
function onDown(e) {
  if (cur.over) return;
  if (e.target && e.target.id === 'sh') return;
  down = true; try { $('wheel').setPointerCapture(e.pointerId); } catch (x) {}
  cur.sel = []; onMove(e);
}
function onMove(e) {
  if (!down) return;
  const p = evPt(e), h = hitTest(p);
  if (h >= 0) {
    const n = cur.sel.length;
    if (n >= 2 && cur.sel[n - 2] === h) { cur.sel.pop(); } else if (!cur.sel.includes(h)) { cur.sel.push(h); sfx.tap(cur.sel.length - 1); buzz(8); }
  }
  paintSel(); drawLines(p); showPrev(curWord());
}
function onUp() {
  if (!down) return;
  down = false;
  const w = curWord(); cur.sel = []; paintSel(); drawLines(null);
  if (w.length >= 2) submit(w); else showPrev('');
}

function submit(w) {
  const hit = cur.L.w.find(x => x.w === w);
  if (hit) {
    if (isDone(hit)) { showPrev(w, 'bad'); toast('این کلمه را قبلاً پیدا کرده‌اید'); sfx.bad(); setTimeout(() => showPrev(''), 700); return; }
    showPrev(w, 'good'); sfx.ok(); buzz(25);
    revealCells(wordCells(hit));
    setTimeout(() => showPrev(''), 600);
    if (allDone()) setTimeout(levelDone, 700);
  } else {
    showPrev(w, 'bad'); sfx.bad(); buzz(40);
    setTimeout(() => showPrev(''), 600);
  }
}

// ------------------------------------------------------------------ راهنما
async function hint() {
  if (cur.over) return;
  const left = []; cur.cells.forEach((ch, k) => { if (!cur.rev.has(k)) left.push(k); });
  if (!left.length) return;
  const r = await eco('spend', HINT_COST);
  setCoins(r.bal);
  if (!r.ok) { toast('سکهٔ کافی ندارید 🪙'); return; }
  const k = left[Math.floor(Math.random() * left.length)], [rr, cc] = k.split(',').map(Number);
  sfx.hint(); revealCells([[rr, cc]], true);
  if (allDone()) setTimeout(levelDone, 700);
}

// ------------------------------------------------------------------ پایان مرحله
function modal(html) { $('box').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }
async function levelDone() {
  if (cur.over) return;
  cur.over = true; sfx.win(); buzz(60);
  const first = cur.i >= P.done;
  let got = 0;
  if (first) { const reward = 10 + cur.i; const r = await eco('add', reward); got = (r.extra !== undefined && r.ok) ? r.extra : 0; setCoins(r.bal); P.done = cur.i + 1; save(); }
  const last = cur.i >= LV.length - 1;
  modal('<div class="big">🎉</div><h2>آفرین! مرحله ' + fa(cur.i + 1) + ' تمام شد</h2>' +
    (first ? (got > 0 ? '<div style="font-size:20px;font-weight:900;margin:8px 0">+' + fa(got) + ' <span class="cn"></span> سکه</div>' : '<div style="color:#ffd9a0">سقف سکهٔ امروز پر شده است</div>') : '<div style="color:#ffd9a0">این مرحله را قبلاً گرفته بودید</div>') +
    (last ? '<div style="margin-top:8px">همهٔ مرحله‌ها را تمام کردید! 🏆 به‌زودی مرحله‌های بیشتری اضافه می‌شود.</div><button class="btn gh" onclick="restartAll()">بازی از مرحلهٔ ۱</button>' : '<button class="btn" onclick="nextLevel()">مرحلهٔ بعد ◀</button>') +
    '<button class="btn gh" onclick="closeModal()">بستن</button>');
}
function nextLevel() { closeModal(); loadLevel(cur.i + 1); }
function restartAll() { closeModal(); loadLevel(0); }

// ------------------------------------------------------------------ فهرست مرحله‌ها و تنظیمات
function levelsModal() {
  let g = '';
  for (let i = 0; i < LV.length; i++) {
    const ok = i < P.done, open = i <= P.done;
    g += '<button class="ib" style="width:100%;height:46px;font-size:15px;' + (ok ? '' : open ? 'background:linear-gradient(#35c85f,#1b8a3a);box-shadow:0 3px 0 #0e5a24' : 'background:#3a2f22;box-shadow:none;opacity:.55') + '" ' + (open ? 'onclick="closeModal();loadLevel(' + i + ')"' : 'disabled') + '>' + (open ? fa(i + 1) : '🔒') + '</button>';
  }
  modal('<h2>مرحله‌ها</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">' + g + '</div><button class="btn gh" onclick="closeModal()">بستن</button>');
}
function sw(k, on) { return '<div class="sw' + (on ? ' on' : '') + '" onclick="tg(\'' + k + '\')"></div>'; }
function tg(k) { P.set[k] = P.set[k] ? 0 : 1; save(); if (k === 'snd' && P.set.snd) sfx.ok(); settings(); }
function setv(k, v) { P.set[k] = v; save(); if (k === 'bg') setScene(); if (k === 'tile') document.body.dataset.tile = v; settings(); }
function settings() {
  const bgc = '<i class="' + (P.set.bg < 0 ? 'on' : '') + '" onclick="setv(\'bg\',-1)">خودکار</i>' + TH.map((t, i) => '<i class="' + (P.set.bg === i ? 'on' : '') + '" onclick="setv(\'bg\',' + i + ')">' + t.n.split('،')[0] + '</i>').join('');
  const tc = ['قهوه‌ای', 'بنفش', 'سبزآبی', 'نارنجی'].map((n, i) => '<i class="' + (P.set.tile === i ? 'on' : '') + '" onclick="setv(\'tile\',' + i + ')">' + n + '</i>').join('');
  modal('<h2>⚙️ تنظیمات</h2>' +
    '<div class="st"><span>صدا</span>' + sw('snd', P.set.snd) + '</div>' +
    '<div class="st"><span>بلندی صدا</span><input type="range" min="0" max="100" value="' + P.set.vol + '" oninput="P.set.vol=+this.value;save()" onchange="sfx.ok()"></div>' +
    '<div class="st"><span>لرزش</span>' + sw('vib', P.set.vib) + '</div>' +
    '<div class="st" style="display:block"><div style="margin-bottom:8px">پس‌زمینه</div><div class="ch">' + bgc + '</div></div>' +
    '<div class="st" style="display:block"><div style="margin-bottom:8px">رنگ خانه‌های جدول</div><div class="ch">' + tc + '</div></div>' +
    '<div class="st"><span>هزینهٔ راهنما</span><b>' + fa(HINT_COST) + ' سکه</b></div>' +
    '<button class="btn rd" onclick="resetAll()">شروع دوباره (پاک کردن پیشرفت)</button>' +
    '<button class="btn" onclick="closeModal()">بستن</button>');
}
function resetAll() {
  if (!confirm('همهٔ پیشرفت مرحله‌ها پاک شود؟ (سکه‌های شما حفظ می‌شود)')) return;
  P.lvl = 0; P.done = 0; P.st = {}; save(); closeModal(); loadLevel(0);
}

// ------------------------------------------------------------------ شروع
async function boot() {
  document.body.dataset.tile = P.set.tile;
  const w = $('wheel');
  w.addEventListener('pointerdown', onDown); w.addEventListener('pointermove', onMove);
  w.addEventListener('pointerup', onUp); w.addEventListener('pointercancel', onUp);
  $('sh').onclick = () => { shuffleOrder(false); sfx.tap(2); };
  $('hint').onclick = hint; $('gear').onclick = settings; $('skip').onclick = levelsModal;
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  window.addEventListener('resize', () => { if (cur) { drawGrid(); drawWheel(); } });
  loadLevel(Math.min(P.lvl, Math.max(0, Math.min(P.done, LV.length - 1))));
  const r = await eco('bal'); setCoins(r.bal);
}
boot();
</script>
