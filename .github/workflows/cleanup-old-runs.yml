name: Cleanup Old Workflow Runs

# این ورک‌فلو هر روز به‌صورت خودکار اجرا می‌شود و اجراهای قدیمی‌تر
# از ۲ روز را از تب Actions پاک می‌کند (فقط اجراهای تمام‌شده —
# اجراهای در حال اجرا/در صف دست‌نخورده می‌مانند). همچنین از تب
# Actions با «Run workflow» هم قابل اجرای دستی است.

on:
  schedule:
    - cron: '0 2 * * *'   # هر روز ساعت ۲ بامداد UTC (۵:۳۰ صبح به وقت ایران)
  workflow_dispatch:
    inputs:
      days:
        description: 'حذف اجراهای قدیمی‌تر از چند روز'
        required: false
        default: '2'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DAYS: ${{ github.event.inputs.days || '2' }}
        run: |
          set -euo pipefail

          cutoff_ts=$(date -u -d "-${DAYS} days" +%s)
          echo "Deleting runs finished before $(date -u -d "-${DAYS} days")"

          deleted=0

          workflow_ids=$(gh api "repos/${REPO}/actions/workflows" --paginate --jq '.workflows[].id')

          for wf_id in $workflow_ids; do
            gh api "repos/${REPO}/actions/workflows/${wf_id}/runs" \
              --paginate \
              --jq '.workflow_runs[] | select(.status == "completed") | "\(.id)|\(.created_at)"' |
            while IFS='|' read -r run_id created_at; do
              run_ts=$(date -u -d "${created_at}" +%s)
              if [ "${run_ts}" -lt "${cutoff_ts}" ]; then
                echo "Deleting run ${run_id} (created ${created_at})"
                gh api -X DELETE "repos/${REPO}/actions/runs/${run_id}" || true
              fi
            done
          done

          echo "Cleanup finished."
