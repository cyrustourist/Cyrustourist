name: Build CyrusTourist APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(grep '^version:' pubspec.yaml | sed 's/version: *//')"
          NAME="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          MAJOR="$(echo "$NAME" | cut -d. -f1)"
          MINOR="$(echo "$NAME" | cut -d. -f2)"
          PATCH="$(echo "$NAME" | cut -d. -f3)"
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH+$NEW_BUILD"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "Old version: $CURRENT -> New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        shell: bash
        env:
          CYRUS_KEYSTORE_BASE64: ${{ secrets.CYRUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cyrus-signing"
          printf '%s' "$CYRUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"
          test -s "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"
          echo "Keystore decoded successfully."

      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"
          echo "Keystore verification successful."

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed APK
        shell: bash
        env:
          CYRUS_KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          CYRUS_STORE_PASSWORD: ${{ secrets.CYRUS_STORE_PASSWORD }}
          CYRUS_KEY_PASSWORD: ${{ secrets.CYRUS_KEY_PASSWORD }}
          CYRUS_KEY_ALIAS: ${{ secrets.CYRUS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --android-skip-build-dependency-validation
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "SIGNED APK BUILD SUCCESSFUL."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          echo "APK signature verification successful."

      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Cyrustourist.ir.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist.ir
          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk
          if-no-files-found: error

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cyrus-signing"
