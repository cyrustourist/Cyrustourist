name: Download offline tiles

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Compare all tiles with OSM and replace changed ones"
        type: boolean
        default: true
      tile_url:
        description: "Optional tile URL template with {z}/{x}/{y} (empty = OpenStreetMap)"
        type: string
        default: ""
  schedule:
    # first day of every 3rd month, 03:00 UTC
    - cron: "0 3 1 */3 *"

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download / refresh tiles
        id: dl
        env:
          TILE_URL_INPUT: ${{ inputs.tile_url }}
        run: |
          set -euo pipefail
          if [ -n "${TILE_URL_INPUT:-}" ]; then export TILE_URL="$TILE_URL_INPUT"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            python3 tools/download_offline_tiles.py --refresh
          else
            python3 tools/download_offline_tiles.py
          fi
          ls assets/tiles | wc -l

      - name: Commit tiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tiles tools/tiles_etags.json
          if git diff --cached --quiet; then
            echo "No new or changed tiles."
          else
            git commit -m "chore: refresh offline base map tiles [skip ci]"
            git push
          fi
