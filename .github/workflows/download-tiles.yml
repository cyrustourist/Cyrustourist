name: Download offline tiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download tiles
        run: |
          set -euo pipefail
          python3 tools/download_offline_tiles.py
          ls assets/tiles | wc -l

      - name: Commit tiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tiles
          if git diff --cached --quiet; then
            echo "No new tiles."
          else
            git commit -m "chore: add offline base map tiles [skip ci]"
            git push
          fi
