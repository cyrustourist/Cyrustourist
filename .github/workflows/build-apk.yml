name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 3. Flutter version
      # ==========================================================

      - name: Flutter version
        run: flutter --version


      # ==========================================================
      # 4. Verify Android project
      # ==========================================================

      - name: Verify Android project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory is missing."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: android/app/build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml is missing."
            exit 1
          fi

          echo "Android project found."


      # ==========================================================
      # 5. Verify JPG assets
      # ==========================================================

      - name: Verify JPG assets
        run: |
          echo "===== assets/images ====="

          find assets/images -maxdepth 1 -type f -print | sort

          echo ""
          echo "===== Required files ====="

          test -f assets/images/splash.jpg
          test -f assets/images/home.jpg

          echo "splash.jpg: OK"
          echo "home.jpg: OK"


      # ==========================================================
      # 6. Get dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 7. Verify Flutter assets
      # ==========================================================

      - name: Verify pubspec assets
        run: |
          grep -n "assets/images" pubspec.yaml

          echo ""
          echo "Checking Dart references..."

          if grep -R "splash.png" lib; then
            echo "ERROR: splash.png reference still exists."
            exit 1
          fi

          if grep -R "home.png" lib; then
            echo "ERROR: home.png reference still exists."
            exit 1
          fi

          echo "JPG references verified."


      # ==========================================================
      # 8. Analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze || true


      # ==========================================================
      # 9. Create temporary RELEASE keystore
      #
      # IMPORTANT:
      # This key exists only on the GitHub runner.
      # It is NOT committed to the public repository.
      #
      # The old production key is NOT touched.
      # ==========================================================

      - name: Create temporary release keystore
        shell: bash
        run: |
          set -e

          mkdir -p android/app/temporary-signing

          STORE_PASSWORD="$(openssl rand -hex 16)"
          KEY_PASSWORD="$(openssl rand -hex 16)"

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool \
            -genkeypair \
            -v \
            -keystore android/app/temporary-signing/cyrustourist-test.jks \
            -storetype JKS \
            -alias cyrustourist_test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CyrusTourist Test, OU=CyrusTourist, O=CyrusTourist, L=Test, ST=Test, C=AZ"

          echo "Temporary release keystore created."


      # ==========================================================
      # 10. Configure temporary release signing
      #
      # This changes the Android Gradle file ONLY inside the
      # temporary GitHub runner.
      # Nothing is committed back to GitHub.
      # ==========================================================

      - name: Configure temporary release signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          signing_block = r'''
              signingConfigs {
                  create("cyrusTouristTest") {
                      storeFile = file("temporary-signing/cyrustourist-test.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = "cyrustourist_test"
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          if 'create("cyrusTouristTest")' not in text:
              text = text.replace(
                  '    buildTypes {',
                  signing_block + '    buildTypes {',
                  1
              )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("cyrusTouristTest")'
          )

          path.write_text(text)
          PY

          echo "Temporary release signing configured."


      # ==========================================================
      # 11. Verify package configuration
      # ==========================================================

      - name: Verify Android package
        run: |
          echo "===== Package ====="

          grep -n \
            'applicationId = "cyrustourist.ir.app"' \
            android/app/build.gradle.kts

          echo ""
          echo "===== Namespace ====="

          grep -n \
            'namespace = "cyrustourist.ir.app"' \
            android/app/build.gradle.kts

          echo ""
          echo "===== Signing ====="

          grep -n \
            'cyrusTouristTest' \
            android/app/build.gradle.kts


      # ==========================================================
      # 12. Clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 13. Dependencies after clean
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 14. Build ARM64 RELEASE APK
      #
      # Motorola G54 5G test target.
      # No universal APK.
      # ==========================================================

      - name: Build ARM64 release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64


      # ==========================================================
      # 15. Verify APK
      # ==========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "CyrusTourist ARM64 RELEASE APK"
          echo "=============================================="

          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"

          sha256sum "$APK"


      # ==========================================================
      # 16. Rename APK
      # ==========================================================

      - name: Rename APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir-arm64-test.apk


      # ==========================================================
      # 17. Upload APK
      # ==========================================================

      - name: Upload ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist-ARM64-Test
          path: build/app/outputs/flutter-apk/Cyrustourist.ir-arm64-test.apk
          if-no-files-found: error
