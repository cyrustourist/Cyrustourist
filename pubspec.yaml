name: cyrustourist_app3
description: CyrusTourist tourism app - splash, home and smart tourism map.
publish_to: "none"

version: 5.7.2+5720

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash.jpg
    - assets/images/home.jpg
    - assets/images/logo-new.jpg
