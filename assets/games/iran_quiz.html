html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Tahoma,"Vazirmatn",system-ui,sans-serif}
body{background:radial-gradient(120% 60% at 50% 0%,#12385a 0%,#08182b 45%,#050d1a 100%) fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

h1{margin:6px 0 2px;text-align:center;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(255,201,40,.45)}

.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 auto;border:2px solid var(--ln);border-radius:16px;padding:9px 10px;font:inherit;font-size:13.5px;font-weight:800;color:#cfe3ff;background:#0a1c2e;cursor:pointer}
.chip.on{border-color:var(--gold);color:#fff;box-shadow:0 0 12px rgba(255,201,40,.35)}
.btn{width:100%;border:0;border-radius:18px;padding:13px;margin-top:10px;font:inherit;font-size:17px;font-weight:900;color:#1b1300;background:linear-gradient(#ffd54a,#e8a400);cursor:pointer;box-shadow:0 4px 0 #9a6b00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6b00}
.btn.gh{background:#0a1c2e;color:#cfe3ff;border:2px solid var(--ln);box-shadow:none}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;margin:0}
input[type=text]{width:100%;border:2px solid var(--ln);border-radius:14px;padding:10px;margin:5px 0;font:inherit;font-size:15px;color:#fff;background:#08182b;-webkit-user-select:text;user-select:text}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:800;color:#cfe3ff}
.pill{background:#0a1c2e;border:2px solid var(--ln);border-radius:14px;padding:5px 10px}
.pill b{color:var(--gold)}
.bar{height:9px;border-radius:6px;background:#0a1c2e;overflow:hidden;margin:10px 0;direction:ltr}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#35c85f,#ffc928);transition:width .2s linear}
.bar i.low{background:linear-gradient(90deg,#ff5a5a,#ff9d1f)}
.q{font-size:19px;line-height:1.9;font-weight:800;text-align:center;margin:10px 4px 14px;min-height:70px;display:flex;align-items:center;justify-content:center}
.op{display:block;width:100%;text-align:center;border:2px solid #2a5a85;border-radius:16px;padding:13px 8px;margin:8px 0;font:inherit;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(#143a5c,#0c2740);cursor:pointer}
.op:active{transform:scale(.98)}
.op.ok{border-color:#5eea8e;background:linear-gradient(#1fa850,#0f7a36)}
.op.bad{border-color:#ff7a7a;background:linear-gradient(#c93a3a,#8a1f1f)}
.op.off{opacity:.18;pointer-events:none}
.op:disabled{cursor:default}
.cat{display:inline-block;font-size:12.5px;color:#9fb6cc}
.big{font-size:54px;text-align:center}
.res{text-align:center}
.res .t{font-size:24px;font-weight:900;color:var(--gold);margin:6px 0}
.rk{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800}
.mut{color:#9fb6cc;font-size:12.5px;line-height:1.8}
.hd{display:flex;align-items:center;justify-content:space-between}
</style>

let POOL = [];   // هر عضو: {id، cat، make()}
// سؤال‌های قدیمیِ «X در کدام شهر/استان است؟» که همان جاذبه در پایگاه جدید هست حذف می‌شوند تا تکراری نیایند
const _loc = /^(.+?) \(?.*?در کدام (شهر|استان) (است|قرار دارد)؟$/;
const _clean = s => s.replace(/\(.*?\)/g, '').replace(/[ٔ‌]/g, '').trim();
const _inAT = t => { const m = t.match(/^(.+?) در کدام/); if (!m) return false; const s = _clean(m[1]); return AT.some(a => _clean(a.n).includes(s) || s.includes(_clean(a.n))); };
Q_OLD.forEach((q, i) => { if (_loc.test(q[1]) && _inAT(q[1])) return; POOL.push({ id: 'o' + i, cat: q[0], make: () => norm(q) }); });
QX.forEach((q, i) => POOL.push({ id: 'x' + i, cat: q[0], make: () => norm(q) }));
AT.forEach(a => {
  if (a.c) POOL.push({ id: 'c|' + a.n, cat: catOf(a), make: () => {
    const same = (byProv[a.p] || []).map(z => z.c).filter(c => c && c !== a.c), other = CITIES.filter(c => c !== a.c && !same.includes(c));
    const w = [...pickN([...new Set(same)], 1), ...pickN(other, 3)].slice(0, 3);
    return { cat: catOf(a), t: a.n + ' در کدام شهر قرار دارد؟', r: a.c, w: w, n: a.note || (a.n + ' در شهر ' + a.c + '، استان ' + a.p + ' است.') };
  } });
  POOL.push({ id: 'p|' + a.n, cat: catOf(a), make: () => ({ cat: catOf(a), t: a.n + ' در کدام استان قرار دارد؟', r: a.p, w: pickN(PROVS.filter(p => p !== a.p), 3), n: a.note || (a.n + (a.c ? ' در ' + a.c + '،' : ' در') + ' استان ' + a.p + ' است.') }) });
});
Object.keys(byCity).forEach(c => POOL.push({ id: 'rc|' + c, cat: 1, make: () => {
  const r = pickN(byCity[c], 1)[0];
  return { cat: catOf(r), t: 'کدام جاذبه در شهر ' + c + ' قرار دارد؟', r: r.n, w: pickN(AT.filter(z => z.c && z.c !== c).map(z => z.n), 3), n: r.n + ' در ' + c + ' است.' };
} }));
Object.keys(byProv).forEach(p => POOL.push({ id: 'rp|' + p, cat: 1, make: () => {
  const r = pickN(byProv[p], 1)[0];
  return { cat: catOf(r), t: 'کدام جاذبه در استان ' + p + ' قرار دارد؟', r: r.n, w: pickN(AT.filter(z => z.p !== p).map(z => z.n), 3), n: r.n + (r.c ? ' در ' + r.c + ' است.' : ' در این استان است.') };
} }));
PROV.forEach(pc => {
  POOL.push({ id: 'k1|' + pc[0], cat: 0, make: () => ({ cat: 0, t: 'مرکز استان ' + pc[0] + ' کدام شهر است؟', r: pc[1], w: pickN(CAPITALS.filter(c => c !== pc[1]), 3), n: '' }) });
  POOL.push({ id: 'k2|' + pc[1], cat: 0, make: () => ({ cat: 0, t: 'شهر ' + pc[1] + ' مرکز کدام استان است؟', r: pc[0], w: pickN(PROVS.filter(p => p !== pc[0]), 3), n: '' }) });
});

{ const _seen = new Set(); POOL = POOL.reverse().filter(p => { const t = p.make().t; if (_seen.has(t)) return false; _seen.add(t); return true; }).reverse(); }

const S = {scr:'menu', mode:'one', cat:-1, names:['بازیکن ۱','بازیکن ۲'], qs:[], i:0, sc:[0,0], ok:[0,0],
  dl:0, iv:null, locked:false, opts:[], fifty:true, sel:-1, hide:[], rounds:10, snd:true, vol:70, lastTick:-1};
const app = document.getElementById('app');
let best = 0;
try { const sv = JSON.parse(localStorage.getItem('iranquiz_set') || 'null'); if (sv) { S.snd = sv.snd !== false; S.vol = sv.vol | 0 || 70; S.rounds = sv.rounds || 10; } } catch (e) {}
const saveSet = () => { try { localStorage.setItem('iranquiz_set', JSON.stringify({ snd: S.snd, vol: S.vol, rounds: S.rounds })); } catch (e) {} };
// سؤال‌های دیده‌شده: تا همهٔ سؤال‌های یک دسته تمام نشود، سؤال تکراری نمی‌آید
let SEEN = new Set();
try { SEEN = new Set(JSON.parse(localStorage.getItem('iranquiz_seen2') || '[]')); } catch (e) {}
const saveSeen = () => { try { localStorage.setItem('iranquiz_seen2', JSON.stringify([...SEEN].slice(-4000))); } catch (e) {} };

// ---------------------------------------------------------------- صدا
let AC = null;
function tone(f, d, type, v, when) {
  if (!S.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, (v || 0.3) * S.vol / 100), t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
const SFX = {
  good: () => { tone(660, 0.14, 'sine', 0.35); tone(880, 0.14, 'sine', 0.35, 0.11); tone(1319, 0.32, 'triangle', 0.35, 0.22); buzz(30); },
  bad: () => { tone(220, 0.22, 'sawtooth', 0.22); tone(150, 0.38, 'sawtooth', 0.22, 0.17); buzz([60, 40, 90]); },
  time: () => { tone(300, 0.2, 'square', 0.18); tone(200, 0.35, 'square', 0.18, 0.2); },
  tick: () => tone(1000, 0.04, 'square', 0.1),
  tap: () => tone(520, 0.05, 'sine', 0.2),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, 'triangle', 0.35, i * 0.12)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.28, 'triangle', 0.3, i * 0.16))
};
try { best = parseInt(localStorage.getItem('iranquiz_best') || '0', 10) || 0; } catch (e) {}

const chip = (on, act, t) => `<button class="chip ${on ? 'on' : ''}" onclick="${act}">${t}</button>`;

function menu() {
  S.scr = 'menu'; clearInterval(S.iv);
  const two = S.mode === 'two';
  app.innerHTML = `<h1>🗺️ ایران‌شناسی</h1><div class="sub">مسابقهٔ اطلاعات عمومی دربارهٔ ایران · ${fa(POOL.length)} سؤال پایه با گزینه‌های تصادفی · بدون اینترنت</div>
  <div class="card"><h3>حالت بازی</h3><div class="row">${chip(!two, "S.mode='one';menu()", '👤 تک‌نفره')}${chip(two, "S.mode='two';menu()", '👥 دو نفره (روی یک گوشی)')}</div></div>
  <div class="card"><h3>دسته‌بندی سؤال‌ها</h3><div class="row">${chip(S.cat < 0, 'S.cat=-1;menu()', 'همه')}${CATS.map((c, i) => chip(S.cat === i, `S.cat=${i};menu()`, c[0] + ' ' + c[1])).join('')}</div></div>
  <div class="card"><h3>تعداد سؤال هر دور</h3><div class="row">${[10, 20, 30].map(n => chip(S.rounds === n, `S.rounds=${n};saveSet();menu()`, fa(n) + ' سؤال')).join('')}</div>
  <div class="row" style="margin-top:8px">${chip(S.snd, `S.snd=!S.snd;saveSet();if(S.snd)SFX.good();menu()`, S.snd ? '🔊 صدا روشن' : '🔇 صدا خاموش')}${chip(false, `S.vol=S.vol>=100?30:S.vol+35;if(S.vol>100)S.vol=100;saveSet();SFX.tap();menu()`, '🔉 بلندی: ' + fa(S.vol) + '٪')}</div></div>
  ${two ? `<div class="card"><h3>نام بازیکن‌ها</h3><input type="text" maxlength="14" value="${esc(S.names[0])}" oninput="S.names[0]=this.value||'بازیکن ۱'"><input type="text" maxlength="14" value="${esc(S.names[1])}" oninput="S.names[1]=this.value||'بازیکن ۲'"></div>` : `<div class="card mut">هر سؤال ${fa(TIME)} ثانیه وقت دارد و پاسخ سریع‌تر امتیاز بیشتری می‌دهد. یک بار «حذف دو گزینه» دارید. تا همهٔ سؤال‌ها را نبینید، سؤال تکراری نمی‌آید.<br>🏆 بهترین امتیاز شما: <b style="color:#ffc928">${fa(best)}</b></div>`}
  <button class="btn" onclick="start()">شروع بازی ▶</button>`;
}

function start() {
  SFX.tap();
  const pool = POOL.filter(q => S.cat < 0 || q.cat === S.cat);
  let fresh = pool.filter(q => !SEEN.has(q.id));
  if (fresh.length < S.rounds) { pool.forEach(q => SEEN.delete(q.id)); fresh = pool; }   // همه را دیده‌اید: دور تازه
  S.qs = shuffle(fresh).slice(0, S.rounds).map(q => { const m = q.make(); m.id = q.id; return m; });
  S.qs.forEach(q => SEEN.add(q.id)); saveSeen();
  S.i = 0; S.sc = [0, 0]; S.ok = [0, 0]; S.fifty = true; ask();
}

function who() { return S.mode === 'two' ? S.i % 2 : 0; }

function ask() {
  const q = S.qs[S.i];
  S.scr = 'q'; S.locked = false; S.sel = -1; S.hide = []; S.lastTick = -1;
  S.opts = shuffle([q.r, ...q.w]);
  S.dl = Date.now() + TIME * 1000;
  draw(); clearInterval(S.iv); S.iv = setInterval(tick, 200);
}

function draw() {
  const q = S.qs[S.i], c = CATS[q.cat], two = S.mode === 'two', w = who();
  const right = S.opts.indexOf(q.r);
  app.innerHTML = `<div class="top"><div class="pill">${two ? esc(S.names[w]) + ' · ' : ''}امتیاز <b>${fa(S.sc[w])}</b></div><div class="pill">سؤال <b>${fa(S.i + 1)}</b> از ${fa(S.qs.length)}</div><div class="pill" id="tm">⏱ <b>${fa(TIME)}</b></div></div>
  <div class="bar"><i id="br"></i></div>
  <div class="card"><span class="cat">${c[0]} ${c[1]}</span><div class="q">${esc(q.t)}</div>
  ${S.opts.map((o, k) => {
    let cl = 'op';
    if (S.hide.includes(k)) cl += ' off';
    if (S.locked) { if (k === right) cl += ' ok'; else if (k === S.sel) cl += ' bad'; }
    return `<button class="${cl}" ${S.locked ? 'disabled' : ''} onclick="pick(${k})">${esc(o)}</button>`;
  }).join('')}${S.locked && q.n ? `<div class="mut" style="margin-top:10px;text-align:center">💡 ${esc(q.n)}</div>` : ''}</div>
  <div class="row">${!two && S.fifty && !S.locked ? '<button class="btn gh sm" onclick="useFifty()">✂️ حذف دو گزینه</button>' : ''}${S.locked ? '<button class="btn sm" onclick="nextQ()" style="margin-inline-start:auto">' + (S.i + 1 >= S.qs.length ? 'نتیجه ◀' : 'سؤال بعد ◀') + '</button>' : ''}</div>`;
  tick();
}

function left() { return Math.max(0, Math.ceil((S.dl - Date.now()) / 1000)); }

function tick() {
  if (S.scr !== 'q' || S.locked) return;
  const l = left(), ms = Math.max(0, S.dl - Date.now());
  const tm = document.getElementById('tm'), br = document.getElementById('br');
  if (tm) tm.innerHTML = '⏱ <b>' + fa(l) + '</b>';
  if (br) { br.style.width = (ms / (TIME * 1000) * 100) + '%'; br.className = l <= 5 ? 'low' : ''; }
  if (l <= 5 && l > 0 && l !== S.lastTick) { S.lastTick = l; SFX.tick(); }
  if (ms <= 0) pick(-1);
}

function useFifty() {
  if (!S.fifty || S.locked) return;
  const q = S.qs[S.i], right = S.opts.indexOf(q.r);
  const wrong = shuffle([0, 1, 2, 3].filter(k => k !== right)).slice(0, 2);
  S.hide = wrong; S.fifty = false; draw();
}

function pick(k) {
  if (S.locked) return;
  S.locked = true; S.sel = k; clearInterval(S.iv);
  const q = S.qs[S.i], w = who(), good = k >= 0 && S.opts[k] === q.r;
  if (good) { S.sc[w] += 100 + left() * 6; S.ok[w]++; SFX.good(); } else if (k < 0) SFX.time(); else SFX.bad();
  draw();
  if (S.mode === 'one') setTimeout(() => { if (S.scr === 'q' && S.locked) nextQ(); }, q.n ? 3200 : 1800);
}

function nextQ() {
  if (S.scr !== 'q') return;
  S.i++;
  if (S.i >= S.qs.length) end(); else ask();
}

function title(n) {
  n = Math.round(n * 10 / S.qs.length);
  return n >= 9 ? 'ایران‌شناس حرفه‌ای 🏆' : n >= 7 ? 'راهنمای ماهر 🧭' : n >= 5 ? 'ایران‌گرد 🎒' : n >= 3 ? 'مسافر علاقه‌مند 🚌' : 'گردشگر تازه‌کار 🌱';
}

function end() {
  S.scr = 'end'; clearInterval(S.iv);
  if (S.mode === 'one') {
    S.ok[0] >= Math.ceil(S.qs.length * 0.6) ? SFX.win() : SFX.lose();
    const nb = S.sc[0] > best;
    if (nb) { best = S.sc[0]; try { localStorage.setItem('iranquiz_best', String(best)); } catch (e) {} }
    app.innerHTML = `<div class="card res"><div class="big">${S.ok[0] >= S.qs.length * 0.7 ? '🏆' : '🎯'}</div><div class="t">${title(S.ok[0])}</div>
    <div class="rk"><span>پاسخ درست</span><b>${fa(S.ok[0])} از ${fa(S.qs.length)}</b></div>
    <div class="rk"><span>امتیاز</span><b>${fa(S.sc[0])}</b></div>
    <div class="rk"><span>بهترین امتیاز</span><b>${fa(best)}${nb ? ' 🎉 رکورد جدید' : ''}</b></div></div>
    <button class="btn" onclick="start()">بازی دوباره ↻</button><button class="btn gh" onclick="menu()">منوی اصلی</button>`;
  } else {
    SFX.win();
    const a = S.sc[0], b = S.sc[1];
    const win = a === b ? 'مساوی شدید 🤝' : '🏆 برنده: ' + esc(S.names[a > b ? 0 : 1]);
    app.innerHTML = `<div class="card res"><div class="big">🎉</div><div class="t">${win}</div>
    ${[0, 1].map(p => `<div class="rk"><span>${esc(S.names[p])}</span><b>${fa(S.sc[p])} امتیاز · ${fa(S.ok[p])} درست</b></div>`).join('')}</div>
    <button class="btn" onclick="start()">بازی دوباره ↻</button><button class="btn gh" onclick="menu()">منوی اصلی</button>`;
  }
}

menu();
</script>
</body>
</html>
