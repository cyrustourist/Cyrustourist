name: Build CyrusTourist APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Decode CyrusTourist release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cyrus-signing"
          printf '%s' "" \
            | base64 --decode \
            > "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"
          test -s "$RUNNER_TEMP/cyrus-signing/cyrus-tourist.jks"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK with retry
        shell: bash
        env:
          CYRUS_KEYSTORE_PATH: ${{ runner.temp }}/cyrus-signing/cyrus-tourist.jks
          CYRUS_STORE_PASSWORD: "3TKEhO3Xta9QYWwnzOPf"
          CYRUS_KEY_PASSWORD: "3TKEhO3Xta9QYWwnzOPf"
          CYRUS_KEY_ALIAS: "CyrusTourist"
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "========================================"
            echo "APK BUILD ATTEMPT: $attempt / 5"
            echo "========================================"
            if flutter build apk \
              --release \
              --target-platform android-arm64 \
              --android-skip-build-dependency-validation; then
              echo "APK BUILD SUCCESSFUL"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "APK BUILD FAILED AFTER 5 ATTEMPTS"
              exit 1
            fi
            echo "Build failed. Waiting 30 seconds before retry..."
            sleep 30
          done

      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist.ir
          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/cyrus-signing"
