name: Build CyrusTourist APK - Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 3. Flutter / Dart version
      # ==========================================================

      - name: Flutter version
        run: |
          flutter --version
          echo ""
          dart --version


      # ==========================================================
      # 4. Verify Android project
      # ==========================================================

      - name: Verify Android project
        run: |
          set -e

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project: OK"


      # ==========================================================
      # 5. Verify JPG assets
      # ==========================================================

      - name: Verify JPG assets
        run: |
          set -e

          echo "===== assets/images ====="

          find assets/images \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "===== Required JPG files ====="

          test -f assets/images/splash.jpg
          test -f assets/images/home.jpg

          echo "splash.jpg: OK"
          echo "home.jpg: OK"


      # ==========================================================
      # 6. Verify pubspec
      # ==========================================================

      - name: Verify pubspec
        run: |
          set -e

          echo "===== pubspec assets ====="

          grep -n "assets/images" pubspec.yaml

          echo ""
          echo "===== Project version ====="

          grep -n "^version:" pubspec.yaml


      # ==========================================================
      # 7. Verify Dart image references
      # ==========================================================

      - name: Verify Dart JPG references
        run: |
          set -e

          echo "===== Checking PNG references ====="

          if grep -R -n \
            --include="*.dart" \
            -E "splash\.png|home\.png" \
            lib; then

            echo ""
            echo "ERROR: PNG reference found in lib."
            exit 1

          fi

          echo "No splash.png/home.png references found."

          echo ""
          echo "===== JPG references ====="

          grep -R -n \
            --include="*.dart" \
            -E "splash\.jpg|home\.jpg" \
            lib


      # ==========================================================
      # 8. Get dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 9. Flutter analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze


      # ==========================================================
      # 10. Show Android configuration
      # ==========================================================

      - name: Show Android configuration
        run: |
          echo "===== android/app/build.gradle.kts ====="
          cat android/app/build.gradle.kts

          echo ""
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml


      # ==========================================================
      # 11. Create temporary RELEASE keystore
      #
      # TEST ONLY
      # Never saved into repository.
      # ==========================================================

      - name: Create temporary release keystore
        shell: bash
        run: |
          set -e

          mkdir -p android/app/temporary-signing

          STORE_PASSWORD="$(openssl rand -hex 16)"
          KEY_PASSWORD="$(openssl rand -hex 16)"

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool \
            -genkeypair \
            -v \
            -keystore android/app/temporary-signing/cyrustourist-test.jks \
            -storetype JKS \
            -alias cyrustourist_test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CyrusTourist Test, OU=CyrusTourist, O=CyrusTourist, L=Test, ST=Test, C=AZ"

          echo ""
          echo "Temporary release keystore created."


      # ==========================================================
      # 12. Configure temporary RELEASE signing
      # ==========================================================

      - name: Configure temporary release signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          signing_block = r'''
              signingConfigs {
                  create("cyrusTouristTest") {
                      storeFile = file("temporary-signing/cyrustourist-test.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = "cyrustourist_test"
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          if 'create("cyrusTouristTest")' not in text:

              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: buildTypes block was not found."
                  )

              text = text.replace(
                  marker,
                  signing_block + marker,
                  1
              )

          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = 'signingConfig = signingConfigs.getByName("cyrusTouristTest")'

          if old in text:
              text = text.replace(old, new, 1)

          elif new not in text:
              raise SystemExit(
                  "ERROR: Release signing configuration could not be configured."
              )

          path.write_text(text)

          print("Temporary RELEASE signing configured.")
          PY


      # ==========================================================
      # 13. Verify temporary signing configuration
      # ==========================================================

      - name: Verify temporary signing
        run: |
          set -e

          echo "===== Temporary signing configuration ====="

          grep -n \
            "cyrusTouristTest" \
            android/app/build.gradle.kts

          echo ""
          echo "Temporary signing configuration: OK"


      # ==========================================================
      # 14. Clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 15. Get dependencies again
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 16. Build ARM64 RELEASE APK
      # ==========================================================

      - name: Build ARM64 release APK
        run: |
          set -e

          flutter build apk \
            --release \
            --target-platform android-arm64


      # ==========================================================
      # 17. Locate APK
      # ==========================================================

      - name: Locate APK
        run: |
          set -e

          echo "===== APK files ====="

          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ==========================================================
      # 18. Find Android SDK build tools
      # ==========================================================

      - name: Find Android build tools
        shell: bash
        run: |
          set -e

          echo "===== Android SDK ====="
          echo "$ANDROID_HOME"

          echo ""
          echo "===== Available Build Tools ====="

          ls -la "$ANDROID_HOME/build-tools"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo ""
          echo "===== Selected Build Tools ====="
          echo "$BUILD_TOOLS"

          echo ""
          echo "===== Tool versions ====="

          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" version
          fi

          if [ -x "$BUILD_TOOLS/aapt2" ]; then
            "$BUILD_TOOLS/aapt2" version
          fi


      # ==========================================================
      # 19. Verify APK exists and calculate SHA256
      # ==========================================================

      - name: Verify APK and SHA256
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=============================================="
          echo "APK FILE"
          echo "=============================================="

          ls -lh "$APK"

          echo ""
          echo "=============================================="
          echo "APK SHA256"
          echo "=============================================="

          sha256sum "$APK"


      # ==========================================================
      # 20. ZIP alignment verification
      # ==========================================================

      - name: Verify APK zip alignment
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "=============================================="
          echo "ZIPALIGN VERIFICATION"
          echo "=============================================="

          if [ -x "$BUILD_TOOLS/zipalign" ]; then

            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          else

            echo "WARNING: zipalign not found."

          fi


      # ==========================================================
      # 21. APK signature verification
      # ==========================================================

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "=============================================="
          echo "APK SIGNATURE"
          echo "=============================================="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"


      # ==========================================================
      # 22. APK Manifest / Package / SDK / ABI
      # ==========================================================

      - name: Inspect APK package SDK and ABI
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "=============================================="
          echo "APK PACKAGE / SDK / ABI"
          echo "=============================================="

          if [ -x "$BUILD_TOOLS/aapt2" ]; then

            "$BUILD_TOOLS/aapt2" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"

          elif [ -x "$BUILD_TOOLS/aapt" ]; then

            "$BUILD_TOOLS/aapt" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"

          else

            echo "WARNING: aapt/aapt2 not found."

          fi


      # ==========================================================
      # 23. Detailed APK contents
      # ==========================================================

      - name: Inspect APK contents
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "=============================================="
          echo "APK CONTENTS"
          echo "=============================================="

          unzip -l "$APK" | head -150

          echo ""
          echo "=============================================="
          echo "NATIVE LIBRARIES / ABI"
          echo "=============================================="

          unzip -l "$APK" \
            | grep "lib/" \
            | awk -F'lib/' 'NF > 1 {print $2}' \
            | cut -d/ -f1 \
            | sort -u

          echo ""
          echo "=============================================="
          echo "ARM64 LIBRARIES"
          echo "=============================================="

          unzip -l "$APK" \
            | grep "lib/arm64-v8a/" \
            | head -50 || true


      # ==========================================================
      # 24. Check APK assets
      # ==========================================================

      - name: Check APK image assets
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "=============================================="
          echo "CHECKING SPLASH / HOME JPG IN APK"
          echo "=============================================="

          echo ""
          echo "Searching APK for splash.jpg:"
          unzip -l "$APK" | grep -i "splash\.jpg" || true

          echo ""
          echo "Searching APK for home.jpg:"
          unzip -l "$APK" | grep -i "home\.jpg" || true

          echo ""
          echo "Flutter asset entries:"
          unzip -l "$APK" | grep -E "flutter_assets" | grep -E "splash|home" || true


      # ==========================================================
      # 25. Check package name from APK
      # ==========================================================

      - name: Verify expected package ID
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo "=============================================="
          echo "EXPECTED PACKAGE ID"
          echo "=============================================="

          EXPECTED="cyrustourist.ir.app"

          if [ -x "$BUILD_TOOLS/aapt2" ]; then
            PACKAGE_LINE="$("$BUILD_TOOLS/aapt2" dump badging "$APK" | grep '^package:' | head -1)"
          else
            PACKAGE_LINE="$("$BUILD_TOOLS/aapt" dump badging "$APK" | grep '^package:' | head -1)"
          fi

          echo "$PACKAGE_LINE"

          echo "$PACKAGE_LINE" | grep -q "name='$EXPECTED'" || {
            echo ""
            echo "ERROR: APK package ID is NOT $EXPECTED"
            exit 1
          }

          echo ""
          echo "Package ID: OK"


      # ==========================================================
      # 26. Check signing certificate fingerprint directly
      # ==========================================================

      - name: Show signing certificate fingerprint
        shell: bash
        run: |
          set -e

          KEYSTORE="android/app/temporary-signing/cyrustourist-test.jks"

          echo "=============================================="
          echo "TEMPORARY KEYSTORE CERTIFICATE"
          echo "=============================================="

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias cyrustourist_test \
            | grep -E \
            "Alias name:|Entry type:|Owner:|SHA256:|SHA1:"


      # ==========================================================
      # 27. Final diagnostic summary
      # ==========================================================

      - name: Final diagnostic summary
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          echo ""
          echo "=================================================="
          echo "CYRUSTOURIST APK DIAGNOSTIC SUMMARY"
          echo "=================================================="

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "SIZE:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

          echo ""
          echo "PACKAGE / SDK / ABI:"

          if [ -x "$BUILD_TOOLS/aapt2" ]; then
            "$BUILD_TOOLS/aapt2" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"
          else
            "$BUILD_TOOLS/aapt" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"
          fi

          echo ""
          echo "SIGNATURE:"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "ZIPALIGN:"

          if [ -x "$BUILD_TOOLS/zipalign" ]; then
            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          fi

          echo ""
          echo "=================================================="
          echo "DIAGNOSTIC BUILD COMPLETED"
          echo "=================================================="


      # ==========================================================
      # 28. Rename APK
      # ==========================================================

      - name: Rename APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir-arm64-test.apk


      # ==========================================================
      # 29. Upload diagnostic APK
      # ==========================================================

      - name: Upload ARM64 diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrustourist-ARM64-Diagnostic
          path: build/app/outputs/flutter-apk/Cyrustourist.ir-arm64-test.apk
          if-no-files-found: error
