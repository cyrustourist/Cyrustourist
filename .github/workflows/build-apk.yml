name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Create Android project
        run: flutter create --platforms=android .


      - name: Remove default test
        run: rm -f test/widget_test.dart


      - name: Configure Android ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/app/build.gradle")

          if file.exists():

              text = file.read_text()

              text = re.sub(
                  r'applicationId\s+"[^"]+"',
                  'applicationId "cyrustourist.ir.app"',
                  text
              )

              text = re.sub(
                  r'namespace\s+"[^"]+"',
                  'namespace "cyrustourist.ir.app"',
                  text
              )

              file.write_text(text)

          PY


      - name: Add Location permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
          "android/app/src/main/AndroidManifest.xml"
          )

          text = file.read_text()

          perms = """
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          """

          if "ACCESS_FINE_LOCATION" not in text:
              text = text.replace(
                  "<manifest",
                  "<manifest" + perms
              )

          file.write_text(text)

          PY


      - name: Configure CyrusTourist icon and name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re


          # logo search

          logos = [
              Path("logo-new.png"),
              Path("assets/images/logo-new.png")
          ]

          logo = None

          for item in logos:
              if item.exists():
                  logo = item
                  break


          res = Path(
          "android/app/src/main/res"
          )

          drawable = res / "drawable"
          values = res / "values"
          values_fa = res / "values-fa"

          drawable.mkdir(
              parents=True,
              exist_ok=True
          )

          values.mkdir(
              parents=True,
              exist_ok=True
          )

          values_fa.mkdir(
              parents=True,
              exist_ok=True
          )


          if logo:

              shutil.copy2(
                  logo,
                  drawable /
                  "cyrustourist_logo.png"
              )

              print("Logo OK")

          else:

              print(
              "Logo not found - continue"
              )


          (values / "strings.xml").write_text(
          """<resources>
          <string name="app_name">CyrusTourist</string>
          </resources>"""
          )


          (values_fa / "strings.xml").write_text(
          """<resources>
          <string name="app_name">سایروس توریست</string>
          </resources>"""
          )


          manifest = Path(
          "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()


          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="@string/app_name"',
              text
          )


          manifest.write_text(text)


          PY


      - name: Get packages
        run: flutter pub get


      - name: Analyze
        run: flutter analyze || true


      - name: Build APK
        run: flutter build apk --release


      - name: Rename APK
        run: |
          cp \
          build/app/outputs/flutter-apk/app-release.apk \
          build/app/outputs/flutter-apk/Cyrustourist.ir.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: Cyrustourist.ir

          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk

          if-no-files-found: error
