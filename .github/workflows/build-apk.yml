name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================================
      # 3. Flutter version
      # ==========================================================

      - name: Flutter version
        run: flutter --version


      # ==========================================================
      # 4. Verify Android project
      # ==========================================================

      - name: Verify Android project
        run: |

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml does not exist."
            exit 1
          fi

          echo "Android project found."
          echo ""

          echo "===== Android files ====="
          find android -maxdepth 3 -type f | sort | head -200

          echo ""

          echo "===== Android package ====="
          grep -R "cyrustourist.ir.app" android/app || true


      # ==========================================================
      # 5. Verify assets
      # ==========================================================

      - name: Verify CyrusTourist assets
        run: |

          echo "===== Assets ====="

          if [ -d "assets/images" ]; then
            find assets/images -maxdepth 1 -type f -print | sort
          else
            echo "WARNING: assets/images does not exist."
          fi

          echo ""

          if [ -f "logo-new.jpg" ]; then
            echo "Root logo:"
            ls -lh logo-new.jpg
          fi


      # ==========================================================
      # 6. Get dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 7. Analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze || true


      # ==========================================================
      # 8. Clean previous build
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 9. Get dependencies after clean
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 10. Build Universal Release APK
      #
      # IMPORTANT:
      # No --split-per-abi
      # No ABI restriction
      # ==========================================================

      - name: Build Release APK
        run: |

          flutter build apk \
            --release


      # ==========================================================
      # 11. Verify generated APK
      # ==========================================================

      - name: Verify generated APK
        run: |

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CyrusTourist APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "APK size:"
          du -h "$APK"


      # ==========================================================
      # 12. Rename APK
      # ==========================================================

      - name: Rename APK
        run: |

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Cyrustourist.ir.apk


      # ==========================================================
      # 13. Upload APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Cyrustourist.ir
          path: build/app/outputs/flutter-apk/Cyrustourist.ir.apk
          if-no-files-found: error
