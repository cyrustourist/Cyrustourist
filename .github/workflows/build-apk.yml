name: Build CyrusTourist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      - name: Configure Android application ID and namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for path in gradle_files:
              if not path.exists():
                  continue

              found = True
              text = path.read_text()

              # applicationId
              text = re.sub(
                  r'applicationId\s*(?:=)?\s*["\'][^"\']+["\']',
                  'applicationId = "cyrustourist.ir.app"'
                  if path.suffix == ".kts"
                  else 'applicationId "cyrustourist.ir.app"',
                  text,
                  count=1
              )

              # namespace
              text = re.sub(
                  r'namespace\s*(?:=)?\s*["\'][^"\']+["\']',
                  'namespace = "cyrustourist.ir.app"'
                  if path.suffix == ".kts"
                  else 'namespace "cyrustourist.ir.app"',
                  text,
                  count=1
              )

              path.write_text(text)

          if not found:
              raise SystemExit("Android app Gradle file was not found.")
          PY

      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("android/app/src/main/kotlin"),
              Path("android/app/src/main/java"),
          ]

          target_package = "cyrustourist.ir.app"
          target_path = Path("cyrustourist/ir/app")

          for root in roots:
              if not root.exists():
                  continue

              for activity in root.rglob("MainActivity.kt"):
                  text = activity.read_text()

                  text = re.sub(
                      r'^\s*package\s+[^\n]+',
                      f'package {target_package}',
                      text,
                      count=1,
                      flags=re.MULTILINE
                  )

                  destination = root / target_path / "MainActivity.kt"
                  destination.parent.mkdir(parents=True, exist_ok=True)

                  destination.write_text(text)

                  if activity != destination:
                      activity.unlink()

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not found.")

          text = manifest.read_text()

          fine = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          coarse = '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'

          additions = []

          if fine not in text:
              additions.append(fine)

          if coarse not in text:
              additions.append(coarse)

          if additions:
              marker = ">"
              index = text.find(marker)

              if index == -1:
                  raise SystemExit("Invalid AndroidManifest.xml")

              permissions = "\n" + "\n".join(additions) + "\n"
              text = text[:index + 1] + permissions + text[index + 1:]

          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyrustourist-app-5.7.0-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
