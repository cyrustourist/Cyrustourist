name: cyrustourist_app3
description: CyrusTourist base app - splash, home and tourist map.
publish_to: "none"

version: 5.8.324+6124

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0

  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # ساعت جهانی دقیق (آفلاین، رایگان، بدون کلید API)
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash.jpg
    - assets/images/home-hero.jpg
    - assets/images/logo-new.jpg
    - assets/images/video_menu_header.png
    - assets/images/showcase-hub.jpg
    - assets/fallback/cities.json
    - assets/fallback/accommodations.json
    - assets/fallback/attractions.json
    - assets/fallback/guides.json
    - assets/fallback/health_tourism.json
    - assets/fallback/notifications.json
    - assets/fallback/settings.json
    - assets/translations/
